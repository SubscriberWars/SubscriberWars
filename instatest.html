    <div class="head">
        <div class="head_text">Instagram Live Follower Count</div>
    </div>
    <div class="main_box">
        <img id="channel_banner" src="/images/banner_placeholder.png">
        <img id="channel_image" src="/images/pfp_placeholder.png">
        <div id="channel_title_container">
            <a id="channel_title" href="" style="text-decoration: none; color: #fff;" title="Visit profile" target="_blank" ></a>
            <i class="fa fa-badge-check"  style="display: none; color: #fff;" id="verified" title=""></i>
        </div>
        <div id="channel_subscribers" class="odometer"></div>
        <div id="subscribers"><i class="fa fa-brand fa-instagram"></i> Instagram Followers</div>
        <div class="bottom_data">
            <div class="bottom_counts">
                <div class="odometer bottom_odometer" id="channel_views"></div>
                <div class="bottom_text"><i class="fa fa-sharp fa-users"></i> Following</div>
            </div>
            <div class="bottom_counts">
                <div class="odometer bottom_odometer" id="channel_videos"></div>
                <div class="bottom_text"><i class="fa fa-sharp fa-video"></i> Posts</div>
            </div>
            <div class="bottom_counts">
                <div class="odometer bottom_odometer" id="channel_abreviation"></div>
                <div class="bottom_text"><i class="fa fa-sharp fa-goal-net"></i> Goal</div>
            </div>
        </div>
    </div>
    <p id="goal01" style="visibility: hidden;"></p>
</body>

<script>
let actualCount = 0; // Store the actual count provided by the API
let estimatedCount = 0;
let previousFollowerCount = 0;
let apiUpdateCount = 0;
let canStartEstimation = false;
let totalGrowth = 0;
let totalElapsedSeconds = 0;

// Function to make the API call and update the estimated count
async function fetchData() {
  try {
    const response = await fetch('https://backend.mixerno.space/instagram/test/jennaortega');
    const data = await response.json();
    const currentFollowerCount = data.user.followerCount;

    // Calculate growth rate between API calls
    if (canStartEstimation) {
      const elapsedSeconds = 60; // 1 minute between calls
      const growth = currentFollowerCount - previousFollowerCount;
      totalGrowth += growth;
      totalElapsedSeconds += elapsedSeconds;

      // Update the estimated count based on the average growth per second
      const averageGrowthPerSecond = totalElapsedSeconds > 0 ? totalGrowth / totalElapsedSeconds : 0;
      estimatedCount = currentFollowerCount + averageGrowthPerSecond * 2; // 2 seconds
    } else {
      canStartEstimation = true;
      estimatedCount = currentFollowerCount;
    }

    // Update UI or perform any other operation with the estimated count
    console.log(`API count: ${estimatedCount.toFixed(0)}`); // Displaying as integer
    channel_views.innerHTML= data.user.following
    channel_videos.innerHTML=data.user.posts
    channel_banner.src=data.user.banner
    channel_image.src=data.user.pfp
    channel_title.innerHTML=data.user.name
    if(data.user.isVerified==true){document.getElementById("verified").style.display="inline"} else {document.getElementById("verified").style.width="0px"}

    // Update the previous follower count for the next iteration
    previousFollowerCount = currentFollowerCount;

    // Increment the API update count
    apiUpdateCount++;
  } catch (error) {
    console.error('Error fetching data:', error);
  }
}

// Function to start the process
function startProcess() {
  // Make the initial API call
  fetchData();

  // Set up a recurring interval for making the API call every 1 minute
  setInterval(fetchData, 1 * 60 * 1000);

  // Set up a recurring interval for estimating the count every 2 seconds
  setInterval(() => {
    // Update the estimated count every 2 seconds
    const elapsedSeconds = 2;
    const averageGrowthPerSecond = totalElapsedSeconds > 0 ? totalGrowth / totalElapsedSeconds : 0;
    estimatedCount += averageGrowthPerSecond * elapsedSeconds;
    console.log(`Estimated count: ${estimatedCount.toFixed(0)}`); // Displaying as integer
    channel_subscribers.innerHTML = estimatedCount.toFixed(0); // Displaying as integer
  }, 2 * 1000);
}

// Start the process
startProcess();
</script>
