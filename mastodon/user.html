<!DOCTYPE html>
<head>
    <title>Live Mastodon Follower Count</title>
    <meta name="description" content="Live Mastodon Follower Count">
    <link rel="stylesheet" href="/css/odometer.css">
    <link rel="stylesheet" href="/css/main.css">
    <script src="/js/odometer.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://code.highcharts.com/highcharts.js"></script>
</head>
<body>
    <div id="count-block">
        <div style="height: 205px; width: 1240px; margin:10px; overflow: hidden; border-radius: 10px; border: 1px solid #000;">
            <img id="headerImage"/>
        </div>
        <img id="logo" src="https://subscriberwars.space/images/pfp_placeholder.png" alt="Avatar" style="top: -225px;"/>
        <h1 id="title" style="top: -227px;">Loading...</h1>
        <div id='followers' class="odometer odometer-auto-theme" style="font-size: 120pt; font-weight: 500; text-align: center; margin: 0px auto; margin-top: 10px; margin-bottom: 10px; position: relative; width: 1260px; top: -227px;">0</div>
        <h2 style="top: -227px;">Followers</h2>
    </div>
    <div id="mini-counts">
        <div id="like-box">
            <div id='following' class="odometer odometer-auto-theme" style="font-size: 30pt; font-weight: 500; text-align: center; margin: 0px auto; margin-top: 10px; margin-bottom: 10px; position: relative; width: 410px;">0</div>
            <h2>Following</h2>
        </div>
        <div id="comment-box">
            <div id='posts' class="odometer odometer-auto-theme" style="font-size: 30pt; font-weight: 500; text-align: center; margin: 0px auto; margin-top: 10px; margin-bottom: 10px; position: relative; width: 410px;">0</div>
            <h2>Statuses</h2>
        </div>
        <div id="api-box">
            <div id='goalcount' class="odometer odometer-auto-theme" style="font-size: 30pt; font-weight: 500; text-align: center; margin: 0px auto; margin-top: 10px; margin-bottom: 10px; position: relative; width: 410px;">0</div>
            <h2>Goal</h2>
        </div>
    </div>
    <div id="graph-block">
        <div id="graph" style="width: 1260px; height: 400px;"></div>
        <p id="graphstat" style="visibility: hidden;"></p>
        <p id="goal01" style="visibility: hidden;"></p>
    </div>
</body>

<script>

var string='';
string +='';

var channel = window.location.href.split('?u=')[1] || '';

function checkForNew(chanid) {

    fetch('https://api.subscriberwars.space/mastodon/u/'+chanid+'').then(res => res.json()).then(data => {
        title.innerHTML = data.display_name
        logo.src = data.avatar
        followers.innerHTML = data.followers_count
        following.innerHTML = data.following_count
        posts.innerHTML=data.statuses_count
        headerImage.src=data.header
        graphstat.innerHTML = data.followers_count
        var yep=(graphstat.innerHTML)
        console.log(yep)
        var injection=yep
        if(graph.series[0].points.length>=900)graph.series[0].data[0].remove();
        graph.series[0].addPoint([Date.now(),parseFloat(injection)])
        if(data.followers_count>=0) {goal01.innerHTML=10-data.followers_count}
        if(data.followers_count>=10) {goal01.innerHTML=(Math.floor(data.followers_count/10)*10)+10}
        if(data.followers_count>=100) {goal01.innerHTML=(Math.floor(data.followers_count/100)*100)+100}
        if(data.followers_count>=1000) {goal01.innerHTML=(Math.floor(data.followers_count/1000)*1000)+1000}
        if(data.followers_count>=10000) {goal01.innerHTML=(Math.floor(data.followers_count/10000)*10000)+10000}
        if(data.followers_count>=100000) {goal01.innerHTML=(Math.floor(data.followers_count/100000)*100000)+100000}
        if(data.followers_count>=1000000) {goal01.innerHTML=(Math.floor(data.followers_count/1000000)*1000000)+1000000}
        if(data.followers_count>=10000000) {goal01.innerHTML=(Math.floor(data.followers_count/10000000)*10000000)+10000000}
        if(data.followers_count>=100000000) {goal01.innerHTML=(Math.floor(data.followers_count/100000000)*100000000)+100000000}
        goalcount.innerHTML=goal01.innerHTML-data.followers_count
    });
}

// Intervals
setInterval(() => {
    checkForNew(channel)
}, 5000);

checkForNew(channel)

</script>
<script>//graph styling
    var graph = new Highcharts.chart({
chart: {
renderTo: 'graph',
type: 'spline',
zoomType: 'x',
backgroundColor: 'transparent',
plotBorderColor: 'transparent'
},
title: {
text: ''
},
xAxis: {
type: 'datetime',
tickPixelInterval: 100,
gridLineColor: '#transparent',
labels: {
    style: {
        color: 'white'
    }
},
minorGridLineColor: '#transparent',
tickColor: 'white',
title: {
    style: {
        color: '#transparent'
    }
}
},
yAxis: {
title: {
  text: ''
},
gridLineColor: '#transparent',
labels: {
    style: {
        color: 'white'
    }
},
lineColor: 'white',
minorGridLineColor: 'transparent',
tickColor: 'white'
},
credits: {
enabled: false,
text: "Subscriberwars.space"
},
series: [{
showInLegend: false,
name: 'Followers',
marker: { enabled: false },
color: '#595aff',
lineColor: '#595aff'
}]
});
</script>
