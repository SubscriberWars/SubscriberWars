<!DOCTYPE html>
<html>
    <head>
        <title>Mastodon User Search</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
        <link rel="stylesheet" href="\css\twitch-search.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
        <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1716761206170121"crossorigin="anonymous"></script>
    </head>
    <body>
        <div class="container">
            <br><br><br>
            <h1 style="text-align: center; color: #fff;">Mastodon User Search</h1>
            <br>
            <form>
                <div style="display: flex; width: 100%;">
                    <input class="form-control mr-sm-2" id="search" placeholder="User To Search For">
                    <button type="submit" class="searchbtn" value="Search"><i class="fa fa-fw fa-search" style="width: 100%;"></i></button>
                </div>
            </form>
            <br>
            <div class="row">
                <a href="" id="link1">
                   <div id="chan1" class="chan-card">
                       <img src="" id="img1" class="pfp">
                       <div id="nam1" class="chan-name"></div>
                       <div id="id1" class="chan-id"></div>
                   </div>
                </a>
                <a href="" id="link2">
                   <div id="chan2" class="chan-card">
                       <img src="" id="img2" class="pfp">
                       <div id="nam2" class="chan-name"></div>
                       <div id="id2" class="chan-id"></div>
                   </div>
                </a>
                <a href="" id="link3">
                   <div id="chan3" class="chan-card">
                       <img src="" id="img3" class="pfp">
                       <div id="nam3" class="chan-name"></div>
                       <div id="id3" class="chan-id"></div>
                   </div>
                </a>
                <a href="" id="link4">
                   <div id="chan4" class="chan-card">
                       <img src="" id="img4" class="pfp">
                       <div id="nam4" class="chan-name"></div>
                       <div id="id4" class="chan-id"></div>
                    </div>
                </a>
                <a href="" id="link5">
                   <div id="chan5" class="chan-card">
                       <img src="" id="img5" class="pfp">
                       <div id="nam5" class="chan-name"></div>
                       <div id="id5" class="chan-id"></div>
                   </div>
                </a>
            </div>
        </div>
    </body>
</html>

<script>
    $(document).ready(function(){

$('form').submit(function(event){
    event.preventDefault()

    var search = $("#search").val()

    channelSearch(search)
})

function channelSearch(search) {
    fetch("https://api.subscriberwars.space/mastodon/search/" + search).then(res => res.json()).then(data => {
       console.log(data)

       img1.src = data.accounts[0].avatar
       nam1.innerHTML = data.accounts[0].display_name
       id1.innerHTML = data.accounts[0].id
       link1.href = "https://subscriberwars.space/mastodon/user?u="+data.accounts[0].id

       img2.src = data.accounts[1].avatar
       nam2.innerHTML = data.accounts[1].display_name
       id2.innerHTML = data.accounts[1].id
       link2.href = "https://subscriberwars.space/mastodon/user?u="+data.accounts[1].id

       img3.src = data.accounts[2].avatar
       nam3.innerHTML = data.accounts[2].display_name
       id3.innerHTML = data.accounts[2].id
       link3.href = "https://subscriberwars.space/mastodon/user?u="+data.accounts[2].id

       img4.src = data.accounts[3].avatar
       nam4.innerHTML = data.accounts[3].display_name
       id4.innerHTML = data.accounts[3].id
       link4.href = "https://subscriberwars.space/mastodon/user?u="+data.accounts[3].id

       img5.src = data.accounts[4].avatar
       nam5.innerHTML = data.accounts[4].display_name
       id5.innerHTML = data.accounts[4].id
       link5.href = "https://subscriberwars.space/mastodon/user?u="+data.accounts[4].id
    })
}
})
</script>
