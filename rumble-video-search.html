<!DOCTYPE html>
<html>
    <head>
        <title>Rumble Video Search</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
        <link rel="stylesheet" href="https://subscriberwars.space/css/yt-search-video.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
        <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1716761206170121"
     crossorigin="anonymous"></script>
    </head>
    <body>
        <div class="container">
            <br><br><br>
            <h1 style="text-align: center; color: #fff;">Rumble Video Search</h1>
            <br>
            <form>
                <div style="display: flex; width: 100%;">
                    <input class="form-control mr-sm-2" id="search" placeholder="Video To Search For">
                    <button type="submit" class="searchbtn" value="Search"><i class="fa fa-fw fa-search" style="width: 100%;"></i></button>
                </div>
            </form>
            <br>
            <div class="row">
                <a href="" id="link1">
                   <div id="chan1" class="chan-card">
                       <img src="" id="img1" class="pfp">
                       <div id="nam1" class="chan-name" style="width: 50%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; left: 200px;"></div>
                       <div id="id1" class="chan-id" style="left:200px"></div>
                   </div>
                </a>
                <a href="" id="link2">
                   <div id="chan2" class="chan-card">
                       <img src="" id="img2" class="pfp">
                       <div id="nam2" class="chan-name" style="width: 50%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; left: 200px;"></div>
                       <div id="id2" class="chan-id" style="left:200px"></div>
                   </div>
                </a>
                <a href="" id="link3">
                   <div id="chan3" class="chan-card">
                       <img src="" id="img3" class="pfp">
                       <div id="nam3" class="chan-name" style="width: 50%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; left: 200px;"></div>
                       <div id="id3" class="chan-id" style="left:200px"></div>
                   </div>
                </a>
                <a href="" id="link4">
                   <div id="chan4" class="chan-card">
                       <img src="" id="img4" class="pfp">
                       <div id="nam4" class="chan-name" style="width: 50%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; left: 200px;"></div>
                       <div id="id4" class="chan-id" style="left:200px"></div>
                    </div>
                </a>
                <a href="" id="link5">
                   <div id="chan5" class="chan-card">
                       <img src="" id="img5" class="pfp">
                       <div id="nam5" class="chan-name" style="width: 50%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; left: 200px;"></div>
                       <div id="id5" class="chan-id" style="left:200px"></div>
                   </div>
                </a>
            </div>
        </div>
        
    </body>

    <script>
$(document).ready(function(){

$('form').submit(function(event){
    event.preventDefault()

    var search = $("#search").val()

    channelSearch(search)
})

function channelSearch(search) {
    fetch("https://api.subscriberwars.space/rumble/v/search/5/" + search).then(res => res.json()).then(data => {
       console.log(data)

       img1.src = data.data.items[0].thumbnail
       nam1.innerHTML = data.data.items[0].title
       id1.innerHTML = data.data.items[0].by.name
       link1.href = "https://subscriberwars.space/rumble-video?u="+data.data.items[0].fid

       img2.src = data.data.items[1].thumbnail
       nam2.innerHTML = data.data.items[1].title
       id2.innerHTML = data.data.items[1].by.name
       link2.href = "https://subscriberwars.space/rumble-video?u="+data.data.items[1].fid

       img3.src = data.data.items[2].thumbnail
       nam3.innerHTML = data.data.items[2].title
       id3.innerHTML = data.data.items[2].by.name
       link3.href = "https://subscriberwars.space/rumble-video?u="+data.data.items[2].fid

       img4.src = data.data.items[3].thumbnail
       nam4.innerHTML = data.data.items[3].title
       id4.innerHTML = data.data.items[3].by.name
       link4.href = "https://subscriberwars.space/rumble-video?u="+data.data.items[3].fid

       img5.src = data.data.items[4].thumbnail
       nam5.innerHTML = data.data.items[4].title
       id5.innerHTML = data.data.items[4].by.name
       link5.href = "https://subscriberwars.space/rumble-video?u="+data.data.items[4].fid
    })
}
})
    </script>
</html>
