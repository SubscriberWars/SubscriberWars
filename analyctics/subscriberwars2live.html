<!DOCTYPE html>
<head>
    <title>Live Subscriber Count</title>
    <meta name="description" content="Subscriber Wars' Live Sub Count">
    <link rel="stylesheet" href="odometer.css">
    <link rel="stylesheet" href="tiktok.css">
    <script src="odometer.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://code.highcharts.com/highcharts.js"></script>
</head>
<body>
    <div id="count-block">
        <img style="margin:10px" id="headerImage" src="https://www.banner.yt/UCMCcezu9B4776VzmPhaTThw?width=1240"/>
        <img id="logo" src="https://subscriberwars.space/logo/SWExtra.png" alt="Avatar"/>
        <h1 id="title" style="top: -227px;">SWExtra</h1>
        <div id='subcount' class="odometer odometer-auto-theme" style="font-size: 120pt; font-weight: 500; text-align: center; margin: 0px auto; margin-top: 10px; margin-bottom: 10px; position: relative; width: 1260px; top: -227px;">0</div>
        <h2 style="top: -227px;">Subscribers</h2>
    </div>
    <div id="chart" style="width:1260px; height:300px; margin: 0px auto; margin-top: 20px; background:#0f0f0f; overflow: hidden; position: relative;"></div>
    <p style='visibility:hidden;'id='s1'></p>
</body>

<script>

function subs() {
    fetch('https://api.subscriberwars.space/subscriberwars2').then(res => res.json()).then(data => {
        subcount.innerHTML = data.subscriberCount
        s1.innerHTML=data.subscriberCount
    });
    var alpha=(s1.innerHTML)

if (chart.series[0].points.length >= 1800) chart.series[0].data[0].remove();
chart.series[0].addPoint([Date.now(),parseFloat(alpha)])
}

// Intervals
setInterval(() => {
    subs()
}, 2000);

subs()

</script>

<script type="text/javascript">

    var chart = new Highcharts.chart({
chart: {
renderTo: 'chart',
type: 'spline',
zoomType: 'x',
backgroundColor: 'transparent',
plotBorderColor: 'transparent'
},
title: {
text: ''
},
xAxis: {
type: 'datetime',
tickPixelInterval: 100,
gridLineColor: '#transparent',
labels: {
    style: {
        color: 'white'
    }
},
minorGridLineColor: '#transparent',
tickColor: '#transparent',
title: {
    style: {
        color: '#transparent'
    }
}
},
yAxis: {
title: {
  text: ''
},
gridLineColor: '#transparent',
labels: {
    style: {
        color: 'white'
    }
},
lineColor: '#transparent',
minorGridLineColor: '#transparent',
tickColor: 'white'
},
credits: {
enabled: true,
text: "SubscriberWars.Space"
},

series: [{
showInLegend: false,
name: 'SWExtra',
marker: { enabled: false },
color: '#ff0000'


}]
});


</script>
