<head>
    <title>YouTube Analytics</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css?family=Roboto:100,200,300,400,500,600,700,800" rel="stylesheet" type="text/css">
    <link href="/css/index.css" rel="stylesheet">
    <script src="https://kit.fontawesome.com/93168af8d4.js" crossorigin="anonymous"></script>
</head>
<body>
    <div class="navbar">
        <a class="nav_button" href="/"><img src="/favicon.ico" height="30px"></a>
        <a class="nav_button" href="/about"> Socials </a>
        <a class="nav_button" href="/compare"> Compare </a>
        <a class="nav_button" href="/analytics"> YouTube Analytics </a>
    </div>
    <br>
    <div class="grid_container">
        <button class="grid_item redirect" onclick="link1()">
            <img id="img1" height="150px">
            <h1 id="nam1"></h1>
        </button>
        <button class="grid_item redirect" onclick="link2()">
            <img id="img2" height="150px">
            <h1 id="nam2"></h1>
        </button>
    </div>
</body>

<script>
    var _1="", _2=""
    function getusers() {
        fetch("https://api.subscriberwars.space/youtube/channel/v2/UCdKLd9f_8ZyDSKxMm16oRww,UClx-t76jqvFTcBxQsQBYJWA").then(res=>res.json()).then(data=>{
            img1.src= data.items[0].snippet.thumbnails.medium.url
            img2.src= data.items[1].snippet.thumbnails.medium.url
            nam1.innerHTML= data.items[0].snippet.title
            nam2.innerHTML= data.items[1].snippet.title
            _1=data.items[0].id
            _2=data.items[1].id
        })
    }
    function link1() {location.href="/analytics/"+_1}
    function link2() {location.href="/analytics/"+_2}
    getusers()
</script>
