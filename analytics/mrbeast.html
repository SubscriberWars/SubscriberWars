    <div style="width: 1260px; margin: 0px auto;">
      <div id='mrbeast' style='width: 1260px; height: 600px; position: relative; background: rgb(26, 26, 26); margin-bottom: 0px;'></div>
      <br>
      <table id="table">
        <thead>
          <tr>
            <th>Date</th>
            <th>Subscribers Gained</th>
            <th>Total Subscribers</th>
          </tr>
        </thead>

    <div style="width: 100%; background-color: #000; height: 50px; text-align: center;">
      <span style="top: 10px; position: relative;">Data by: <a href="https://nia-statistics.com/" target="_blank">Nia Statistics</a> and <a href="https://socialblade.com" target="_blank">SocialBlade</a></span>

  <script>
      function get() {
          fetch('https://nia-statistics.com/mrbeastsubcount')
      .then((res)=>res.json())
      .then(data=> {
          const dimension = data.map((entry)=>entry[0].split("T")[0])
          const subs = data.map((entry)=>entry[1])
          const gain = data.map((entry,index)=>{
              if(index===0) {return 0}
              else{return entry[1]-data[index -1][1]}
          })
          
          const dataTable = document.getElementById('table').getElementsByTagName('tbody')[0];
          let previousSubscribers = null;
  
          data.forEach((entry,index)=>{
            const row = dataTable.insertRow();
            const dateCell = row.insertCell(0);
            const subscriberGainCell = row.insertCell(1);
            const subscribersCell = row.insertCell(2);
            dateCell.textContent= entry[0].split("T")[0];
            subscribersCell.textContent= entry[1].toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
            
            let subscriberGain = 0;
  
            if (previousSubscribers !== null) {
              subscriberGain = entry[1] - previousSubscribers;
              if (subscriberGain > 0) {
                subscriberGainCell.textContent = `+${subscriberGain}`.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
                subscriberGainCell.style.color = 'green';
              } else if (subscriberGain < 0) {
                subscriberGainCell.textContent = subscriberGain.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
                subscriberGainCell.style.color = 'red';
              } else {
                subscriberGainCell.textContent = '--';
                subscriberGainCell.style.color = 'grey';
              }
            }
            previousSubscribers = entry[1];
          })
  
          Highcharts.chart('mrbeast', {
            chart: {
              type: 'spline',
              backgroundColor: 'rgb(26,26,26)',
              zoomType: 'xy',
              style: {
                fontFamily: 'roboto',
                fontWeight: 'bold',
                color: "#fff",
              }
            },
            title: {
              text: 'MrBeast Subscribers',
              style: {
                color: '#fff',
                fontWeight: '500'
              }
            },
            xAxis: {
              title: {
                  text:'Date',
                  style: {
                     color: '#fff',
                     fontWeight: '500'
                  }
              },
              tickInterval: 7,
              labels: {
                style: {
                  color: '#fff',
                  fontWeight: '500'
                }
              },
              categories: dimension
            },
            yAxis: [
              {
              labels: {
                style: {
                  color: '#fff',
                  fontWeight: '500'
                }
              },
              title: {
                text: 'Total Subscribers',
                style: {
                  color: '#fff',
                  fontWeight: '500'
                }
              }
            },
            {
              labels: {
                style: {
                  color: '#fff',
                  fontWeight: '500'
                }
              },
              title: {
                text: 'Subscribers Gained',
                style: {
                  color: '#fff',
                  fontWeight: '500'
                }
              },
              opposite: true,
            }
          ],
            tooltip: {
              shared: true,
              valueSuffix: ''
            },
            credits: {
              enabled: false
            },
            series: [
              {
              yAxis:0,
              name: 'Total',
              showInLegend: false,
              data: subs,
              lineColor:'#ff0000',
              color:'#ff0000',
              lineWidth: 4,
              marker:{
                enabled: false,
              }
  
            },
            {
              yAxis:1,
              name: 'Gain',
              showInLegend: false,
              data: gain,
              lineColor:'#11d2f0',
              color:'#11d2f0',
              lineWidth: 4,
              marker:{
                enabled: false,
              }
            }
          ]
          });
      })
  
      fetch('https://api.subscriberwars.space/socialblade/youtube/UCX6OQ3DkcsbYNE6H8uQQuVA')
      .then((res)=>res.json())
      .then(data=> {
        subscribercount.innerHTML= abbreviateNumber(data.data.statistics.total.subscribers)
        viewcount.innerHTML= data.data.statistics.total.views.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
        videocount.innerHTML= data.data.statistics.total.uploads.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
        sbrank.innerHTML=data.data.misc.grade.grade; document.getElementById('sbrank').style.color=data.data.misc.grade.color;
        srank.innerHTML=data.data.ranks.subscribers.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
        created.innerHTML= data.data.general.created_at;
        UserTopInfoAvatar.src=data.data.general.branding.avatar.replace("s88","s200");
      })
      }
  
      function abbreviateNumber(number) {
      const SI_SYMBOLS = ["", "K", "M", "B", "T"];
      const tier = Math.log10(Math.abs(number)) / 3 | 0;
      const suffix = SI_SYMBOLS[tier];
      const abbreviatedNumber = (number / Math.pow(10, tier * 3)).toPrecision(3) + suffix;
      return abbreviatedNumber;
  }
  
  get()
      
      
  </script>
