    async function fetchData() {
    const apiUrl = '/analytics/mrbeast_data.json';
    const response = await fetch(apiUrl);
    const data = await response.json();

    data.items.forEach(item => {
        item.dateObj = new Date(item.date);
        item.dayOfWeek = item.dateObj.toLocaleDateString('en-US', { weekday: 'short' });
    });

    const tableBody = document.getElementById('subscriberTable').querySelector('tbody');
    
    for (let i = 1; i < data.items.length; i++) {
        const prev = data.items[i - 1];
        const current = data.items[i];

        const subscriberGain = current.subscribers - prev.subscribers;
        const viewGain = current.views - prev.views;

        const formatValue = (value) => {
            if (value > 0) {
                return `<span class="positive">+${value.toLocaleString()}</span>`;
            } else if (value < 0) {
                return `<span class="negative">${value.toLocaleString()}</span>`;
            } else {
                return `<span class="neutral">--</span>`;
            }
        };

        const row = document.createElement('tr');
        row.innerHTML = `
            <td>${current.date}</td>
            <td style="color: gray">${current.dayOfWeek}</td>
            <td>${formatValue(subscriberGain)}</td>
            <td>${current.subscribers.toLocaleString()}</td>
            <td>${formatValue(viewGain)}</td>
            <td>${current.views.toLocaleString()}</td>
        `;

        tableBody.appendChild(row);
    }
}

fetchData();

    async function subact() {
    const apiUrl = 'https://mrbeastsubcount.nia-statistics.com'; // Adjust the path to your new JSON file
    const response = await fetch(apiUrl);
    const data = await response.json();
    
    // Convert date strings to Date objects and sort data by date
    data.forEach(item => {
        item[0] = new Date(item[0]);
    });

    // Filter data for the last 24 hours
    const now = new Date();
    const last24HoursData = data.filter(item => {
        const timeDifference = now - item[0];
        return timeDifference <= 49 * 60 * 60 * 1000; // 24 hours in milliseconds
    });

    // Calculate subscriber gain in the last 24 hours
    const subscriberGain = last24HoursData.reduce((gain, item, index, array) => {
        if (index === 0) return 0; // No gain for the first item
        return gain + (item[1] - array[index - 1][1]);
    }, 0);

    const tableBody = document.getElementById('subscriberActivity').querySelector('tbody');
    tableBody.innerHTML = ''; // Clear existing rows

    // Create a row for each entry in the last 24 hours
    last24HoursData.forEach((item, index) => {
        if (index === 0) return; // Skip the first item as there is no previous data to compare

        const prev = last24HoursData[index - 1];
        const current = item;

        const gain = current[1] - prev[1];

        const formatValue = (value) => {
            if (value > 0) {
                return `<span class="positive">+${value.toLocaleString()}</span>`;
            } else if (value < 0) {
                return `<span class="negative">${value.toLocaleString()}</span>`;
            } else {
                return `<span class="neutral">--</span>`;
            }
        };

        const row = document.createElement('tr');
        row.innerHTML = `
            <td>${current[0].toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</td>
            <td>${formatValue(gain)}</td>
            <td>${current[1].toLocaleString()}</td>
        `;

        tableBody.appendChild(row);
    });
}

    //abbreviater
    function abbreviateNumber(number) {
    const SI_SYMBOLS = ["", "K", "M", "B", "T"];
    const tier = Math.log10(Math.abs(number)) / 3 | 0;
    const suffix = SI_SYMBOLS[tier];
    let abbreviatedNumber = (number / Math.pow(10, tier * 3)).toFixed(1);

    if (Number.isInteger(Number(abbreviatedNumber))) {
        abbreviatedNumber = abbreviatedNumber.replace(/\.0$/, '');
    }

    abbreviatedNumber += suffix;
    return abbreviatedNumber;
    }

    async function chart() {

        item.date = new Date(item.date);
    });

    // Calculate daily changes in subscribers and views
    const dailySubsChange = [];
    const dailyViewsChange = [];

    for (let i = 1; i < data.items.length; i++) {
        const prev = data.items[i - 1];
        const curr = data.items[i];
        const subsChange = curr.subscribers - prev.subscribers;
        const viewsChange = curr.views - prev.views;
        
        dailySubsChange.push([curr.date.getTime(), subsChange]);
        dailyViewsChange.push([curr.date.getTime(), viewsChange]);
    }

    const weeklySubsChange = [];
    const weeklyViewsChange = [];
    const monthlySubsChange = [];
    const monthlyViewsChange = [];

    const weeklyTotalSubs = [];
    const weeklyTotalViews = [];
    const monthlyTotalSubs = [];
    const monthlyTotalViews = [];

    // Helper function to get the start of the week (Sunday)
    function getWeekStart(date) {
        const d = new Date(date);
        const day = d.getDay();
        const diff = d.getDate() - day;
        return new Date(d.setDate(diff));
    }

    // Helper function to get the start of the month
    function getMonthStart(date) {
        return new Date(date.getFullYear(), date.getMonth(), 1);
    }

    // Group data by week
    const weeklyData = data.items.reduce((acc, item) => {
        const weekStart = getWeekStart(item.date).getTime();
        if (!acc[weekStart]) acc[weekStart] = [];
        acc[weekStart].push(item);
        return acc;
    }, {});

    // Calculate weekly changes and totals
    Object.keys(weeklyData).sort().forEach((week, index, weeks) => {
        const currWeek = weeklyData[week];
        const totalSubs = currWeek[currWeek.length - 1].subscribers;
        const totalViews = currWeek[currWeek.length - 1].views;

        weeklyTotalSubs.push([parseInt(week), totalSubs]);
        weeklyTotalViews.push([parseInt(week), totalViews]);

        if (index === 0) return; // skip the first week since there's no previous week to compare to
        const prevWeek = weeklyData[weeks[index - 1]];
        const subsChange = currWeek[currWeek.length - 1].subscribers - prevWeek[prevWeek.length - 1].subscribers;
        const viewsChange = currWeek[currWeek.length - 1].views - prevWeek[prevWeek.length - 1].views;

        weeklySubsChange.push([parseInt(week), subsChange]);
        weeklyViewsChange.push([parseInt(week), viewsChange]);
    });

    // Group data by month
    const monthlyData = data.items.reduce((acc, item) => {
        const monthStart = getMonthStart(item.date).getTime();
        if (!acc[monthStart]) acc[monthStart] = [];
        acc[monthStart].push(item);
        return acc;
    }, {});

    // Calculate monthly changes and totals

        const currMonth = monthlyData[month];
        const totalSubs = currMonth[currMonth.length - 1].subscribers;
        const totalViews = currMonth[currMonth.length - 1].views;

        monthlyTotalSubs.push([parseInt(month), totalSubs]);
        monthlyTotalViews.push([parseInt(month), totalViews]);

        if (index === 0) return; // skip the first month since there's no previous month to compare to
        const prevMonth = monthlyData[months[index - 1]];
        const subsChange = currMonth[currMonth.length - 1].subscribers - prevMonth[prevMonth.length - 1].subscribers;
        const viewsChange = currMonth[currMonth.length - 1].views - prevMonth[prevMonth.length - 1].views;

        monthlyViewsChange.push([parseInt(month), viewsChange]);
    });
