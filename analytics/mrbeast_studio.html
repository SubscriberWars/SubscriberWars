<div id='mrbeast2' style='width: 365px; height: 200px; position: relative; background: rgb(26, 26, 26); margin-bottom: 0px;'></div>

<script>
    function get() {
          fetch('https://nia-statistics.com/mrbeastsubcount')
      .then((res)=>res.json())
      .then(data=> {
        const slicedData = data.slice(3);
    const dimension = slicedData.map((entry) => entry[0].split("T")[0]);
    const subs = slicedData.map((entry) => entry[1]);
    const gain = slicedData.map((entry, index) => {
      if (index === 0) {
        return null;
      } else {
        return entry[1] - slicedData[index - 1][1];
      }
    });
          
  
          Highcharts.chart('mrbeast', {
            chart: {
              type: 'spline',
              backgroundColor: '#000',

              }

              }
            },

                }
              },

                text: '',
                style: {
                  color: '#fff',

                }
              }
            },
          ],
            tooltip: {
              shared: true,
              valueSuffix: ''
            },
            credits: {

            series: [
              {
              yAxis:0,

              data: subs,
