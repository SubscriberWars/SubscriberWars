<table id="data-table">
    <thead>
        <tr>
            <th>Date</th>
            <th>Subscribers</th>
            <th>Views</th>
            <th>Subscriber Gain</th>
            <th>Views Gain</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const apiUrl = 'https://api.subscriberwars.space/sb/yt/history/UCdKLd9f_8ZyDSKxMm16oRww';

  // Fetch data from the API
  fetch(apiUrl)
    .then((response) => response.json())
    .then((data) => {
      if (data && data.data && Array.isArray(data.data.daily)) {
        const reversedData = data.data.daily.reverse();

        const dataTable = document.getElementById('data-table').getElementsByTagName('tbody')[0];

        let previousSubscribers = 0;
        let previousViews = 0;

        reversedData.forEach((entry, index) => {
          const row = dataTable.insertRow();
          const dateCell = row.insertCell(0);
          const subscribersCell = row.insertCell(1);
          const viewsCell = row.insertCell(2);
          const subscriberGainCell = row.insertCell(3);
          const viewGainCell = row.insertCell(4);

          dateCell.textContent = entry.date;
          subscribersCell.textContent = entry.subs;
          viewsCell.textContent = entry.views;

          if (index > 0) { // Check if it's not the first row
            // Calculate subscriber and view gains
            const subscriberGain = entry.subs - previousSubscribers;
            const viewGain = entry.views - previousViews;

            subscriberGainCell.textContent = subscriberGain;
            viewGainCell.textContent = viewGain;
          }

          // Update the previous values for the next iteration
          previousSubscribers = entry.subs;
          previousViews = entry.views;
        });
      } else {
        console.error('Data is not in the expected format. Check the API response.');
      }
    })
    .catch((error) => {
      console.error('Error fetching data:', error);
    });
});
</script>
