<head>

<style>

    .navbar {
        height: 50px;

        display: flex;
        align-items: center;
        justify-content: flex-start;

    }

    .navbutton {
        color: white;
        font-size: 20px;
        font-weight: 600;

        padding: 8px 18px;
        border-radius: 4px;
        display: flex;
        align-items: center;
        height: 34px;
        transition: background-color 0.2s;
    }

    .navbutton:hover {
        background-color: #fff;
        color: #000;
        cursor: pointer;
    }

    .notice {
        width: 1260px;
        margin: auto;
        text-align: center;
        font-size: 30px;
        margin-bottom: 20px;
        background: #830101;
        border-radius: 10px;
        border: 1px solid #ff0000;
        margin-top: 15px;
    }
</style>

<body>
    <div class="notice">
        <span><i class="fa-sharp fa-regular fa-circle-exclamation"></i></span>
        <span>Analytical data by: </span>
        <a href="https://livecounts.xyz" target="_blank">Livecounts.xyz</a>
    </div>
    <div class="topBar">
        <div>
            <img id="bannerImage_0" class="bannerImage">
            <div class="bar">
                <div class="channelInfo">
                    <span id="channelTitle_0" class="channelTitle"></span>
                    <span id="channelTag_0" class="channelTag"></span>
                    <div>
                        <span class="spanStats">

                        <span class="spanStats">

                        </span>
                        <span class="spanStats">
                            <div id="channelVideos_0" class="channelStats"></div>
                            <div class="cat">videos</div>
                        </span>

    <div style="width: 1260px; margin: 0px auto;">
        <div id="UserContainer">
            <div id="userContent"></div>
            <div class="tableContainer">
                <div class="mainHead">Daily Subscribers</div>
                <div class="chart" id="dailySubs"></div>
                <div class="chart" id="dailySubsTotal"></div>
                <div class="mainHead">Daily Views</div>
                <div class="chart" id="dailyViews"></div>

                <table id="subscriberTable">
                    <thead>
                        <tr>
                            <th colspan="2">Date</th>
                            <th colspan="2">Subscribers</th>
                            <th colspan="2">Video Views</th>
                            <th colspan="2">Videos</th>
                        </tr>
                        <tr>
                            <th colspan="2"></th>
                            <th>Gain</th>
                            <th>Total</th>
                            <th>Gain</th>
                            <th>Total</th>
                            <th>Gain</th>
                            <th>Total</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>

</body>

<script>
    var channel = window.location.href.split('?q=')[1] || '';
    const items = []
    var id = ""
    var viewCount = ""
    async function snippet(chanid) {
        const apiUrl = 'https://api.subscriberwars.space/youtube/handle/' + chanid
        const response = await fetch(apiUrl);
        const data = await response.json();
        items[0] = data.items[0];
        id = items[0].id;
        channelImage_0.src = items[0].snippet.thumbnails.medium.url;
        channelTitle_0.innerHTML = items[0].snippet.title;
        pageTitle.innerHTML = items[0].snippet.title + "'s YouTube Analytics";
        channelTag_0.innerHTML = items[0].snippet.customUrl;
        channelSubscribers_0.innerHTML = abbreviateNumber(items[0].statistics.subscriberCount);
        channelViews_0.innerHTML = abbreviateNumber(items[0].statistics.viewCount);
        channelVideos_0.innerHTML = abbreviateNumber(items[0].statistics.videoCount);
        channelPublished_0.innerHTML = items[0].snippet.publishedAt.split("T")[0];
        toChannel.href = "https://youtube.com/" + items[0].snippet.customUrl;
        toCount.href = "/youtube/channel?type=estimate&channel=" + id;
        setTimeout(() => {
            fetchData(id);
        }, 1000);
        bannerImage_0.src = items[0].brandingSettings.image.bannerExternalUrl + "=w1260-fcrop64=1,00005a57ffffa5a8-k-c0xffffffff-no-nd-rj";
    }
    snippet(channel)

    async function fetchData(channelId) {
        if (!channelId) {
            console.error("No channel ID provided");
            return;
        }

        try {
            const apiUrl = `https://livecounts.xyz/api/analytics/youtube/channel/${channelId}`;
            const response = await fetch(apiUrl);

            if (!response.ok) {
                throw new Error(`HTTP error! Status: ${response.status}`);
            }

            const result = await response.json();
            const apiData = result.data?.data.data;

            if (!apiData || !apiData.daily) {
                console.error("No daily data found in API response");
                return;
            }

            let rows = apiData.daily;

            let cumulativeSubscribers = 0;
            let cumulativeViews = 0;
            let cumulativeVideos = 0;

            let seriesData = {
                'Net Subs Change': [],
                'Total Subs': [],
                'Net Views Change': [],
                'Total Views': [],
                'Net Vids Change': [],
                'Total Vids': []
            };

            for (let i = 0; i < rows.length; i++) {
                const current = rows[i];
                const dateStr = current['YYYY-MM-DD'] || current.fullDate;
                if (!dateStr) continue;

                const date = new Date(dateStr).getTime();
                const subsChange = current.subscribers?.change || 0;
                const viewsChange = current.views?.change || 0;
                const vidsChange = current.videos?.change || 0;

                cumulativeSubscribers = current.subscribers?.total ?? (cumulativeSubscribers + subsChange);
                cumulativeViews = current.views?.total ?? (cumulativeViews + viewsChange);
                cumulativeVideos = current.videos?.total ?? (cumulativeVideos + vidsChange);

                seriesData['Net Subs Change'].push([date, subsChange]);
                seriesData['Total Subs'].push([date, cumulativeSubscribers]);
                seriesData['Net Views Change'].push([date, viewsChange]);
                seriesData['Total Views'].push([date, cumulativeViews]);
                seriesData['Net Vids Change'].push([date, vidsChange]);
                seriesData['Total Vids'].push([date, cumulativeVideos]);

                // Prepare table data
                current.dateObj = new Date(dateStr);
                current.dayOfWeek = current.dateObj.toLocaleDateString('en-US', { weekday: 'short' });
                current.subsChange = subsChange;
                current.viewsChange = viewsChange;
                current.vidsChange = vidsChange;
                current.cumulativeSubs = cumulativeSubscribers;
                current.cumulativeView = cumulativeViews;
                current.cumulativeVideos = cumulativeVideos;
            }

            // Populate Table
            const tableBody = document.getElementById('subscriberTable').querySelector('tbody');
            tableBody.innerHTML = '';

            let totalSubsChange = 0;
            let totalViewsChange = 0;
            let totalVidsChange = 0;

            for (let rowData of rows) {
                if (!rowData.dateObj) continue;

                const formatValue = (value) => {
                    if (value > 0) return `<span class="positive">+${value.toLocaleString()}</span>`;
                    if (value < 0) return `<span class="negative">${value.toLocaleString()}</span>`;
                    return `<span class="neutral">--</span>`;
                };

                const tr = document.createElement('tr');
                tr.innerHTML = `
                <td>${rowData.dateObj.toISOString().split('T')[0]}</td>
                <td style="color: gray">${rowData.dayOfWeek}</td>
                <td>${formatValue(rowData.subsChange)}</td>
                <td>${rowData.cumulativeSubs.toLocaleString()}</td>
                <td>${formatValue(rowData.viewsChange)}</td>
                <td>${rowData.cumulativeView.toLocaleString()}</td>
                <td>${formatValue(rowData.vidsChange)}</td>
                <td>${rowData.cumulativeVideos.toLocaleString()}</td>
            `;
                tableBody.appendChild(tr);

                totalSubsChange += rowData.subsChange || 0;
                totalViewsChange += rowData.viewsChange || 0;
                totalVidsChange += rowData.vidsChange || 0;
            }

            // Totals Row
            const totalsRow = document.createElement('tr');
            totalsRow.style.height = '50px';
            totalsRow.style.fontWeight = 'bold';
            totalsRow.innerHTML = `
            <td colspan="2">Totals:</td>
            <td>${totalSubsChange.toLocaleString()}</td>
            <td></td>
            <td>${totalViewsChange.toLocaleString()}</td>
            <td></td>
            <td>${totalVidsChange.toLocaleString()}</td>
            <td></td>
        `;
            tableBody.appendChild(totalsRow);
            allRows = rows;                    // Save all rows globally
            currentPage = Math.ceil(allRows.length / rowsPerPage); // Go to last page

            renderTablePage(currentPage);
            createPaginationControls(allRows.length);

            // Charts
            Highcharts.chart('dailySubs', {
                chart: { type: 'spline', backgroundColor: '#0f0f0f', zoomType: 'x' },
                title: { text: 'Daily Subscriber Change', style: { color: '#fff', fontSize: '28px' } },
                xAxis: { type: 'datetime', dateTimeLabelFormats: { day: '%b %e' }, labels: { style: { color: '#fff' } } },
                yAxis: { title: { text: 'Subscribers', style: { color: '#fff' } }, labels: { style: { color: '#fff' } } },
                tooltip: { valueSuffix: ' subscribers' },
                credits: { enabled: false },
                legend: { enabled: false },
                series: [{ name: 'Net Change', data: seriesData['Net Subs Change'], color: '#ff0000' }]
            });

            Highcharts.chart('dailySubsTotal', {
                chart: { type: 'spline', backgroundColor: '#0f0f0f', zoomType: 'x' },
                title: { text: 'Total Subscribers', style: { color: '#fff', fontSize: '28px' } },
                xAxis: { type: 'datetime', dateTimeLabelFormats: { day: '%b %e' }, labels: { style: { color: '#fff' } } },
                yAxis: { title: { text: 'Subscribers', style: { color: '#fff' } }, labels: { style: { color: '#fff' } } },
                tooltip: { valueSuffix: ' subscribers' },
                credits: { enabled: false },
                legend: { enabled: false },
                series: [{ name: 'Total', data: seriesData['Total Subs'], color: '#ff0000' }]
            });

            Highcharts.chart('dailyViews', {
                chart: { type: 'spline', backgroundColor: '#0f0f0f', zoomType: 'x' },
                title: { text: 'Daily Views Change', style: { color: '#fff', fontSize: '28px' } },
                xAxis: { type: 'datetime', dateTimeLabelFormats: { day: '%b %e' }, labels: { style: { color: '#fff' } } },
                yAxis: { title: { text: 'Views', style: { color: '#fff' } }, labels: { style: { color: '#fff' } } },
                tooltip: { valueSuffix: ' views' },
                credits: { enabled: false },
                legend: { enabled: false },
                series: [{ name: 'Net Change', data: seriesData['Net Views Change'], color: '#ff0000' }]
            });

            Highcharts.chart('dailyViewsTotal', {
                chart: { type: 'spline', backgroundColor: '#0f0f0f', zoomType: 'x' },
                title: { text: 'Total Views', style: { color: '#fff', fontSize: '28px' } },
                xAxis: { type: 'datetime', dateTimeLabelFormats: { day: '%b %e' }, labels: { style: { color: '#fff' } } },
                yAxis: { title: { text: 'Views', style: { color: '#fff' } }, labels: { style: { color: '#fff' } } },
                tooltip: { valueSuffix: ' views' },
                credits: { enabled: false },
                legend: { enabled: false },
                series: [{ name: 'Total', data: seriesData['Total Views'], color: '#ff0000' }]
            });

            Highcharts.chart('dailyVids', {
                chart: { type: 'spline', backgroundColor: '#0f0f0f', zoomType: 'x' },
                title: { text: 'Daily Videos Change', style: { color: '#fff', fontSize: '28px' } },
                xAxis: { type: 'datetime', dateTimeLabelFormats: { day: '%b %e' }, labels: { style: { color: '#fff' } } },
                yAxis: { title: { text: 'Videos', style: { color: '#fff' } }, labels: { style: { color: '#fff' } } },
                tooltip: { valueSuffix: ' videos' },
                credits: { enabled: false },
                legend: { enabled: false },
                series: [{ name: 'Net Change', data: seriesData['Net Vids Change'], color: '#ff0000' }]
            });

            Highcharts.chart('dailyVidsTotal', {
                chart: { type: 'spline', backgroundColor: '#0f0f0f', zoomType: 'x' },
                title: { text: 'Total Videos', style: { color: '#fff', fontSize: '28px' } },
                xAxis: { type: 'datetime', dateTimeLabelFormats: { day: '%b %e' }, labels: { style: { color: '#fff' } } },
                yAxis: { title: { text: 'Videos', style: { color: '#fff' } }, labels: { style: { color: '#fff' } } },
                tooltip: { valueSuffix: ' videos' },
                credits: { enabled: false },
                legend: { enabled: false },
                series: [{ name: 'Total', data: seriesData['Total Vids'], color: '#ff0000' }]
            });

        } catch (error) {
            console.error("Error fetching analytics data:", error);
        }
    }



    //abbreviater
    function abbreviateNumber(number) {
        const SI_SYMBOLS = ["", "K", "M", "B", "T"];
        const tier = Math.log10(Math.abs(number)) / 3 | 0;
        const suffix = SI_SYMBOLS[tier];
        let abbreviatedNumber = (number / Math.pow(10, tier * 3)).toFixed(1);

        if (Number.isInteger(Number(abbreviatedNumber))) {
            abbreviatedNumber = abbreviatedNumber.replace(/\.0$/, '');
        }

        abbreviatedNumber += suffix;
        return abbreviatedNumber;
    }


    // Pagination variables
    let allRows = [];
    const rowsPerPage = 30;
    let currentPage = 1;

    function renderTablePage(page) {
        const tableBody = document.getElementById('subscriberTable').querySelector('tbody');
        tableBody.innerHTML = '';

        const start = (page - 1) * rowsPerPage;
        const end = Math.min(start + rowsPerPage, allRows.length);
        const pageRows = allRows.slice(start, end);

        let totalSubsChange = 0;
        let totalViewsChange = 0;
        let totalVidsChange = 0;

        for (let rowData of pageRows) {
            const formatValue = (value) => {
                if (value > 0) return `<span class="positive">+${value.toLocaleString()}</span>`;
                if (value < 0) return `<span class="negative">${value.toLocaleString()}</span>`;
                return `<span class="neutral">--</span>`;
            };

            const tr = document.createElement('tr');
            tr.innerHTML = `
            <td>${rowData.dateObj.toISOString().split('T')[0]}</td>
            <td style="color: gray">${rowData.dayOfWeek}</td>
            <td>${formatValue(rowData.subsChange)}</td>
            <td>${rowData.cumulativeSubs.toLocaleString()}</td>
            <td>${formatValue(rowData.viewsChange)}</td>
            <td>${rowData.cumulativeView.toLocaleString()}</td>
            <td>${formatValue(rowData.vidsChange)}</td>
                <td>${rowData.cumulativeVideos.toLocaleString()}</td>
        `;
            tableBody.appendChild(tr);

            totalSubsChange += rowData.subsChange || 0;
            totalViewsChange += rowData.viewsChange || 0;
            totalVidsChange += rowData.vidsChange || 0;
        }

        // Totals row for current page
        const totalsRow = document.createElement('tr');
        totalsRow.style.height = '50px';
        totalsRow.style.fontWeight = 'bold';
        totalsRow.innerHTML = `
        <td colspan="2">Page Totals:</td>
        <td>${totalSubsChange.toLocaleString()}</td>
        <td></td>
        <td>${totalViewsChange.toLocaleString()}</td>
        <td></td>
        <td>${totalVidsChange.toLocaleString()}</td>
        <td></td>
    `;
        tableBody.appendChild(totalsRow);
    }

    function createPaginationControls(totalRows) {
        const totalPages = Math.ceil(totalRows / rowsPerPage);

        // Remove old pagination if exists
        let paginationDiv = document.getElementById('tablePagination');
        if (paginationDiv) paginationDiv.remove();

        paginationDiv = document.createElement('div');
        paginationDiv.id = 'tablePagination';
        paginationDiv.style.textAlign = 'center';
        paginationDiv.style.margin = '20px 0';
        paginationDiv.style.fontSize = '18px';

        let html = `<button onclick="prevPage()" ${currentPage === 1 ? 'disabled' : ''}; class="page_button">Previous</button> `;
        html += `<span style="margin: 0 15px;">Page ${currentPage} of ${totalPages}</span> `;
        html += `<button onclick="nextPage()" ${currentPage === totalPages ? 'disabled' : ''}; class="page_button">Next</button>`;

        paginationDiv.innerHTML = html;
        document.querySelector('.tableContainer').appendChild(paginationDiv);
    }

    function prevPage() {
        if (currentPage > 1) {
            currentPage--;
            renderTablePage(currentPage);
            createPaginationControls(allRows.length);
        }
    }

    function nextPage() {
        const totalPages = Math.ceil(allRows.length / rowsPerPage);
        if (currentPage < totalPages) {
            currentPage++;
            renderTablePage(currentPage);
            createPaginationControls(allRows.length);
        }
    }

</script>
