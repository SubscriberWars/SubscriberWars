            fetchData(id)

    async function fetchData() {
    const apiUrl = `https://api2.subscriberwars.space/studio/${id}`
    const response = await fetch(apiUrl);
    const data = await response.json(); 

    let cumulativeSubscribers = 0;
    let cumulativeSubscribersGain = 0;
    let cumulativeSubscribersLoss = 0;
    let cumulativeViews = 0;
    let seriesData = {
        'Views Gain': [],
        'Subs Gain': [],
        'Subs Loss': [],
        'Net Subs Change': [],
        'Total Subs': [],
        'Total Subs Gain': [],
        'Total Subs Loss': [],
        'Total Views': []
    };

    for (let i = 0; i < data.rows.length; i++) {
        const current = data.rows[i];
        let date = new Date(current[0]).getTime();

        seriesData['Views Gain'].push([date, current[1]]);
        seriesData['Subs Gain'].push([date, current[2]]);
        seriesData['Subs Loss'].push([date, current[3]]);
        seriesData['Net Subs Change'].push([date, current[2] - current[3]]);

        // Calculate cumulative subscribers for both table and chart
        cumulativeSubscribers += (current[2] - current[3]);
        cumulativeViews += (current[1]);
        cumulativeSubscribersGain += (current[2]);
        cumulativeSubscribersLoss += (current[3]);
        seriesData['Total Subs'].push([date, cumulativeSubscribers]);
        seriesData['Total Views'].push([date, cumulativeViews]);
        seriesData['Total Subs Gain'].push([date, cumulativeSubscribersGain]);
        seriesData['Total Subs Loss'].push([date, cumulativeSubscribersLoss]);

        // Prepare data for table
        data.rows[i].dateObj = new Date(current[0]);
        data.rows[i].dayOfWeek = data.rows[i].dateObj.toLocaleDateString('en-US', { weekday: 'short' });
        data.rows[i].cumulativeSubs = cumulativeSubscribers;
        data.rows[i].cumulativeView = cumulativeViews;
    }

    const tableBody = document.getElementById('subscriberTable').querySelector('tbody');

    // Initialize arrays to store column sums
    let sumColumns = [0, 0, 0, 0, 0, 0, 0, 0];

    for (let i = 1; i < data.rows.length; i++) {
        const prev = data.rows[i - 1];
        const current = data.rows[i];

        const formatValue = (value) => {
            if (value > 0) {
                return `<span class="positive">+${value.toLocaleString()}</span>`;
            } else if (value < 0) {
                return `<span class="negative">${value.toLocaleString()}</span>`;
            } else {
                return `<span class="neutral">--</span>`;
            }
        };

        const formatdown = (value) => {
            if (value > 0) {
                return `<span class="negative">+${value.toLocaleString()}</span>`;
            } else {
                return `<span class="neutral">--</span>`;
            }
        };

        const row = document.createElement('tr');
        row.innerHTML = `
            <td>${current.dateObj.toLocaleDateString()}</td>
            <td style="color: gray">${current.dayOfWeek}</td>
            <td>${formatValue(current[2])}</td>
            <td>${formatdown(current[3])}</td>
            <td>${formatValue(current[2] - current[3])}</td>
            <td>${current.cumulativeSubs.toLocaleString()}</td>
            <td>${formatValue(current[1])}</td>
            <td>${current.cumulativeView.toLocaleString()}</td>
        `;

        tableBody.appendChild(row);

        // Add to sum for each column
        sumColumns[2] += current[2];
        sumColumns[3] += current[3];
        sumColumns[4] += current[2] - current[3]; // Net subscribers change
        sumColumns[6] += current[1]; // Views gain
    }

    `;

    //abbreviater
    function abbreviateNumber(number) {
        const SI_SYMBOLS = ["", "K", "M", "B", "T"];
        const tier = Math.log10(Math.abs(number)) / 3 | 0;
        const suffix = SI_SYMBOLS[tier];
        let abbreviatedNumber = (number / Math.pow(10, tier * 3)).toFixed(1);

        if (Number.isInteger(Number(abbreviatedNumber))) {
            abbreviatedNumber = abbreviatedNumber.replace(/\.0$/, '');
        }

        abbreviatedNumber += suffix;
        return abbreviatedNumber;
    }
