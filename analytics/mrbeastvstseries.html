<script>

    const items=[]
    async function snippet() {
        const apiUrl = 'https://api.subscriberwars.space/youtube/channel/UCX6OQ3DkcsbYNE6H8uQQuVA,UCq-Fj5jknLsUf-MWSy4_brA'
        const response = await fetch(apiUrl);
        const data = await response.json();
        items[0] = data.items[0];
        items[1] = data.items[1];
        items.sort((a, b) => {
            const collator = new Intl.Collator('en', { numeric: true });
            return collator.compare(a.snippet.title, b.snippet.title);
        });
        console.log(items);

        bannerImage_0.src= items[1].brandingSettings.image.bannerExternalUrl+"=w2560-fcrop64=1,00005a57ffffa5a8-k-c0xffffffff-no-nd-rj";
        bannerImage_1.src= items[0].brandingSettings.image.bannerExternalUrl+"=w2560-fcrop64=1,00005a57ffffa5a8-k-c0xffffffff-no-nd-rj";
        channelImage_0.src= items[1].snippet.thumbnails.medium.url;
        channelImage_1.src= items[0].snippet.thumbnails.medium.url;
        channelTitle_0.innerHTML= items[1].snippet.title;
        channelTitle_1.innerHTML= items[0].snippet.title;
        channelTag_0.innerHTML= items[1].snippet.customUrl;
        channelTag_1.innerHTML= items[0].snippet.customUrl;
        channelSubscribers_0.innerHTML= abbreviateNumber(items[1].statistics.subscriberCount);
        channelViews_0.innerHTML= abbreviateNumber(items[1].statistics.viewCount);
        channelVideos_0.innerHTML= abbreviateNumber(items[1].statistics.videoCount);
        channelSubscribers_1.innerHTML= abbreviateNumber(items[0].statistics.subscriberCount);
        channelViews_1.innerHTML= abbreviateNumber(items[0].statistics.viewCount);
        channelVideos_1.innerHTML= abbreviateNumber(items[0].statistics.videoCount);
        channelPublished_0.innerHTML= items[1].snippet.publishedAt.split("T")[0];
        channelPublished_1.innerHTML= items[0].snippet.publishedAt.split("T")[0];
    }
    snippet()

    async function fetchData() {
        const apiUrl = 'https://subscriberwars.space/analytics/data.json';
        const response = await fetch(apiUrl);
        const data = await response.json();
        
        data.items.forEach(item => {
            item.date = new Date(item.date);
        });

        const tableBody = document.getElementById('subscriberTable').querySelector('tbody');
        
        for (let i = 1; i < data.items.length; i++) {
            const prev = data.items[i - 1];
            const current = data.items[i];

            const mrbeastDailyGain = current.mrbeast - prev.mrbeast;
            const tseriesDailyGain = current.tseries - prev.tseries;
            const difference = current.tseries - current.mrbeast;
            const prevDifference = prev.tseries - prev.mrbeast;
            const changeInGap = difference - prevDifference;

            const formatValue = (value) => {
                if (value > 0) {
                    return `<span class="positive">+${value.toLocaleString()}</span>`;
                } else if (value < 0) {
                    return `<span class="negative">${value.toLocaleString()}</span>`;
                } else {
                    return `<span class="neutral">--</span>`;
                }
            };

            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${current.date.toDateString()}</td>
                <td>${current.tseries.toLocaleString()}</td>
                <td>${formatValue(tseriesDailyGain)}</td>
                <td>${current.mrbeast.toLocaleString()}</td>
                <td>${formatValue(mrbeastDailyGain)}</td>
                <td>${difference.toLocaleString()}</td>
                <td>${formatValue(changeInGap)}</td>
            `;

            tableBody.appendChild(row);
        }
    }

    fetchData();

    //abbreviater
    function abbreviateNumber(number) {
    const SI_SYMBOLS = ["", "K", "M", "B", "T"];
    const tier = Math.log10(Math.abs(number)) / 3 | 0;
    const suffix = SI_SYMBOLS[tier];
    let abbreviatedNumber = (number / Math.pow(10, tier * 3)).toFixed(1);

    if (Number.isInteger(Number(abbreviatedNumber))) {
        abbreviatedNumber = abbreviatedNumber.replace(/\.0$/, '');
    }

    abbreviatedNumber += suffix;
    return abbreviatedNumber;
    }

    async function chart() {
    const apiUrl = 'https://subscriberwars.space/analytics/data.json';
    const response = await fetch(apiUrl);
    const data = await response.json();
    const mrbeastDailyGrowth = [];
    const tseriesDailyGrowth = [];
    const mrbeastMonthlyGrowth = [];
    const tseriesMonthlyGrowth = [];
    
    // Ensure the date is a Date object
    data.items.forEach(item => {
        item.date = new Date(item.date);
    });

    // Calculate daily growth
    for (let i = 1; i < data.items.length; i++) {
        const prev = data.items[i - 1];
        const current = data.items[i];
        mrbeastDailyGrowth.push({
            x: current.date,
            y: current.mrbeast - prev.mrbeast
        });
        tseriesDailyGrowth.push({
            x: current.date,
            y: current.tseries - prev.tseries
        });
    }

    // Aggregate data by month for monthly growth
    const monthlyData = {};

    data.items.forEach(item => {
        const yearMonth = `${item.date.getFullYear()}-${item.date.getMonth()+1}`;
        if (!monthlyData[yearMonth]) {
            monthlyData[yearMonth] = { mrbeast: 0, tseries: 0, date: item.date };
        }
        monthlyData[yearMonth].mrbeast = item.mrbeast;
        monthlyData[yearMonth].tseries = item.tseries;
    });

    const monthlyItems = Object.keys(monthlyData).map(key => monthlyData[key]);
    for (let i = 1; i < monthlyItems.length; i++) {
        const prev = monthlyItems[i - 1];
        const current = monthlyItems[i];
        mrbeastMonthlyGrowth.push({
            x: current.date,
            y: current.mrbeast - prev.mrbeast
        });
        tseriesMonthlyGrowth.push({
            x: current.date,
            y: current.tseries - prev.tseries
        });
    }

    // Daily growth chart
    Highcharts.chart('dailyGrowth', {
        chart: {
            type: 'spline',
            backgroundColor: '#0f0f0f',
            zoomType: 'xy',
            fontFamily: 'roboto'
        },
        title: {
            text: 'Daily Subscriber Growth',
            style: {
                color: '#fff',
                fontWeight: '500',
                fontSize: '30px'
            }
        },
        xAxis: {
            type: 'datetime',
            dateTimeLabelFormats: {
                day: '%b %e'
            },
            labels: {
                style: {
                    color: '#fff',
                    fontSize: '20px'
                }
            },
        },
        yAxis: {
            title: {
                text: 'Subscribers',
                style: {
                    color: '#fff',
                    fontSize: '20px',
                }
            },
            labels: {
                style: {
                    color: '#fff',
                    fontSize: '20px'
                }
            }
        },
        tooltip: {
            shared: true,
            valueSuffix: ' Subscribers'
        },
        credits: { enabled: false },
        legend: {
            itemStyle: {
                fontSize: '20px',
                color: '#fff'
            }
        },
        series: [{
            name: 'T-Series',
            data: data.items.map(item => [item.date.getTime(), item.tseries]),
            lineColor: '#ff0000',
            color: '#ff0000',
            lineWidth: '3'
        },
        {
            name: 'MrBeast',
            data: data.items.map(item => [item.date.getTime(), item.mrbeast]),
            lineColor: '#03bafc',
            color: '#03bafc',
            lineWidth: '3'
        }
    ]
    });

    // Daily gain chart
    Highcharts.chart('dailyGain', {
        chart: {
            type: 'spline',
            backgroundColor: '#0f0f0f',
            zoomType: 'xy',
            fontFamily: 'roboto'
        },
        title: {
            text: 'Daily Subscriber Gain',
            style: {
                color: '#fff',
                fontWeight: '500',
                fontSize: '30px'
            }
        },
        xAxis: {
            type: 'datetime',
            dateTimeLabelFormats: {
                day: '%b %e'
            },
            labels: {
                style: {
                    color: '#fff',
                    fontSize: '20px'
                }
            },
        },
        yAxis: {
            title: {
                text: 'Subscribers',
                style: {
                    color: '#fff',
                    fontSize: '20px',
                }
            },
            labels: {
                style: {
                    color: '#fff',
                    fontSize: '20px'
                }
            }
        },
        tooltip: {
            shared: true,
            valueSuffix: ' Subscribers'
        },
        credits: { enabled: false },
        legend: {
            itemStyle: {
                fontSize: '20px',
                color: '#fff'
            }
        },
        series: [
        {
            name: 'T-Series',
            data: tseriesDailyGrowth,
            lineColor: '#ff0000',
            color: '#ff0000',
            lineWidth: '3'
        },
        {
            name: 'MrBeast',
            data: mrbeastDailyGrowth,
            lineColor: '#03bafc',
            color: '#03bafc',
            lineWidth: '3'
        } ]
    });

    // Monthly gain chart
    Highcharts.chart('monthlyGain', {
        chart: {
            type: 'spline',
            backgroundColor: '#0f0f0f',
            zoomType: 'xy',
            fontFamily: 'roboto'
        },
        title: {
            text: 'Monthly Subscriber Gain',
            style: {
                color: '#fff',
                fontWeight: '500',
                fontSize: '30px'
            }
        },
        xAxis: {
            type: 'datetime',
            dateTimeLabelFormats: {
                month: '%b %Y'
            },
            labels: {
                style: {
                    color: '#fff',
                    fontSize: '20px'
                }
            },
        },
        yAxis: {
            title: {
                text: 'Subscribers',
                style: {
                    color: '#fff',
                    fontSize: '20px',
                }
            },
            labels: {
                style: {
                    color: '#fff',
                    fontSize: '20px'
                }
            }
        },
        tooltip: {
            shared: true,
            valueSuffix: ' Subscribers'
        },
        credits: { enabled: false },
        legend: {
            itemStyle: {
                fontSize: '20px',
                color: '#fff'
            }
        },
        series: [
        {
            name: 'T-Series',
            data: tseriesMonthlyGrowth,
            lineColor: '#ff0000',
            color: '#ff0000',
            lineWidth: '3'
        },
        {
            name: 'MrBeast',
            data: mrbeastMonthlyGrowth,
            lineColor: '#03bafc',
            color: '#03bafc',
            lineWidth: '3'
        } 
    ]
    });
}
    chart()

</script>
