<script type="text/javascript">//main stats

var options = {year: 'numeric' , month: 'numeric' , day: 'numeric'}

function live() {
    fetch('https://axern.space/api/get?platform=youtube&type=channel&id=UCdKLd9f_8ZyDSKxMm16oRww').then(res =>res.json()).then(data => {
        livesubs.innerHTML = data.estSubCount
        liveviews.innerHTML = data.estViewCount
    })
}

live()
setInterval(() => {
    live()
}, 60000);

    function dailydata() {
        fetch('https://api.subscriberwars.space/youtube/playlist/UUdKLd9f_8ZyDSKxMm16oRww').then(res =>res.json()).then(data => {
            latvid.src = "https://www.youtube.com/embed/" + data.items[0].contentDetails.videoId
        })
        fetch('https://api.subscriberwars.space/youtube/channel/v2/UCdKLd9f_8ZyDSKxMm16oRww').then(res =>res.json()).then(data => {
            videocount.innerHTML=data.items[0].statistics.videoCount.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
            UserTopInfoAvatar.src=data.items[0].snippet.thumbnails.medium.url;
            created.innerHTML=data.items[0].snippet.publishedAt.split("T")[0];
            subscribercount.innerHTML=data.items[0].statistics.subscriberCount.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
            viewcount.innerHTML=data.items[0].statistics.viewCount.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
        })
        fetch('https://api.subscriberwars.space/sb/yt/history/UCdKLd9f_8ZyDSKxMm16oRww').then(res =>res.json()).then(data => {
            sbrank.innerHTML=data.data.misc.grade.grade; document.getElementById('sbrank').style.color=data.data.misc.grade.color;
            srank.innerHTML=data.data.ranks.subscribers.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
        })
    }
    dailydata()
</script>
