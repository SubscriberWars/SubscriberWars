<!DOCTYPE html>
<script src="https://subscriberwars.space/js/odometer.js"></script>
<link rel="stylesheet" href="https://subscriberwars.space/css/odometer.css"/>
<style>
    body {
        width: 1920px;
        height: 1080px;
        overflow: wrap;
        background: #0f0f0f;
        overflow: hidden;
    }
    .container_left {
        position: absolute;
        left: 350px;
    }
    .container_right {
        position: absolute;
        left: 950px;
    }
    .main_box {
        height: 240px;
        width: 550px;
        padding: 5px;
        margin: 5px;
        text-align: center;
        background: #181818;
        border: solid 1px #000;
        border-radius: 10px;
        box-shadow: #000 2px 2px 1px;
    }
    .img {
        width: 100px;
        height: 100px;
        border: 1px solid #000;
        border-radius: 10px;
        box-shadow: #000 2px 2px 1px;
        margin-right: 5px;
        position: relative;
        left: -220px;
    }
    .header {
        font-family: roboto;
        font-size: 3rem;
        font-weight: 500;
        color: #fff;
        position: relative;
        left: 110px;
        top: -105px;
        text-align: left;
    }
    .header_2 {
        font-family: roboto;
        font-size: 1.5rem;
        font-weight: 400;
        color: #fff;
        position: relative;
    }
    .count {
        font-family: roboto;
        font-size: 5rem;
        font-weight: 500;
        color: #fff;
        position: relative;
        top: -30px;
    }
    .count_small {
        font-family: roboto;
        font-size: 1.75rem;
        font-weight: 500;
        color: #fff;
        position: relative;
        top: 10px;
    }
    .xtra_box {
        height: 95px;
        width: 1170px;
        display: flex;
    }
    .box {
        height: 80px;
        width: 320px;
        padding: 5px;
        margin: 5px;
        margin-top: 2px;
        text-align: center;
        background: #181818;
        border: solid 1px #000;
        border-radius: 10px;
        box-shadow: #000 2px 2px 1px
    }
</style>
<body>
    <div class="container_left">
        <div class="main_box">
            <img class="img" id="img_1">
            <div class="header" id="header_1">Loading...</div>
            <div class="odometer count" id="count_1"></div>
        </div>
        <div class="xtra_box">
            <div class="box">
                <div class="header_2">Tweets</div>
                <div class="odometer count_small" id="a1"></div>
            </div>
            <div class="box">
                <div class="header_2">Goal</div>
                <div class="odometer count_small" id="a2"></div>
            </div>
            <div class="box">
                <div class="header_2">Follower Gap</div>
                <div class="odometer count_small" id="a3"></div>
            </div>
            <div class="box">
                <div class="header_2">Tweets</div>
                <div class="odometer count_small" id="a4"></div>
            </div>
            <div class="box">
                <div class="header_2">Goal</div>
                <div class="odometer count_small" id="a5"></div>
            </div>
        </div>
        <div class="main_box">
            <img class="img" id="img_3">
            <div class="header" id="header_3">Loading...</div>
            <div class="odometer count" id="count_3"></div>
        </div>
        <div class="xtra_box">
            <div class="box">
                <div class="header_2">Views</div>
                <div class="odometer count_small" id="b1"></div>
            </div>
            <div class="box">
                <div class="header_2">Goal</div>
                <div class="odometer count_small" id="b2"></div>
            </div>
            <div class="box">
                <div class="header_2">Subscriber Gap</div>
                <div class="odometer count_small" id="b3"></div>
            </div>
            <div class="box">
                <div class="header_2">Views</div>
                <div class="odometer count_small" id="b4"></div>
            </div>
            <div class="box">
                <div class="header_2">Goal</div>
                <div class="odometer count_small" id="b5"></div>
            </div>
        </div>
        <div class="main_box">
            <img class="img" id="img_5">
            <div class="header" id="header_5">Loading...</div>
            <div class="odometer count" id="count_5"></div>
        </div>
        <div class="xtra_box">
            <div class="box">
                <div class="header_2">Views</div>
                <div class="odometer count_small" id="c1"></div>
            </div>
            <div class="box">
                <div class="header_2">Goal</div>
                <div class="odometer count_small" id="c2"></div>
            </div>
            <div class="box">
                <div class="header_2">Subscriber Gap</div>
                <div class="odometer count_small" id="c3"></div>
            </div>
            <div class="box">
                <div class="header_2">Views</div>
                <div class="odometer count_small" id="c4"></div>
            </div>
            <div class="box">
                <div class="header_2">Goal</div>
                <div class="odometer count_small" id="c5"></div>
            </div>
        </div>
    </div>
    <div class="container_right">
        <div class="main_box">
            <img class="img" id="img_2">
            <div class="header" id="header_2">Loading...</div>
            <div class="odometer count" id="count_2"></div>
        </div>
        <div class="xtra_box"></div>
        <div class="main_box">
            <img class="img" id="img_4">
            <div class="header" id="header_4">Loading...</div>
            <div class="odometer count" id="count_4"></div>
        </div>
        <div class="xtra_box"></div>
        <div class="main_box">
            <img class="img" id="img_6">
            <div class="header" id="header_6">Loading...</div>
            <div class="odometer count" id="count_6"></div>
        </div>
    </div>
</body>

<script>
    var g1=""
    var g2=""
    var g3=""
    var g4=""
    var g5=""
    var g6=""
    function update() {
        fetch('https://api.subscriberwars.space/twitter/3/user/barackobama').then(res=>res.json()).then(data=>{
            count_1.innerHTML=data.followers_count
            img_1.src=data.profile_image.replace("normal","400x400")
            a1.innerHTML=data.tweet_count
            header_1.innerHTML=data.name
            a2.innerHTML=200000000-data.followers_count
            g1=data.followers_count
        })
        fetch('https://api.subscriberwars.space/twitter/3/user/elonmusk').then(res=>res.json()).then(data=>{
            count_2.innerHTML=data.followers_count
            img_2.src=data.profile_image.replace("normal","400x400")
            a4.innerHTML=data.tweet_count
            header_2.innerHTML=data.name
            a5.innerHTML=200000000-data.followers_count
            g2=data.followers_count
            a3.innerHTML=g1-g2
        })
        fetch('https://api.subscriberwars.space/stream/UC-lHJZR3Gqxm24_Vd_AJ5Yw').then(res=>res.json()).then(data=>{
            count_3.innerHTML=data.estCounts[0]
            img_3.src=data.pfp
            b1.innerHTML=data.estCounts[1]
            header_3.innerHTML=data.name
            b2.innerHTML=200000000-data.estCounts[0]
            g3=data.estCounts[0]
        })
        fetch('https://api.subscriberwars.space/stream/UCk8GzjMOrta8yxDcKfylJYw').then(res=>res.json()).then(data=>{
            count_4.innerHTML=data.estCounts[0]
            img_4.src=data.pfp
            b4.innerHTML=data.estCounts[1]
            header_4.innerHTML=data.name
            b5.innerHTML=200000000-data.estCounts[0]
            g4=data.estCounts[0]
            b3.innerHTML=g3-g4
        })
        fetch('https://api.subscriberwars.space/stream/UCJ5v_MCY6GNUBTO8-D3XoAg').then(res=>res.json()).then(data=>{
            count_5.innerHTML=data.estCounts[0]
            img_5.src=data.pfp
            c1.innerHTML=data.estCounts[1]
            header_5.innerHTML=data.name
            c2.innerHTML=100000000-data.estCounts[0]
            g5=data.estCounts[0]
        })
        fetch('https://api.subscriberwars.space/stream/UCFFbwnve3yF62-tVXkTyHqg').then(res=>res.json()).then(data=>{
            count_6.innerHTML=data.estCounts[0]
            img_6.src=data.pfp
            c4.innerHTML=data.estCounts[1]
            header_6.innerHTML=data.name
            c5.innerHTML=100000000-data.estCounts[0]
            g6=data.estCounts[0]
            c3.innerHTML=g5-g6
        })
    }
    setInterval(() => {
        update()
    }, 2000);
</script>
