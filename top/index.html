<head>
    <title>Top Lists</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css?family=Roboto:100,200,300,400,500,600,700,800" rel="stylesheet" type="text/css">
    <link href="/css/index.css" rel="stylesheet">
    <script src="https://kit.fontawesome.com/93168af8d4.js" crossorigin="anonymous"></script>
</head>
<body>
    <div class="container">
        <img id="head_image" src="https://www.banner.yt/UCdKLd9f_8ZyDSKxMm16oRww?width=1280">
        <div class="menu_bar">
            <a class="menu_button" href="/"><i class="fa-sharp fa-house"></i></a>
            <a class="menu_button" href="/compare">Compare</a>
            <a class="menu_button" href="/about">Socials</a>
        </div>
        <div class="notice">Please Note these lists are manually updated so may not be always accurate, The data will be though.</div>
        <div class="platform">
            <img class="platform_image" src="/images/youtube_full.png">
        </div>
        <div class="platform_button">
            <button class="platform_button_a" onclick="location.href='/top/youtube'"><i class="fa-sharp fa-users"></i> Top 10 Most Subscribed (Semi-auto updating)</button>
        </div>
        <div class="platform">
            <img class="platform_image" src="/images/kick_full.svg">
        </div>
        <div class="platform_button">
            <button class="platform_button_a" onclick="location.href='/top/kick'"><i class="fa-sharp fa-users"></i> Top 10 Most Followed (Manual Updating)</button>
        </div>
        <div class="platform">
            <img class="platform_image" src="/images/rumble_full.svg">
        </div>
        <div class="platform_button">
            <button class="platform_button_a" onclick="location.href='/top/rumble'"><i class="fa-sharp fa-users"></i> Top 10 Most Followed (Full-auto updating)</button>
        </div>
        <div class="platform">
            <img class="platform_image" src="/images/tiktok_full.png" style="height: 150px; margin-top: -20px;">
        </div>
        <div class="platform_button">
            <button class="platform_button_a" onclick="location.href='/top/tiktok'"><i class="fa-sharp fa-users"></i> Top 10 Most Followed (Manual Updating)</button>
        </div>
        <div class="platform">
            <img class="platform_image" src="/images/twitch_full.svg" style="height: 100px; margin-top: -20px; top: 30px; position: relative;">
        </div>
        <div class="platform_button">
            <button class="platform_button_a" onclick="location.href='/top/twitch'"><i class="fa-sharp fa-users"></i> Top 10 Most Followed (Manual Updating)</button>
        </div>
    </div>
</body>
