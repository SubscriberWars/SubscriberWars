<script>

var g0 = 0, g1 = 0;
const list0 = [], list1 = [];

function main() {
    fetch('https://api.subscriberwars.space/instagram/virat.kohli')
        .then(res => res.json())
        .then(data => {
            channelImage_0.src = data.items.profile_picture_url;
            i0.src = data.items.profile_picture_url;
            channelBanner_0.src = data.items.profile_picture_url;
            title_0.innerHTML = data.items.name;
            tag_0.innerHTML = "@" + data.items.username;
        });
    fetch('https://api.subscriberwars.space/youtube/channel/UCX6OQ3DkcsbYNE6H8uQQuVA')
        .then(res => res.json())
        .then(data => {
            channelImage_1.src = data.items[0].snippet.thumbnails.medium.url;
            i1.src = data.items[0].snippet.thumbnails.medium.url;
            channelBanner_1.src = data.items[0].brandingSettings.image.bannerExternalUrl + "=w2560-fcrop64=1,00005a57ffffa5a8-k-c0xffffffff-no-nd-rj";
            title_1.innerHTML = data.items[0].snippet.title;
            tag_1.innerHTML = data.items[0].snippet.customUrl;
            mediaCount_1.innerHTML = data.items[0].statistics.videoCount;
        });
}
main();

function stats() {
    fetch('https://api.subscriberwars.space/instagram2/virat.kohli')
        .then(res => res.json())
        .then(data => {
            mediaCount_0.innerHTML = data.stats.posts;
            viewCount_0.innerHTML = data.stats.following;
            subscribers_0.innerHTML = data.stats.followers;
            g0 = data.stats.followers;

            // Update followers list and handle the 1-hour and 1-day difference calculations
            list0.unshift(data.stats.followers);
            if (list0.length > 43200) {
                list0.pop();
            }
            if (list0.length >= 1800) {
                hr1.innerHTML = data.stats.followers - list0[1799];
            }
            if (list0.length >= 43200) {
                day1.innerHTML = data.stats.followers - list0[43199];
            }
            if (list0.length < 1800) {
                hr1.innerHTML = data.stats.followers - list0[list0.length - 1];
            }
            if (list0.length < 43200) {
                day1.innerHTML = data.stats.followers - list0[list0.length - 1];
            }

            // Update graph
            if (graph_0.series[0].points.length >= 1800) {
                graph_0.series[0].data[0].remove();
            }
            graph_0.series[0].addPoint([Date.now(), data.stats.followers]);
        });

    fetch('https://api.subscriberwars.space/stream/UCX6OQ3DkcsbYNE6H8uQQuVA')
        .then(res => res.json())
        .then(data => {
            viewCount_1.innerHTML = data.estCounts[1];
            subscribers_1.innerHTML = data.estCounts[0];
            g1 = data.estCounts[0];

            // Update subscribers list and handle the 1-hour and 1-day difference calculations
            list1.unshift(data.estCounts[0]);
            if (list1.length > 43200) {
                list1.pop();
            }
            if (list1.length >= 1800) {
                hr2.innerHTML = data.estCounts[0] - list1[1799];
            }
            if (list1.length >= 43200) {
                day2.innerHTML = data.estCounts[0] - list1[43199];
            }
            if (list1.length < 1800) {
                hr2.innerHTML = data.estCounts[0] - list1[list1.length - 1];
            }
            if (list1.length < 43200) {
                day2.innerHTML = data.estCounts[0] - list1[list1.length - 1];
            }

            // Update graph
            if (graph_1.series[0].points.length >= 1800) {
                graph_1.series[0].data[0].remove();
            }
            graph_1.series[0].addPoint([Date.now(), data.estCounts[0]]);
        });

    gap.innerHTML = g0 - g1;
}
stats();

function tush() {
    fetch('https://api.subscriberwars.space/youtube/channel/UCX6OQ3DkcsbYNE6H8uQQuVA')
        .then(res => res.json())
        .then(data => {
            mediaCount_1.innerHTML = data.items[0].statistics.videoCount;
        });
}

function diff() {
    if (graph_2.series[0].points.length >= 120) {
        graph_2.series[0].data[0].remove();
    }
    if (graph_3.series[0].points.length >= 2880) {
        graph_3.series[0].data[0].remove();
    }
    graph_2.series[0].addPoint([Date.now(), g0 - g1]);
    graph_3.series[0].addPoint([Date.now(), g0 - g1]);
}

function time() {
    const time = new Date();
    ts_time.innerHTML = "India, " + time.toLocaleString('en-GB', {timeZone: 'Asia/Kolkata', weekday: 'short', day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', hour12: true, minute: '2-digit', second: '2-digit'});
    mb_time.innerHTML = "United States, EDT, " + time.toLocaleString('en-GB', {timeZone: 'America/New_York', weekday: 'short', day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', hour12: true, minute: '2-digit', second: '2-digit'});
}

setInterval(tush, 60000);
setInterval(stats, 2000);
setInterval(time, 1000);
setTimeout(() => {
    setInterval(diff, 30000);
}, 6000);

    var graph_0; graph_1; graph_2; graph_3;

            },

            series: [{ showInLegend: false, name: 'Subscribers', marker: { enabled: false }, lineColor: 'blue', color: 'blue', lineWidth: 4 }]

            },

            },

</script>
