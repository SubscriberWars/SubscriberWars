                instagram: igram,
                x: xcom,
                youtube: ytube,
                tiktok: ttok,
                snapchat: schat
            };
    
            for (let img of platformImages) {
                const id = img.id;
                if (imageMap[id]) {
                    img.src = imageMap[id];
                }
            }
        }
