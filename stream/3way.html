            views0.innerHTML = data.estCounts[1];
            subs0.innerHTML = data.estCounts[0];
            su0 = data.estCounts[0];

            list0.unshift(data.estCounts[0]);
            if (list0.length > 43200) {
                list0.pop();
            }
            if (list0.length >= 1800) {
                hr0.innerHTML = data.estCounts[0] - list0[1799];
            }
            if (list0.length >= 43200) {
                day0.innerHTML = data.estCounts[0] - list0[43199];
            }

                hr0.innerHTML = data.estCounts[0] - list0[list0.length - 1];
