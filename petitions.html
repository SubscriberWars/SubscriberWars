<!DOCTYPE html>
<head>
    <title>Live Petition Count</title>
    <meta name="description" content="UK Government Live Petition Count">
    <link rel="stylesheet" href="https://subscriberwars.space/css/odometer.css">
    <link rel="stylesheet" href="https://subscriberwars.space/css/main.css">
    <script src="https://subscriberwars.space/js/odometer.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
    <div id="count-block">
        <h1 id="title">Loading...</h1>
        <div id='count' class="odometer odometer-auto-theme" style="font-size: 120pt; font-weight: 500; text-align: center; margin: 0px auto; margin-top: 10px; margin-bottom: 10px; position: relative; width: 1260px;">0</div>
        <h2>Signatures</h2>
    </div>
    <div id="mini-counts">
        <div id="like-box">
            <div id='start' class="odometer odometer-auto-theme" style="font-size: 30pt; font-weight: 500; text-align: center; margin: 0px auto; margin-top: 10px; margin-bottom: 10px; position: relative; width: 620px;">0</div>
            <h2>Opened</h2>
        </div>
        <div id="comment-box">
            <div id='end' class="odometer odometer-auto-theme" style="font-size: 30pt; font-weight: 500; text-align: center; margin: 0px auto; margin-top: 10px; margin-bottom: 10px; position: relative; width: 620px;">0</div>
            <h2>Creator</h2>
        </div>
    </div>
    <div id="graph-block">
        <div id="info" style="width: 1260px; height: 200px; font-size: 30pt;"></div>
        <div id="addinfo" style="width: 1260px; height: 200px;"></div>
    </div>
</body>

<script>

var channel = window.location.href.split('?u=')[1] || '';
const headerImage = document.getElementById("headerImage")

function checkForNew(chanid) {

    fetch('https://api.subscriberwars.space/ukgov/petitions/'+chanid+'').then(res => res.json()).then(data => {
        title.innerHTML = data.data.attributes.action
        count.innerHTML = data.data.attributes.signature_count
        start.innerHTML = data.data.attributes.opened_at
        end.innerHTML = data.data.attributes.creator_name
        info.innerHTML=data.data.attributes.background
        addinfo.innerHTML=data.data.attributes.additional_details
    });
}

// Intervals
setInterval(() => {
    checkForNew(channel)
}, 2000);

checkForNew(channel)

</script>
