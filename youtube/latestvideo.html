<!DOCTYPE html>
<head>
    <title>Latest Video from User</title>
    <meta name="description" content="Live #TeamSeas Statistics">
    <link rel="stylesheet" href="odometer.css">
    <link rel="stylesheet" href="video.css">
    <script src="odometer.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
    <div id="count-block">
        <img id="logo" src="" alt="Thumbnail">
        <h1 id="title">Loading...</h1>
        <div id='viewscount' class="odometer odometer-auto-theme" style="font-size: 120pt; font-weight: 500; text-align: center; margin: 0px auto; margin-top: 10px; margin-bottom: 10px; position: relative; width: 1260px;">0</div>
        <h2>Views</h2>
    </div>
    <div id="mini-counts">
        <div id="like-box">
            <div id='likecount' class="odometer odometer-auto-theme" style="font-size: 30pt; font-weight: 500; text-align: center; margin: 0px auto; margin-top: 10px; margin-bottom: 10px; position: relative; width: 620px;">0</div>
            <h2>Likes</h2>
        </div>
        <div id="comment-box">
            <div id='commentcount' class="odometer odometer-auto-theme" style="font-size: 30pt; font-weight: 500; text-align: center; margin: 0px auto; margin-top: 10px; margin-bottom: 10px; position: relative; width: 620px;">0</div>
            <h2>Comments</h2>
        </div>
    </div>
</body>

<script>
    var newestvidID = ''
var channel = window.location.href.split('?userID=')[1] || '';
var capi = 0;
var lapi = 0;
var likes = 0;
var views = 0;
var viewsC = 0;
var lol = 0;

function checkForNew(chanid) { // User ID: UU NOT UC
    fetch('https://playlist-latest-video.subscriberwars.repl.co/list/'+chanid+'').then(res => res.json()).then(data => {
        newestvidID = data.items[0].contentDetails.videoId
    });
}


function updateStats(id) {
    fetch('https://mixerno.space/api/youtube-video-counter/user/'+id+'').then(res => res.json()).then(data => {
        capi = data.counts[2].count
        lapi = data.counts[3].count

    var ratio = parseFloat(capi) / parseFloat(lapi)
                console.log(ratio)
                    views = (Math.floor(parseFloat(views) + ratio * (parseFloat(lapi) - likes)))
                        if (viewsC == capi) { } else {
                            views = (Math.floor(parseFloat(capi)))
                        }
                viewsC = (Math.floor(capi))
                likes = (Math.floor(lapi))
                lol = views
        likecount.innerHTML = data.counts[3].count,
        commentcount.innerHTML = data.counts[5].count,
        viewscount.innerHTML = lol,
        title.innerHTML = data.user[0].count,
        logo.src = data.user[1].count
    });
}

// Intervals
setInterval(() => {
    updateStats(newestvidID);
}, 2000);

checkForNew(channel)

setInterval(() => {
    checkForNew(channel);
}, 30000);
</script>
