<head>
    <script src="/js/odometer.js"></script>
    <link rel=stylesheet href="/css/odometer.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons"rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/93168af8d4.js" crossorigin="anonymous"></script>  
</head>

<body style="background: transparent; font-family: roboto; font-weight: 500; width: 820px;">
    <img id="thumbnail" style="width: 200px; border: 1px solid #000; border-radius: 5px;">
    <div id="vidtitle" style="position: relative; top: -113px; left: 210px; font-size: 1.5rem; color: #fff; width: 600px; white-space: nowrap; text-overflow: ellipsis; overflow:hidden; text-shadow: 1px 1px 1px #000;"></div>
    <div style="font-size: 1.5rem; position: relative; top: -100px; left: 210px; text-shadow: 1px 1px 1px #000;">
        <i class="fa fa-sharp fa-eye" style="color: #fff;"></i>
        <div id="viewsOdometer" class="odometer" style="margin-right: 20px; color: #fff;"></div>
        <i class="fa fa-sharp fa-thumbs-up" style="color: green;"></i>
        <div id="likesOdometer" class="odometer" style="margin-right: 20px; color: green;"></div>
        <i class="fa fa-sharp fa-comment" style="color: blue;"></i>
        <div id="commentsOdometer" class="odometer" style="margin-right: 20px; color: blue;"></div>
    </div>
</body>

<script>
    var newestvidID = ''
    var channel = window.location.href.split('?')[1] || '';
    var capi = 0;
    var lapi = 0;
    var likes = 0;
    var views = 0;
    var viewsC = 0;
    var lol = 0;
    
    function checkForNew(chanid) { // replace UC with UU
        fetch('https://api.subscriberwars.space/priv/yt/playlist/'+chanid+'').then(res => res.json()).then(data => {
            newestvidID = data.items[0].contentDetails.videoId
        });
    }
    
    
    function updateStats(id) {
        fetch('https://youtube.googleapis.com/youtube/v3/videos?part=snippet,statistics&id='+id+'&key=AIzaSyAUfG3BP2Zx4XSPSaigqUFzkBqa8CbMx00').then(res => res.json()).then(data => {
            capi = data.items[0].statistics.viewCount
            lapi = data.items[0].statistics.likeCount
    
        var ratio = parseFloat(capi) / parseFloat(lapi)
                        views = (Math.floor(parseFloat(views) + ratio * (parseFloat(lapi) - likes)))
                            if (viewsC == capi) { } else {
                                views = (Math.floor(parseFloat(capi)))
                            }
                    viewsC = (Math.floor(capi))
                    likes = (Math.floor(lapi))
                    lol = views
            likesOdometer.innerHTML = data.items[0].statistics.likeCount,
            viewsOdometer.innerHTML = lol,
            vidtitle.innerHTML = data.items[0].snippet.title,
            thumbnail.src = data.items[0].snippet.thumbnails.maxres.url
            commentsOdometer.innerHTML = data.items[0].statistics.commentCount
        });
        
    }
    
    setInterval(() => {
        updateStats(newestvidID);
    }, 2000);
    
    checkForNew(channel)
    updateStats(newestvidID)
    
    setInterval(() => {
        checkForNew(channel);
    }, 10000);
    </script>
