    const vid=[]
    const videoarray = [];
    var urllink="https://youtu.be/"

    function video() {
        fetch("https://api.subscriberwars.space/youtube/playlist/"+uid).then(res=>res.json()).then(data=>{
            vid[0]=data.items[0].contentDetails.videoId
            vid[1]=data.items[1].contentDetails.videoId
            vid[2]=data.items[2].contentDetails.videoId
            vid[3]=data.items[3].contentDetails.videoId
            vid[4]=data.items[4].contentDetails.videoId
            vid[5]=data.items[5].contentDetails.videoId
            vid[6]=data.items[6].contentDetails.videoId
            vid[7]=data.items[7].contentDetails.videoId
            vid[8]=data.items[8].contentDetails.videoId
            vid[9]=data.items[9].contentDetails.videoId
        })
        console.log(vid)
    }

    function videosearch() {
        fetch("https://api.subscriberwars.space/youtube/video/raw/"+vid[0]+","+vid[1]+","+vid[2]+","+vid[3]+","+vid[4]+","+vid[5]+","+vid[6]+","+vid[7]+","+vid[8]+","+vid[9]+",").then(res=>res.json()).then(data=>{
            videoarray[0]=data.items[0]
            videoarray[1]=data.items[1]
            videoarray[2]=data.items[2]
            videoarray[3]=data.items[3]
            videoarray[4]=data.items[4]
            videoarray[5]=data.items[5]
            videoarray[6]=data.items[6]
            videoarray[7]=data.items[7]
            videoarray[8]=data.items[8]
            videoarray[9]=data.items[9]
        })
        console.log(videoarray)
    }

    function inject() {
    const tableBody = document.querySelector('#video_table tbody');
    videoarray.forEach(dataRow => {
        const newRow = document.createElement('tr');
        // Properties to extract from dataRow
        const properties = [
            'snippet.publishedAt',
            'snippet.thumbnails.medium.url',
            'snippet.title',
            'statistics.viewCount',
            'statistics.likeCount',
            'statistics.commentCount',
            'statistics.estimatedRevenue'
        ];
        properties.forEach(property => {
            const newCell = document.createElement('td');
            const propertyPath = property.split('.');
            let value = dataRow;
            propertyPath.forEach(path => {
                value = value[path];
            });
            if (property === 'snippet.publishedAt') {
                value = value.split("T")[0]
            }
            // Modify the number format
            if (property === 'statistics.viewCount' || property === 'statistics.likeCount' || property === 'statistics.commentCount') {
                value = parseInt(value); // Convert to integer
                value = value.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
            } else if (property === 'statistics.estimatedRevenue') {
                // Calculate estimated revenue based on the formula
                const viewCount = dataRow.statistics.viewCount;
                const numericViewCount = parseInt(viewCount);
                const revenueLow = (viewCount / 1000) * 0.25;
                const revenueHigh = (viewCount / 1000) * 4;
                value = `$${abbreviateNumber(revenueLow)} - $${abbreviateNumber(revenueHigh)}`;
                newCell.style.color='green';
            }
            if (property === 'snippet.thumbnails.medium.url') {
                const image = document.createElement('img');
                image.src = value;
                image.alt = 'Thumbnail';
                image.style.height = '90px';
                newCell.appendChild(image);
            }  else {
                newCell.textContent = value;
                newCell.style.maxWidth = '300px';
                newCell.style.overflow = 'hidden';
                newCell.style.whiteSpace = 'noWrap';
                newCell.style.textOverflow = 'ellipsis';
                newCell.style.paddingRight = '10px';
            }
            newRow.appendChild(newCell);
        });
        tableBody.appendChild(newRow);
    });
}
//abbreviator
function abbreviateNumber(number) {
    const SI_SYMBOLS = ["", "K", "M", "B", "T"];
    const tier = Math.log10(Math.abs(number)) / 3 | 0;
    const suffix = SI_SYMBOLS[tier];
    const abbreviatedNumber = (number / Math.pow(10, tier * 3)).toPrecision(3) + suffix;
    return abbreviatedNumber;
}
    
    setTimeout(() => {
        video(uid)
    }, 1000);
    setTimeout(() => {
        videosearch(vid)
    }, 2000);
    setTimeout(() => {
        inject()
