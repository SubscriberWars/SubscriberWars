<!DOCTYPE html>
<head>
    <title>Video Statistics</title>
    <meta name="description" content="Live YouTube Video Stats">
    <link rel="stylesheet" href="odometer.css">
    <link rel="stylesheet" href="video.css">
    <script src="odometer.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
    <div id="count-block">
        <img id="logo" src="" alt="Thumbnail">
        <h1 id="title">Loading...</h1>
        <div id='viewscount' class="odometer odometer-auto-theme" style="font-size: 120pt; font-weight: 500; text-align: center; margin: 0px auto; margin-top: 10px; margin-bottom: 10px; position: relative; width: 1260px;">0</div>
        <h2>Views</h2>
    </div>
    <div id="mini-counts">
        <div id="like-box">
            <div id='likecount' class="odometer odometer-auto-theme" style="font-size: 30pt; font-weight: 500; text-align: center; margin: 0px auto; margin-top: 10px; margin-bottom: 10px; position: relative; width: 620px;">0</div>
            <h2>Likes</h2>
        </div>
        <div id="comment-box">
            <div id='commentcount' class="odometer odometer-auto-theme" style="font-size: 30pt; font-weight: 500; text-align: center; margin: 0px auto; margin-top: 10px; margin-bottom: 10px; position: relative; width: 620px;">0</div>
            <h2>Comments</h2>
        </div>
    </div>
</body>

<script>
var video = window.location.href.split('?v=')[1] || '';
var capi = 0;
var lapi = 0;
var likes = 0;
var views = 0;
var viewsC = 0;
var lol = 0;

function updateStats(chanid) {
    fetch('https://api.subscriberwars.space/youtube/video/'+chanid+'').then(res => res.json()).then(data => {
        capi = data.items[0].statistics.viewCount
        lapi = data.items[0].statistics.likeCount

    var ratio = parseFloat(capi) / parseFloat(lapi)
                console.log(ratio)
                    views = (Math.floor(parseFloat(views) + ratio * (parseFloat(lapi) - likes)))
                        if (viewsC == capi) { } else {
                            views = (Math.floor(parseFloat(capi)))
                        }
                viewsC = (Math.floor(capi))
                likes = (Math.floor(lapi))
                lol = views
        likecount.innerHTML = data.items[0].statistics.likeCount,
        commentcount.innerHTML = data.items[0].statistics.commentCount,
        viewscount.innerHTML = lol,
        title.innerHTML = data.items[0].snippet.title,
        logo.src = data.items[0].snippet.thumbnails.maxres.url
    });
}

// Intervals
setInterval(() => {
    updateStats(video);
}, 2000);

updateStats(video)
</script>
