<head>
    <link href="https://fonts.googleapis.com/css?family=Roboto:100,200,300,400,500,600,700,800" rel="stylesheet" type="text/css">
    <link rel="stylesheet" href="/css/odometer.css">
    <link rel="stylesheet" href="/css/font.css">
    <script src="https://kit.fontawesome.com/93168af8d4.js" crossorigin="anonymous"></script>
    <script src="/js/odometer.js"></script>
    <title id="page_title"></title>
</head>

<body>
    <div class="head">
        <div class="head_text">Live YouTube Video Statistics</div>
    </div>
    <div class="main_box">
        <img id="channel_banner" src="/images/banner_placeholder.png">
        <img id="channel_image" src="/images/pfp_placeholder.png">
        <div id="channel_title_container">
            <span id="channel_title"></span>
        </div>
        <div id="channel_subscribers" class="odometer"></div>
        <div id="subscribers">Views</div>
        <div class="bottom_data">
            <div class="bottom_counts">
                <div class="odometer bottom_odometer" id="channel_views"></div>
                <div class="bottom_text">Likes</div>
            </div>
            <div class="bottom_counts">
                <div class="odometer bottom_odometer" id="channel_videos"></div>
                <div class="bottom_text">Comments</div>
            </div>
        </div>
        <div class="button_box">
            <a id="channel_link" target="_blank" style="margin: auto; width: 1260px;">
                <button class="bott_button">
                    Go To Video
                </button>
            </a>
        </div>
    </div>
    <p id="goal01" style="display: none;"></p>
</body>

<style>
    body {
        background: #181818;
        color: #fff;
        margin: 0;
        font-family: roboto;
    }
    .head {
        width: 100%;
        height: 60px;
        background-image: linear-gradient(to right, #ff0000, #830101);
        overflow: hidden;
        border-bottom: 1px solid #000;
    }
    .head_text {
        text-align: center;
        vertical-align: middle;
        font-weight: 500;
        font-size: 50px;
    }
    .main_box {
        width: 1260px;
        height: 780px;
        background: #0f0f0f;
        margin: auto;
        padding: 10px;
        margin-top: 20px;
        border: 1px solid #000;
        border-radius: 10px;
        text-align: center;
    }
    #channel_banner {
        width: 100%;
        border: 1px solid #000;
        border-radius: 10px;
        height: 208px;
        filter: blur(3px);
    }
    #channel_image {
        width: 355.56px;
        height: 200px;
        border: 1px solid #000;
        border-radius: 10px;
        top: -100px;
        position: relative;
    }
    #channel_title_container {
        position: relative;
        top: -100px;
        font-size: 3rem;
        max-height: 4.8rem;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }
    #channel_subscribers {
        position: relative;
        top: -90px;
        font-size: 9rem;
        font-weight: 600;
        font-family: Montserrat;
        font-feature-settings: "tnum";
    }
    #subscribers {
        position: relative;
        top: -80px;
        font-size: 2rem;
    }
    .bottom_data {
        width: 100%;
        height: 150px;
        position: relative;
        display: flex;
        top: -70px;
    }
    .bottom_counts {
        margin: 5px;
        padding: 10px;
        width: 600px;
        height: 130px;
        background: #000;
        border-radius: 10px;
    }
    .bottom_odometer {
        font-weight: 500;
        font-size: 3rem;
        font-family: Montserrat;
        font-feature-settings: "tnum";
    }
    .bottom_text {
        font-size: 2rem;
        margin-top: 20px;
    }
    ::-webkit-scrollbar {
        width: 5px;
    }
    ::-webkit-scrollbar-track {
        border-radius: 2.5px;
    }
    ::-webkit-scrollbar-thumb {
        background: #ff0000;
        border-radius: 2.5px;
    }
    ::-webkit-scrollbar-thumb:hover {
        background: #830101;
        border-radius: 2.5px;
    }
    .button_box {
        width: 1260px;
        margin: auto;
        display: flex;
    }
    .bott_button {
        width: 620px;
        margin: auto;
        background: #0f0f0f;
        color: #fff;
        height: 100px;
        font-size: 30px;
        border-radius: 10px;
        border: 1px solid #000;
    }
    .bott_button:hover {
        cursor: pointer;
        background: #000;
        border: 1px solid #fff;
    }
</style>

<script>
    var channel = window.location.href.split('?v=')[1] || '';
    var views_api = 0;
    var likes_api = 0;
    var likes = 0;
    var views = 0;
    var viewsC = 0;
    var lol = 0;

    function stats(chanid) {
    fetch('https://api.subscriberwars.space/youtube/video/'+chanid).then(res => res.json()).then(data => {
        views_api = data.items[0].statistics.viewCount
        likes_api = data.items[0].statistics.likeCount

        var ratio = parseFloat(views_api) / parseFloat(likes_api)
            console.log(ratio)
            views = (Math.floor(parseFloat(views) + ratio * (parseFloat(likes_api) - likes)))
                if (viewsC == views_api) { } else {
                    views = (Math.floor(parseFloat(views_api)))
                }
                viewsC = (Math.floor(views_api))
                likes = (Math.floor(likes_api))
                lol = views

        page_title.innerHTML= data.items[0].snippet.title
        channel_title.innerHTML=data.items[0].snippet.title
        channel_title.title=data.items[0].snippet.title
        channel_link.href="https://youtube.com/watch?v="+data.items[0].id
        channel_image.src=data.items[0].snippet.thumbnails.medium.url
        channel_banner.src=data.items[0].snippet.thumbnails.medium.url
        channel_views.innerHTML = data.items[0].statistics.likeCount,
        channel_subscribers.innerHTML = lol,
        channel_videos.innerHTML=data.items[0].statistics.commentCount
    });
    
}
    stats(channel)
    setInterval(() => {
        stats(channel)
    }, 10000);
</script>
