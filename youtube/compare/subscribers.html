<!DOCTYPE html>
<head>
    <title>Live YouTube Subscribe Count</title>
    <meta name="description" content="Live Twitter Stats">
    <link rel="stylesheet" href="/css/odometer.css">
    <link rel="stylesheet" href="/css/compare-main.css">
    <script src="/js/odometer.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://code.highcharts.com/highcharts.js"></script>
</head>
<body>
    <div id="count-block">
        <img style="margin:10px" id="headerImage"/>
        <img class="logo" id="logo" src="https://subscriberwars.space/images/youtube.svg" style="top: -110px;">
        <h1 id="title" style="top: -110px;">Loading...</h1>
        <div id='followercount' class="odometer odometer-auto-theme" style="font-size: 80pt; font-weight: 500; text-align: center; margin: 0px auto; margin-top: 10px; margin-bottom: 10px; position: relative; width: 100%; top: -110px;">0</div>
        <h2 style="top: -110px;">Subscribers</h2>
    </div>
    <div id="count-block2">
        <img style="margin:10px" id="headerImageb"/>
        <img class="logo"  id="logob" src="https://subscriberwars.space/images/youtube.svg" style="top: -110px;">
        <h1 id="titleb" style="top: -110px;">Loading...</h1>
        <div id='followercountb' class="odometer odometer-auto-theme" style="font-size: 80pt; font-weight: 500; text-align: center; margin: 0px auto; margin-top: 10px; margin-bottom: 10px; position: relative; width: 100%; top: -110px;">0</div>
        <h2 style="top: -110px;">Subscribers</h2>
    </div>
    <div id="gap-block">
        <div id='difference' class="odometer odometer-auto-theme" style="font-size: 50pt; font-weight: 500; text-align: center; margin: 0px auto; margin-top: 10px; margin-bottom: 10px; position: relative; width: 100%;">0</div>
        <h2>Difference</h2>
    </div>
    <div id="graph-block" style="position: relative; top: -415px; left: 25%;">
        <div id="graph" style="width: 1260px; height: 400px;"></div>
        <p id="graphstat" style="visibility: hidden;"></p>
    </div>
</body>

<script>
var channel = window.location.href.split('&')[1];
var channel2 = window.location.href.split('&')[2];
var gap01=[]
var gap02=[]

function update(chanid) {
    headerImage.src='https://www.banner.yt/'+chanid+'?width=600';
    fetch('https://api.subscriberwars.space/youtube/channel/'+chanid).then(res => res.json()).then(data => {
        title.innerHTML = data.items[0].snippet.title
        logo.src = data.items[0].snippet.thumbnails.medium.url
        followercount.innerHTML=data.items[0].statistics.subscriberCount
        gap01= data.items[0].statistics.subscriberCount
    });
}
function update2(chanid) {
    headerImageb.src='https://www.banner.yt/'+chanid+'?width=600';
    fetch('https://api.subscriberwars.space/youtube/channel/'+chanid).then(res => res.json()).then(data => {
        titleb.innerHTML = data.items[0].snippet.title
        logob.src = data.items[0].snippet.thumbnails.medium.url
        followercountb.innerHTML=data.items[0].statistics.subscriberCount
        gap02= data.items[0].statistics.subscriberCount
        if(gap01>gap02){difference.innerHTML= gap01-gap02} else{difference.innerHTML= gap02-gap01}
        if(gap01>gap02){graphstat.innerHTML= gap01-gap02} else{graphstat.innerHTML= gap02-gap01}
        var yep=(graphstat.innerHTML)
        console.log(yep)
        var injection=yep
        if(graph.series[0].points.length>=999999999999)graph.series[0].data[0].remove();
        graph.series[0].addPoint([Date.now(),parseFloat(injection)])
    });
}

// Intervals
setInterval(() => {
    update(channel);
    update2(channel2);
}, 10000);

update(channel)
update2(channel2)

</script>
<script>//graph styling
    var graph = new Highcharts.chart({
chart: {
renderTo: 'graph',
type: 'spline',
zoomType: 'x',
backgroundColor: 'transparent',
plotBorderColor: 'transparent'
},
title: {
text: ''
},
xAxis: {
type: 'datetime',
tickPixelInterval: 100,
gridLineColor: '#transparent',
labels: {
    style: {
        color: 'white'
    }
},
minorGridLineColor: '#transparent',
tickColor: 'white',
title: {
    style: {
        color: '#transparent'
    }
}
},
yAxis: {
title: {
  text: ''
},
gridLineColor: '#transparent',
labels: {
    style: {
        color: 'white'
    }
},
lineColor: 'white',
minorGridLineColor: 'transparent',
tickColor: 'white'
},
credits: {
enabled: false
},
series: [{
showInLegend: false,
name: 'Subscribers',
marker: { enabled: false },
color:'#ff0000',
lineColor: '#ff0000'
}]
});
</script>
