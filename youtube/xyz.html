<!DOCTYPE html>
<head>
    <title>Live Subscriber Count</title>
    <meta name="description" content="Live Next Subscriber Count">
    <link rel="stylesheet" href="https://subscriberwars.space/css/odometer.css">
    <link rel="stylesheet" href="https://subscriberwars.space/css/main.css">
    <script src="https://subscriberwars.space/js/odometer.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://code.highcharts.com/highcharts.js"></script>
    <script src="https://kit.fontawesome.com/93168af8d4.js" crossorigin="anonymous"></script>
</head>
<body>
    <div id="count-block">
        <div style="height: 205px; width: 1240px; margin:10px; overflow: hidden; border-radius: 10px; border: 1px solid #000;">
            <img id="headerImage"/>
        </div>
        <img id="logo" style="top:-227px; width: 200px; height: 200px;"/>
        <h1 id="title" style="top: -227px;">Loading...</h1>
        <div id='subcount' class="odometer odometer-auto-theme" style="font-size: 120pt; font-weight: 500; text-align: center; margin: 0px auto; margin-top: 10px; margin-bottom: 10px; position: relative; width: 1260px; top: -227px;">0</div>
        <h2 style="top: -227px;">Subscribers</h2>

    </div>
    <div id="mini-counts">
        <div id="like-box">
            <div id='viewcount' class="odometer odometer-auto-theme" style="font-size: 30pt; font-weight: 500; text-align: center; margin: 0px auto; margin-top: 10px; margin-bottom: 10px; position: relative; width: 410px;">0</div>
            <h2>Views</h2>
        </div>
        <div id="comment-box">
            <div id='videocount' class="odometer odometer-auto-theme" style="font-size: 30pt; font-weight: 500; text-align: center; margin: 0px auto; margin-top: 10px; margin-bottom: 10px; position: relative; width: 410px;">0</div>
            <h2>Videos</h2>
        </div>
        <div id="api-box">
            <div id='apicount' style="font-size: 30pt; font-weight: 500; text-align: center; margin: 0px auto; margin-top: 10px; margin-bottom: 10px; position: relative; width: 410px;">0</div>
            <h2>YouTube Displays</h2>
        </div>
    </div>
    <div id="credit">
        <h2>Powered by: <a href="https://livecounts.xyz" target="_blank">Livecounts.xyz</a></h2>
    </div>
    <div id="graph-block">
        <div id="graph" style="width: 1260px; height: 400px;"></div>
        <p id="graphstat" style="visibility: hidden;"></p>
    </div>
</body>

<script>

var string='';
string +='';

var channel = window.location.href.split('?u=')[1] || '';
const headerImage = document.getElementById("headerImage")

function checkForNew(chanid) {
    headerImage.src='https://www.banner.yt/'+chanid+'?width=1240';

    fetch('https://api.subscriberwars.space/est/xyz/'+chanid).then(res => res.json()).then(data => {
        title.innerHTML = data.info.name
        logo.src = data.info.pfp
        subcount.innerHTML = data.estCounts.subCount
        viewcount.innerHTML = data.estCounts.viewCount
        videocount.innerHTML = data.apiCounts.videoCount
        graphstat.innerHTML = data.estCounts.subCount
        var yep=(graphstat.innerHTML)
        console.log(yep)
        var injection=yep
        if(graph.series[0].points.length>=900)graph.series[0].data[0].remove();
        graph.series[0].addPoint([Date.now(),parseFloat(injection)])
        if (data.apiCounts.subCount<1000) {string=parseFloat(data.apiCounts.subCount)}
        if (data.apiCounts.subCount>1000) {string=parseFloat(data.apiCounts.subCount/1000)}
        if (data.apiCounts.subCount>1000) {string +='K'}
        if (data.apiCounts.subCount>10000) {string=parseFloat(data.apiCounts.subCount/1000)}
        if (data.apiCounts.subCount>10000) {string +='K'}
        if (data.apiCounts.subCount>100000) {string=parseFloat(data.apiCounts.subCount/1000)}
        if (data.apiCounts.subCount>100000) {string +='K'}
        if (data.apiCounts.subCount>1000000) {string=parseFloat(data.apiCounts.subCount/1000000)}
        if (data.apiCounts.subCount>1000000) {string +='M'}
        if (data.apiCounts.subCount>10000000) {string=parseFloat(data.apiCounts.subCount/1000000)}
        if (data.apiCounts.subCount>10000000) {string +='M'}
        if (data.apiCounts.subCount>100000000) {string=parseFloat(data.apiCounts.subCount/1000000)}
        if (data.apiCounts.subCount>100000000) {string +='M'}
        apicount.innerHTML=string
    });
}

// Intervals
setInterval(() => {
    checkForNew(channel)
}, 2000);

checkForNew(channel)

</script>

</script>

<script>//graph styling
    var graph = new Highcharts.chart({
chart: {
renderTo: 'graph',
type: 'spline',
zoomType: 'x',
backgroundColor: 'transparent',
plotBorderColor: 'transparent'
},
title: {
text: ''
},
xAxis: {
type: 'datetime',
tickPixelInterval: 100,
gridLineColor: '#transparent',
labels: {
    style: {
        color: 'white'
    }
},
minorGridLineColor: '#transparent',
tickColor: 'white',
title: {
    style: {
        color: '#transparent'
    }
}
},
yAxis: {
title: {
  text: ''
},
gridLineColor: '#transparent',
labels: {
    style: {
        color: 'white'
    }
},
lineColor: 'white',
minorGridLineColor: 'transparent',
tickColor: 'white'
},
credits: {
enabled: false
},
series: [{
showInLegend: false,
name: 'Subscribers',
marker: { enabled: false },
color:'#ff0000',
lineColor: '#ff0000'
}]
});
</script>
