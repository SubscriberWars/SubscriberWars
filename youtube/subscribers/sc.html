<head>
    <link href="https://fonts.googleapis.com/css?family=Roboto:100,200,300,400,500,600,700,800" rel="stylesheet" type="text/css">
    <link rel="stylesheet" href="/css/odometer.css">
    <link rel="stylesheet"href="/css/youtube_subs.css">
    <script src="https://kit.fontawesome.com/93168af8d4.js" crossorigin="anonymous"></script>
    <script src="/js/odometer.js"></script>
    <title id="page_title"></title>
</head>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-38E6Z6MEMP"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-38E6Z6MEMP');
</script>
<body>
    <div class="head">
        <div class="head_text">YouTube Live Subscriber Count</div>
    </div>
    <div class="main_box">
        <img id="channel_banner" src="/images/banner_placeholder.png">
        <img id="channel_image" src="/images/pfp_placeholder.png">
        <div id="channel_title_container">
            <a id="channel_title" href="" style="text-decoration: none; color: #fff;" title="" target="_blank" ></a>
        </div>
        <div id="channel_subscribers" class="odometer"></div>
        <div id="subscribers"><i class="fa fa-sharp fa-users"></i> Subscribers</div>
        <div class="bottom_data">
            <div class="bottom_counts">
                <div class="odometer bottom_odometer" id="channel_views"></div>
                <div class="bottom_text"><i class="fa fa-solid fa-eye"></i> Views</div>
            </div>
            <div class="bottom_counts">
                <div class="odometer bottom_odometer" id="channel_videos"></div>
                <div class="bottom_text"><i class="fa fa-sharp fa-video"></i> Videos</div>
            </div>
            <div class="bottom_counts">
                <div class="bottom_odometer" id="channel_abreviation"></div>
                <div class="bottom_text"><i class="fa fa-brand fa-youtube"></i> YouTube Displays</div>
            </div>
        </div>
        <div class="button_box">
            <a id="site" target="_blank" style="margin: auto; width: 1260px;">
                <button class="bott_button" style="margin-bottom: 10px; width: 1260px;">
                    <i class="fa-kit fa-sc"></i>  Go To SocialCounts
                </button>
            </a>
        </div>
        <div class="button_box">
            <a id="channel_sb" target="_blank" style="margin: auto; width: 1260px;">
                <button class="bott_button">
                    <i class="fa-kit fa-socialblade"></i> Go To Social Blade Profile
                </button>
            </a>
            <a id="channel_link" target="_blank" style="margin: auto; width: 1260px;">
                <button class="bott_button">
                    <i class="fa fa-brand fa-youtube"></i> Go To Channel
                </button>
            </a>
        </div>
    </div>
</body>

<script>
    var channel = window.location.href.split('?u=')[1] || '';
    var string='';
    string +='';
    const channel_banner = document.getElementById("channel_banner")

    function stats(chanid) {
        channel_banner.src="https://www.banner.yt/"+chanid+"?width=1260"
        fetch("https://api.subscriberwars.space/est/sc/"+chanid).then(res=>res.json()).then(data=>{
            page_title.innerHTML=data.info.name+"'s Live Subscriber Count"
            channel_image.src=data.info.pfp
            channel_title.href="https://youtube.com/channel/"+data.info.id
            channel_title.title="Visit "+data.info.name+"'s channel"
            channel_title.innerHTML=data.info.name
            channel_subscribers.innerHTML=data.estCounts.subCount
            channel_views.innerHTML=data.estCounts.viewCount
            channel_videos.innerHTML=data.apiCounts.videoCount
            site.href="https://socialcounts.org/youtube-live-subscriber-count/"+data.info.id
            channel_sb.href="https://socialblade.com/youtube/c/"+data.info.handle
            channel_link.href="https://youtube.com/channel/"+data.info.id
            if (data.apiCounts.subCount<1000) {string=parseFloat(data.apiCounts.subCount)}
            if (data.apiCounts.subCount>1000) {string=parseFloat(data.apiCounts.subCount/1000)}
            if (data.apiCounts.subCount>1000) {string +='K'}
            if (data.apiCounts.subCount>10000) {string=parseFloat(data.apiCounts.subCount/1000)}
            if (data.apiCounts.subCount>10000) {string +='K'}
            if (data.apiCounts.subCount>100000) {string=parseFloat(data.apiCounts.subCount/1000)}
            if (data.apiCounts.subCount>100000) {string +='K'}
            if (data.apiCounts.subCount>1000000) {string=parseFloat(data.apiCounts.subCount/1000000)}
            if (data.apiCounts.subCount>1000000) {string +='M'}
            if (data.apiCounts.subCount>10000000) {string=parseFloat(data.apiCounts.subCount/1000000)}
            if (data.apiCounts.subCount>10000000) {string +='M'}
            if (data.apiCounts.subCount>100000000) {string=parseFloat(data.apiCounts.subCount/1000000)}
            if (data.apiCounts.subCount>100000000) {string +='M'}
            channel_abreviation.innerHTML=string
        })
    }
    stats(channel)
    setInterval(() => {
        stats(channel)
    }, 2000);
</script>
