<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NextCounts Unabbriviate Project - Channel List</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/css/odometer.css">
    <style>
        * {
            font-family: plus jakarta Sans, sans-serif;
            color: #eee
        }

        body {
            background-color: rgb(12, 17, 24);
        }

        h1 {
            text-align: center;
            margin: auto;
        }

        h2 {
            text-align: center;
            margin: auto;
            font-weight: 400;
        }

        h3 {
            text-align: center;
            margin: auto;
            font-weight: 500;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            padding: 20px;
        }

        .grid-item {
            border: 1px solid #293744;
            padding: 10px;
            text-align: center;
            background-color: #151e28;
            border-radius: 5px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .grid-item:hover {
            transform: scale(1.05);
            background-color: #1b2834;
        }

        .grid-item img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 50%;
            margin-bottom: 10px;
        }

        .grid-item p {
            margin: 5px 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .error {
            color: red;
            margin-top: 10px;
            padding-left: 20px;
        }
    </style>
</head>

<body>
    <h1>Channels Sharing their Unabbreviated Subscriber Count Via the NextCounts Studio Project</h1>
    <h2 id="totalSubscribers"></h2><br>
    <h3>Add your channel to the project: <a href="https://nextcounts.com/unabbreviate/" target="_blank" title="Unabbreviate Project">Here</a></h3>
    <div id="gridContainer" class="grid-container"></div>
    <div id="errorMessage" class="error"></div>

    <script>
        async function fetchAndDisplayChannels() {
            const apiUrl = 'https://api.nextcounts.com/api/youtube/studio/channels';
            const gridContainer = document.getElementById('gridContainer');
            const errorMessage = document.getElementById('errorMessage');
            const totalSubscribersElement = document.getElementById('totalSubscribers');

            try {
                const response = await fetch(apiUrl);
                if (!response.ok) {
                    throw new Error(`HTTP error! Status: ${response.status}`);
                }
                const data = await response.json();

                // Log the raw response to inspect its structure
                console.log('API Response:', data);

                // Clear any existing content
                gridContainer.innerHTML = '';
                totalSubscribersElement.innerHTML = '';

                // Handle different response structures
                let channels = [];
                if (Array.isArray(data)) {
                    channels = data.data;
                } else if (data && Array.isArray(data.data)) {
                    channels = data.data;
                } else {
                    throw new Error('Unexpected data format: No valid array found');
                }

                const totalSubscribers = data.totals.subscribers
                const totalChannels = data.meta.total;

                // Display total subscribers and channels
                totalSubscribersElement.innerHTML = `Total Subscribers: ${totalSubscribers.toLocaleString()} - Total Channels: ${totalChannels.toLocaleString()}`;

                // Sort channels by subscribers (highest to lowest)
                channels.sort((a, b) => (b.subscribers || 0) - (a.subscribers || 0));

                // Populate the grid
                channels.forEach(channel => {
                    const item = document.createElement('div');
                    item.className = 'grid-item';
                    item.onclick = () => window.location.href = `channel.html?channel=${channel.id}&type=estimate`;
                    item.innerHTML = `
                <img src="${channel.avatar || '/images/pfp_placeholder.png'}" alt="${channel.channelName || 'Channel Image'}" onerror="this.src='/images/pfp_placeholder.png';">
                <p><strong>${channel.title || 'N/A'}</strong></p>
                <p>Subscribers: ${channel.subscribers?.toLocaleString() || 'N/A'}</p>
            `;
                    gridContainer.appendChild(item);
                });
            } catch (error) {
                console.error('Error fetching data:', error);
                errorMessage.textContent = `Failed to load data: ${error.message}`;
            }
        }

        window.onload = fetchAndDisplayChannels;
    </script>
</body>

</html>
