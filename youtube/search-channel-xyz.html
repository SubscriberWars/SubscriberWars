<!DOCTYPE html>
<html>
    <head>
        <title>YouTube Channel Search</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
        <script src="\js\yt-search-xyz.js"></script>
        <link rel="stylesheet" href="\css\yt-search.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
        <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1716761206170121"
     crossorigin="anonymous"></script>
    </head>
    <body>
        <div class="container">
            <br><br><br>
            <h1 style="text-align: center; color: #fff;">YouTube Channel Search</h1>
            <br>
            <form>
                <div style="display: flex; width: 100%;">
                    <input class="form-control mr-sm-2" id="search" placeholder="Channel To Search For">
                    <button type="submit" class="searchbtn" value="Search"><i class="fa fa-fw fa-search" style="width: 100%;"></i></button>
                </div>
            </form>
            <br>
            <div class="row">
                <a href="" id="link1">
                   <div id="chan1" class="chan-card">
                       <img src="" id="img1" class="pfp">
                       <div id="nam1" class="chan-name"></div>
                       <div id="id1" class="chan-id"></div>
                   </div>
                </a>
                <a href="" id="link2">
                   <div id="chan2" class="chan-card">
                       <img src="" id="img2" class="pfp">
                       <div id="nam2" class="chan-name"></div>
                       <div id="id2" class="chan-id"></div>
                   </div>
                </a>
                <a href="" id="link3">
                   <div id="chan3" class="chan-card">
                       <img src="" id="img3" class="pfp">
                       <div id="nam3" class="chan-name"></div>
                       <div id="id3" class="chan-id"></div>
                   </div>
                </a>
                <a href="" id="link4">
                   <div id="chan4" class="chan-card">
                       <img src="" id="img4" class="pfp">
                       <div id="nam4" class="chan-name"></div>
                       <div id="id4" class="chan-id"></div>
                    </div>
                </a>
                <a href="" id="link5">
                   <div id="chan5" class="chan-card">
                       <img src="" id="img5" class="pfp">
                       <div id="nam5" class="chan-name"></div>
                       <div id="id5" class="chan-id"></div>
                   </div>
                </a>
            </div>
        </div>
    </body>
    <script>
        $(document).ready(function(){

$('form').submit(function(event){
    event.preventDefault()

    var search = $("#search").val()

    channelSearch(search,5)
})

function channelSearch(search,maxResults) {
    fetch("https://api.subscriberwars.space/youtube/channel-search/" + maxResults + "/" + search).then(res => res.json()).then(data => {
       console.log(data)

       img1.src = data.items[0].snippet.thumbnails.high.url
       nam1.innerHTML = data.items[0].snippet.channelTitle
       id1.innerHTML = data.items[0].id.channelId
       link1.href = "https://subscriberwars.space/youtube/xyz?u="+data.items[0].id.channelId

       img2.src = data.items[1].snippet.thumbnails.high.url
       nam2.innerHTML = data.items[1].snippet.channelTitle
       id2.innerHTML = data.items[1].id.channelId
       link2.href = "https://subscriberwars.space/youtube/xyz?u="+data.items[1].id.channelId

       img3.src = data.items[2].snippet.thumbnails.high.url
       nam3.innerHTML = data.items[2].snippet.channelTitle
       id3.innerHTML = data.items[2].id.channelId
       link3.href = "https://subscriberwars.space/youtube/xyz?u="+data.items[2].id.channelId

       img4.src = data.items[3].snippet.thumbnails.high.url
       nam4.innerHTML = data.items[3].snippet.channelTitle
       id4.innerHTML = data.items[3].id.channelId
       link4.href = "https://subscriberwars.space/youtube/xyz?u="+data.items[3].id.channelId

       img5.src = data.items[4].snippet.thumbnails.high.url
       nam5.innerHTML = data.items[4].snippet.channelTitle
       id5.innerHTML = data.items[4].id.channelId
       link5.href = "https://subscriberwars.space/youtube/xyz?u="+data.items[4].id.channelId
    })
}
})
    </script>
</html>
