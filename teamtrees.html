<!DOCTYPE html>
<head>
    <title>#TeamTrees</title>
    <meta name="description" content="Live #TeamTrees Statistics">
    <link rel="stylesheet" href="/css/odometer.css">
    <script src="/js/odometer.js"></script>
    <script type="text/javascript" src="/js/jquery-3.1.1.min.js"></script>
    <script src="https://code.highcharts.com/highcharts.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
</head>
<style>
    body, html {margin: 0px; padding: 0px; color: #fff; font-size: 11pt; font-family: 'Roboto', sans-serif; display: block; background: #181818;}
    a {color: #fff;}
    div {display: block;}
    h1 {font-weight: 400; font-size: 40pt; margin: 0px auto; position: relative; text-align: center;}
    h2 {font-weight: 400; font-size: 20pt; margin: 0px auto; position: relative; text-align: center;}
    #count-block {width:1260px; height:550px; margin: 0px auto; margin-top: 20px; background:#0f0f0f; overflow: hidden; position: relative; border: 1px solid #000; box-shadow: 3px 3px 2px #000; border-radius: 10px;}
    #logo {width: 200px; width: 200px; position: relative; margin: 0px auto; margin-top: 10px; left: 42%; -webkit-box-shadow: 0px 0px 8px 0px rgba(255, 255, 255, 0.2); -moz-box-shadow: 0px 0px 8px 0px rgba(255, 255, 255, 0.3); box-shadow: 0px 0px 8px 0px rgba(255, 255, 255, 0.3); border-radius: 50%;}
    #mini-counts {width:1260px; margin: 0px auto; margin-top: 20px;}
    #stat-box {width: 408px; height: 250px; position: relative; float: left; margin: 0px auto; margin-bottom: 20px; background: #0f0f0f; overflow: hidden; border: 1px solid #000; box-shadow: 3px 3px 2px #000; border-radius: 10px;}
    #goal-box {width: 395px; height: 120px; position: relative; float: left; margin: 0px auto; margin-right: 20px; margin-left: 20px; margin-bottom: 20px; background: #0f0f0f; overflow: hidden;border: 1px solid #000; box-shadow: 3px 3px 2px #000; border-radius: 10px;}
    #graph-block {width:1260px; height:400px; margin: 0px auto; margin-top: 20px; margin-bottom: 20px; background:#0f0f0f; overflow: hidden; position: relative; border: 1px solid #000; box-shadow: 3px 3px 2px #000; border-radius: 10px;}
    </style>
<body>
    <div id="count-block">
        <img id="logo" src="/images/teamtrees.png" alt="#TeamSeas">
        <h1><a style="color: #fff" href="https://teamtrees.org" target="_blank">#TeamTrees</a></h1>
        <div id='total' class="odometer odometer-auto-theme" style="font-size: 120pt; font-weight: 500; text-align: center; margin: 0px auto; margin-top: 10px; margin-bottom: 10px; position: relative; width: 1260px;">0</div>
        <h2>Trees</h2>
    </div>
    <div id="mini-counts">
        <div id="stat-box">
            <div id='latlbs' class="odometer odometer-auto-theme" style="font-size: 30pt; font-weight: 500; text-align: center; margin: 0px auto; margin-top: 10px; margin-bottom: 10px; position: relative; width: 400px;">0</div>
            <h2>Latest Donation</h2>
            <div id='latnam' style="font-size: 30pt; font-weight: 500; text-align: center; margin: 0px auto; margin-top: 20px; margin-bottom: 10px; position: relative; width: 350px; text-overflow: ellipsis; white-space: nowrap; overflow: hidden;">Loading...</div>
            <h2>Latest Donator</h2>
        </div>
        <div id="goal-box">
            <div id='goal' class="odometer odometer-auto-theme" style="font-size: 30pt; font-weight: 500; text-align: center; margin: 0px auto; margin-top: 10px; margin-bottom: 10px; position: relative; width: 400px;">0</div>
            <h2>Goal</h2>
        </div>
        <div id="stat-box">
            <div id='toplbs' class="odometer odometer-auto-theme" style="font-size: 30pt; font-weight: 500; text-align: center; margin: 0px auto; margin-top: 10px; margin-bottom: 10px; position: relative; width: 400px;">0</div>
            <h2>Highest Donation</h2>
        <div id='topnam' style="font-size: 30pt; font-weight: 500; text-align: center; margin: 0px auto; margin-top: 20px; margin-bottom: 10px; position: relative; width: 400px; text-overflow: ellipsis; white-space: nowrap; overflow: hidden;">Loading...</div>
            <h2>Highest Donator</h2>
        </div>
    </div>
    <div id="graph-block">
        <div id="graph" style="width: 1260px; height: 400px;"></div>
        <p id="graphstat" style="visibility: hidden;"></p>
    </div>
</body>

<script>//Data Collection
$(document).ready(function(){
var url='https://api.subscriberwars.space/teamtrees'
$.getJSON(url,function(data){
    graphstat.innerHTML=data.total
    total.innerHTML=data.total
    goal.innerHTML=30000000-data.total
    toplbs.innerHTML=data.top_count
    topnam.innerHTML=data.top_name
    latlbs.innerHTML=data.latest_count
    latnam.innerHTML=data.latest_name
})
setInterval(function(){
    $.getJSON(url,function(data){
        graphstat.innerHTML=data.total
        total.innerHTML=data.total
        goal.innerHTML=30000000-data.total
        toplbs.innerHTML=data.top_count
        topnam.innerHTML=data.top_name
        latlbs.innerHTML=data.latest_count
        latnam.innerHTML=data.latest_name
    })
    var yep=(graphstat.innerHTML)
    console.log(yep)
    var injection=yep
    if(graph.series[0].points.length>=1800)graph.series[0].data[0].remove();
    graph.series[0].addPoint([Date.now(),parseFloat(injection)])
},2000);
})
</script>

<script>//graph styling
    var graph = new Highcharts.chart({
chart: {
renderTo: 'graph',
type: 'spline',
zoomType: 'x',
backgroundColor: 'transparent',
plotBorderColor: 'transparent'
},
title: {
text: ''
},
xAxis: {
type: 'datetime',
tickPixelInterval: 100,
gridLineColor: '#transparent',
labels: {
    style: {
        color: 'white'
    }
},
minorGridLineColor: '#transparent',
tickColor: 'white',
title: {
    style: {
        color: '#transparent'
    }
}
},
yAxis: {
title: {
  text: ''
},
gridLineColor: '#transparent',
labels: {
    style: {
        color: 'white'
    }
},
lineColor: 'white',
minorGridLineColor: 'transparent',
tickColor: 'white'
},
credits: {
enabled: true,
text: "TeamTrees.org"
},
series: [{
showInLegend: false,
name: '#TeamTrees',
marker: { enabled: false },
lineColor: '#58a628'
}]
});
</script>
