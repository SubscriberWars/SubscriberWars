<body>
    <div class="head">
        <div class="head_text"><i class="fa-kit fa-x"></i> Live User Stats</div>
    </div>
    <div class="main_box">
        <img id="channel_banner" src="/images/banner_placeholder.png">
        <img id="channel_image" src="/images/pfp_placeholder.png">
        <div id="channel_title_container">
            <span id="channel_title"></span>
            <i class="fa fa-badge-check"  style="display: none;" id="verified_blue" title=""></i>
            <i class="fa fa-badge-check"  style="display: none;" id="verified_gold" title=""></i>
            <i class="fa fa-badge-check"  style="display: none;" id="verified_gray" title=""></i>
            <i class="fa fa-badge-check"  style="display: none;" id="verified_red" title=""></i>
        </div>
        <div id="channel_subscribers" class="odometer"></div>
        <div id="subscribers"><i class="fa fa-sharp fa-users"></i> Followers</div>
        <div class="bottom_data">
            <div class="bottom_counts">
                <div class="odometer bottom_odometer" id="channel_views"></div>
                <div class="bottom_text"><i class="fa-kit fa-x"></i> Posts</div>
            </div>
            <div class="bottom_counts">
                <div class="odometer bottom_odometer" id="channel_videos"></div>
                <div class="bottom_text"><i class="fa fa-sharp fa-user"></i> Following</div>
            </div>
            <div class="bottom_counts">
                <div class="odometer bottom_odometer" id="channel_goal"></div>
                <div class="bottom_text"><i class="fa fa-sharp fa-goal-net"></i> Goal</div>
            </div>
        </div>
        <div class="button_box">
            <a id="channel_sb" target="_blank" style="margin: auto; width: 1260px;">
                <button class="bott_button">
                    <i class="fa-kit fa-socialblade"></i> Go To Social Blade Profile
                </button>
            </a>
            <a id="channel_link" target="_blank" style="margin: auto; width: 1260px;">
                <button class="bott_button">
                    <i class="fa-kit fa-x"></i> Go To Profile
                </button>
            </a>
        </div>
    </div>
    <p id="goal01" style="display: none;"></p>
</body>

<style>
    body {
        background: #181818;
        color: #fff;
        margin: 0;
        font-family: roboto;
    }
    .head {
        width: 100%;
        height: 60px;
        background: #000;
        overflow: hidden;
        border-bottom: 1px solid #000;
    }
    .head_text {
        text-align: center;
        vertical-align: middle;
        font-weight: 500;
        font-size: 3rem;
    }
    .main_box {
        width: 1260px;
        height: 825px;
        background: #0f0f0f;
        margin: auto;
        padding: 10px;
        margin-top: 20px;
        border: 1px solid #000;
        border-radius: 10px;
        text-align: center;
    }
    #channel_banner {
        width: 100%;
        border: 1px solid #000;
        border-radius: 10px;
        height: 208px;
    }
    #channel_image {
        width: 200px;
        height: 200px;
        border: 1px solid #000;
        border-radius: 10px;
        top: -100px;
        position: relative;
    }
    #channel_title_container {
        position: relative;
        top: -100px;
        font-size: 4rem;
    }
    #channel_subscribers {
        position: relative;
        top: -90px;
        font-size: 12rem;
        font-weight: 500;
    }
    #subscribers {
        position: relative;
        top: -80px;
        font-size: 2rem;
    }
    .bottom_data {
        width: 100%;
        height: 150px;
        position: relative;
        display: flex;
        top: -70px;
    }
    .bottom_counts {
        margin: 5px;
        padding: 10px;
        width: 400px;
        height: 130px;
        background: #000;
        border-radius: 10px;
    }
    .bottom_odometer {
        font-weight: 500;
        font-size: 3rem;
    }
    .bottom_text {
        font-size: 2rem;
        margin-top: 20px;
    }
    ::-webkit-scrollbar {
        width: 5px;
    }
    ::-webkit-scrollbar-track {
        border-radius: 2.5px;
    }
    ::-webkit-scrollbar-thumb {
        background: #000;
        border-radius: 2.5px;
    }
    ::-webkit-scrollbar-thumb:hover {
        background: #fff;
        border-radius: 2.5px;
    }
    .button_box {
        width: 1260px;
        margin: auto;
        display: flex;
        position: relative;
        top: -30px;
    }

        width: 620px;
        margin: auto;
        background: #0f0f0f;
        color: #fff;

        font-size: 30px;
        border-radius: 10px;
        border: 1px solid #000;

        cursor: pointer;
        background: #000;
        border: 1px solid #fff;
    }
</style>

<script>
    var channel = window.location.href.split('?u=')[1] || '';
    var string='';
    string +='';
    var veri="";

    function stats(chanid) {
        fetch("https://api.subscriberwars.space/x/"+chanid).then(res=>res.json()).then(data=>{
            page_title.innerHTML=data.name+"'s Live Follower Count"
            channel_image.src=data.pfp.replace("normal","400x400")
            channel_title.innerHTML=data.name
            channel_subscribers.innerHTML=data.followers
            channel_views.innerHTML=data.posts
            channel_videos.innerHTML=data.following
            channel_banner.src=data.banner
            channel_link.href="https://x.com/"+data.screen_name
            channel_sb.href="https://socialblade.com/twitter/user/"+data.screen_name
            if (data.x_subscriber==true) {document.getElementById("verified_blue").style.color="#0e4ef0"}
            if (data.x_subscriber==true) {document.getElementById("verified_blue").style.display="inline"} else {document.getElementById("verified_blue").style.width="0px"}
            if (data.x_subscriber==true) {document.getElementById("verified_blue").title="This account is subscribed to X Premium"}
            if(data.followers>=0) {goal01.innerHTML=10}
            if(data.followers>=10) {goal01.innerHTML=100}
            if(data.followers>=100) {goal01.innerHTML=1000}
            if(data.followers>=1000) {goal01.innerHTML=(Math.floor(data.followers/1000)*1000)+1000}
            if(data.followers>=10000) {goal01.innerHTML=(Math.floor(data.followers/10000)*10000)+10000}
            if(data.followers>=100000) {goal01.innerHTML=(Math.floor(data.followers/100000)*100000)+100000}
            if(data.followers>=1000000) {goal01.innerHTML=(Math.floor(data.followers/1000000)*1000000)+1000000}
            if(data.followers>=10000000) {goal01.innerHTML=(Math.floor(data.followers/10000000)*10000000)+10000000}
            if(data.followers>=100000000) {goal01.innerHTML=(Math.floor(data.followers/100000000)*100000000)+100000000}
            channel_goal.innerHTML=goal01.innerHTML-data.followers
            if (data.verification.reason.description.text=="This account is verified because it's an official organization on X. Learn more") {document.getElementById("verified_gold").style.color="#f7c305"}
            if (data.verification.reason.description.text=="This account is verified because it's an official organization on X. Learn more") {document.getElementById("verified_gold").style.display="inline"} else {document.getElementById("verified_gold").style.width="0px"}
            if (data.verification.reason.description.text=="This account is verified because it's an official organization on X. Learn more") {document.getElementById("verified_gold").title="This account is an official organisation on X"}
            if (data.verification.reason.description.text=="This account is verified because it is a government or multilateral organization account.  Learn more") {document.getElementById("verified_gray").style.color="#8f8f8f"}
            if (data.verification.reason.description.text=="This account is verified because it is a government or multilateral organization account.  Learn more") {document.getElementById("verified_gray").style.display="inline"} else {document.getElementById("verified_gray").style.width="0px"}
            if (data.verification.reason.description.text=="This account is verified because it is a government or multilateral organization account.  Learn more") {document.getElementById("verified_gray").title="This account is government or multilateral"}
            if (data.verification.reason.description.text.split(' ')[7]=="affiliate") {document.getElementById("verified_red").style.color="#ff0000"}
            if (data.verification.reason.description.text.split(' ')[7]=="affiliate") {document.getElementById("verified_red").style.display="inline"} else {document.getElementById("verified_red").style.width="0px"}
            if (data.verification.reason.description.text.split(' ')[7]=="affiliate") {document.getElementById("verified_red").title=data.verification.reason.description.text.split(" Learn more")}
        })
    }
    stats(channel)
    setTimeout(() => {
        setInterval(() => {
            stats(channel)
        }, 10000);
    }, 5000);
</script>
