<!DOCTYPE html>

<head>
    <link rel="stylesheet" href="https://subscriberwars.space/css/odometer.css">
    <script src="https://subscriberwars.space/js/odometer.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://code.highcharts.com/highcharts.js"></script>
    <link rel="stylesheet" href="https://subscriberwars.space/css/main.css">
</head>

<body>
    <div id="count-block">
        <img id="logo" src="https://subscriberwars.space/images/instagram.svg" alt="">
        <h1 id="title">Loading...</h1>
        <div id='follower_count' class="odometer odometer-auto-theme" style="font-size: 120pt; font-weight: 500; text-align: center; margin: 0px auto; margin-top: 10px; margin-bottom: 10px; position: relative; width: 1260px;">0</div>
        <h2>Followers</h2>
    </div>
    <div id="mini-counts">
        <div id="like-box">
            <div id='following_count' class="odometer"  style="font-size: 30pt; font-weight: 500; text-align: center; margin: 0px auto; margin-top: 10px; margin-bottom: 10px; position: relative; width: 411px;">0</div>
            <h2>Following</h2>
        </div>
        <div id="comment-box">
            <div id='media_count' class="odometer" style="font-size: 30pt; font-weight: 500; text-align: center; margin: 0px auto; margin-top: 10px; margin-bottom: 10px; position: relative; width: 411px;">Loading...</div>
            <h2>Media</h2>
        </div>
        <div id="api-box">
            <div id='goalcount' class="odometer odometer-auto-theme" style="font-size: 30pt; font-weight: 500; text-align: center; margin: 0px auto; margin-top: 10px; margin-bottom: 10px; position: relative; width: 411px;">Loading...</div>
            <h2>Goal</h2>
        </div>
    </div>
    <div id="graph-block">
        <div id="graph" style="width: 1260px; height: 400px;"></div>
        <p id="graphstat" style="visibility: hidden;"></p>
        <p id="goal01" style="visibility: hidden;"></p>
    </div>
</body>

<script>
    var channel = window.location.href.split('?u=')[1] || '';
    var followerCount=""
    var average=""

    function instagram(chanid) {
        fetch('https://api.subscriberwars.space/instagram/'+chanid)
        .then(res=>res.json())
        .then(data=>{
            followerCount=data.items.followers_count
            media_count.innerHTML=data.items.media_count
            following_count.innerHTML=data.items.follows_count
            title.innerHTML=data.items.name
            logo.src=data.items.profile_picture_url
        })
    }
    function socialblade(chanid) {
        fetch('https://api.subscriberwars.space/sb/instagram/'+chanid)
        .then(res=>res.json())
        .then(data=>{
            average=data.data.statistics.growth.followers[7]/604800
        })
    }
    function calculate() {
        followerCount=Math.round(followerCount+average)
        follower_count.innerHTML=followerCount
        graphstat.innerHTML=followerCount
        var yep=(graphstat.innerHTML)
        var injection=yep
        if(graph.series[0].points.length>=900)graph.series[0].data[0].remove();
        graph.series[0].addPoint([Date.now(),parseFloat(injection)])
        if(followerCount>=0) {goal01.innerHTML=10}
        if(followerCount>=10) {goal01.innerHTML=100}
        if(followerCount>=100) {goal01.innerHTML=1000}
        if(followerCount>=1000) {goal01.innerHTML=(Math.floor(followerCount/1000)*1000)+1000}
        if(followerCount>=10000) {goal01.innerHTML=(Math.floor(followerCount/10000)*10000)+10000}
        if(followerCount>=100000) {goal01.innerHTML=(Math.floor(followerCount/100000)*100000)+100000}
        if(followerCount>=1000000) {goal01.innerHTML=(Math.floor(followerCount/1000000)*1000000)+1000000}
        if(followerCount>=10000000) {goal01.innerHTML=(Math.floor(followerCount/10000000)*10000000)+10000000}
        goalcount.innerHTML=goal01.innerHTML-followerCount
    }

    instagram(channel)
    socialblade(channel)
    setInterval(() => {
        instagram(channel)
    }, 1800*1000);

    setInterval(() => {
        socialblade(channel)
    }, 3600*1000);

    setTimeout(() => {
        setInterval(() => {
        calculate()
    }, 2000) 
    }, 5000);

</script>

<script>//graph styling
    var graph = new Highcharts.chart({
chart: {
renderTo: 'graph',
type: 'spline',
zoomType: 'x',
backgroundColor: 'transparent',
plotBorderColor: 'transparent'
},
title: {
text: ''
},
xAxis: {
type: 'datetime',
tickPixelInterval: 100,
gridLineColor: '#transparent',
labels: {
    style: {
        color: 'white'
    }
},
minorGridLineColor: '#transparent',
tickColor: 'white',
title: {
    style: {
        color: '#transparent'
    }
}
},
yAxis: {
title: {
  text: ''
},
gridLineColor: '#transparent',
labels: {
    style: {
        color: 'white'
    }
},
lineColor: 'white',
minorGridLineColor: 'transparent',
tickColor: 'white'
},
credits: {
enabled: false,
text: "Subscriberwars.space"
},
series: [{
showInLegend: false,
name: 'Followers',
marker: { enabled: false },
lineColor: '#ff7300',
color:'#ff7300'
}]
});
</script>
