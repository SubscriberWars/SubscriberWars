<!DOCTYPE html>

<head>
    <link rel="stylesheet" href="https://subscriberwars.space/css/odometer.css">
    <script src="https://subscriberwars.space/js/odometer.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/93168af8d4.js" crossorigin="anonymous"></script>
</head>

<body>
    <div class="head">
        <div class="head_text">Instagram Live Follower Count</div>
    </div>
    <div class="main_box">
        <img id="channel_banner" src="/images/banner_placeholder.png">
        <img id="channel_image" src="/images/pfp_placeholder.png">
        <div id="channel_title_container">
            <a id="channel_title" href="" style="text-decoration: none; color: #fff;" title="Visit Channel" target="_blank" ></a>
            <i class="fa fa-badge-check"  style="display: none; color: #fff;" id="verified" title=""></i>
        </div>
        <div id="channel_subscribers" class="odometer"></div>
        <div id="subscribers"><i class="fa fa-brand fa-instagram"></i> Instagram Followers</div>
        <div class="bottom_data">
            <div class="bottom_counts">
                <div class="odometer bottom_odometer" id="channel_views"></div>
                <div class="bottom_text"><i class="fa fa-sharp fa-users"></i> Following</div>
            </div>
            <div class="bottom_counts">
                <div class="odometer bottom_odometer" id="channel_videos"></div>
                <div class="bottom_text"><i class="fa fa-sharp fa-video"></i> Media</div>
            </div>
            <div class="bottom_counts">
                <div class="odometer bottom_odometer" id="channel_abreviation"></div>
                <div class="bottom_text"><i class="fa fa-sharp fa-goal-net"></i> Goal</div>
            </div>
        </div>
    </div>
    <p id="goal01" style="visibility: hidden;"></p>
</body>

<script>
    var channel = window.location.href.split('?u=')[1] || '';
    var followerCount=""
    var average=""
    const list=[];

    function instagram(chanid) {
        fetch('https://api.subscriberwars.space/instagram/'+chanid)
        .then(res=>res.json())
        .then(data=>{
            followerCount=data.items.followers_count
            list.unshift(data.items.followers_count)
            if(list.length>2){list.pop()}
            if(list.length>1){average=(list[1]-list[0])}
            channel_videos.innerHTML=data.items.media_count
            channel_views.innerHTML=data.items.follows_count
            channel_title.innerHTML=data.items.name
            channel_image.src=data.items.profile_picture_url
            channel_banner.src=data.items.profile_picture_url
        })
        console.log(list,average)
    }
    function socialblade(chanid) {
        fetch('https://api.subscriberwars.space/sb/instagram/'+chanid)
        .then(res=>res.json())
        .then(data=>{
            average=data.data.statistics.growth.followers[7]/604800
        })
    }
    function calculate() {
        followerCount=Math.round(followerCount+average)
        channel_subscribers.innerHTML=followerCount
        if(followerCount>=0) {goal01.innerHTML=10}
        if(followerCount>=10) {goal01.innerHTML=100}
        if(followerCount>=100) {goal01.innerHTML=1000}
        if(followerCount>=1000) {goal01.innerHTML=(Math.floor(followerCount/1000)*1000)+1000}
        if(followerCount>=10000) {goal01.innerHTML=(Math.floor(followerCount/10000)*10000)+10000}
        if(followerCount>=100000) {goal01.innerHTML=(Math.floor(followerCount/100000)*100000)+100000}
        if(followerCount>=1000000) {goal01.innerHTML=(Math.floor(followerCount/1000000)*1000000)+1000000}
        if(followerCount>=10000000) {goal01.innerHTML=(Math.floor(followerCount/10000000)*10000000)+10000000}
        channel_abreviation.innerHTML=goal01.innerHTML-followerCount
    }

    instagram(channel)
    setInterval(() => {
        instagram(channel)
    }, 300*1000);

    setTimeout(() => {
        socialblade(channel)
    }, 1000);

    setTimeout(() => {
        setInterval(() => {
        calculate()
    }, 2000)
    }, 5000);

</script>
