<!DOCTYPE html>

<head>
    <link rel="stylesheet" href="https://subscriberwars.space/css/odometer.css">
    <script src="https://subscriberwars.space/js/odometer.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/93168af8d4.js" crossorigin="anonymous"></script>
</head>

<body>
    <div class="head">
        <div class="head_text">Instagram Live Follower Count</div>
    </div>
    <div class="main_box">
        <img id="channel_banner" src="/images/banner_placeholder.png">
        <img id="channel_image" src="/images/pfp_placeholder.png">
        <div id="channel_title_container">
            <a id="channel_title" href="" style="text-decoration: none; color: #fff;" title="Visit Channel" target="_blank" >Loading...</a>
            <i class="fa fa-badge-check"  style="display: none; color: #fff;" id="verified" title=""></i>
        </div>
        <div id="channel_subscribers" class="odometer"></div>
        <div id="subscribers"><i class="fa fa-brand fa-instagram"></i> Followers</div>
        <div class="bottom_data">
            <div class="bottom_counts">
                <div class="odometer bottom_odometer" id="channel_views"></div>
                <div class="bottom_text"><i class="fa fa-sharp fa-users"></i> Following</div>
            </div>
            <div class="bottom_counts">
                <div class="odometer bottom_odometer" id="channel_videos"></div>
                <div class="bottom_text"><i class="fa fa-sharp fa-video"></i> Media</div>
            </div>
            <div class="bottom_counts">
                <div class="odometer bottom_odometer" id="channel_goal"></div>
                <div class="bottom_text"><i class="fa fa-sharp fa-goal-net"></i> Goal</div>
            </div>
        </div>
    </div>
    <div class="button_box">
        <a id="channel_sb" target="_blank" style="margin: auto; width: 1260px;">
            <button class="bott_button">
                <i class="fa-kit fa-socialblade"></i> Go To Social Blade Profile
            </button>
        </a>
        <a id="channel_link" target="_blank" style="margin: auto; width: 1260px;">
            <button class="bott_button">
                <i class="fa fa-brands fa-instagram"></i> Go To Profile
            </button>
        </a>
    </div>
    <div class="button_box">
        <a href="https://mixerno.space/instagram-user-counter" style="margin: auto; width: 1260px;">
            <button class="credit_box">Powered by: Mixerno</button>
        </a>
    </div>
    <p id="goal01" style="visibility: hidden;"></p>
</body>

<script>
    var channel = window.location.href.split('?u=')[1] || '';
    var goal01=[];

    function instagram(chanid) {
        fetch('https://api.subscriberwars.space/instagram2/'+chanid)
        .then(res=>res.json())
        .then(data=>{
            channel_subscribers.innerHTML=data.user.followerCount
            channel_videos.innerHTML=data.user.posts
            channel_views.innerHTML=data.user.following
            channel_title.innerHTML=data.user.name
            channel_title.href="https://instagram.com/"+data.user.username
            channel_link.href="https://instagram.com/"+data.user.username
            channel_sb.href="https://socialblade.com/instagram/user/"+data.user.username
            if(data.user.isVerified==true){document.getElementById("verified").style.display="inline"} else {document.getElementById("verified").style.width="0px"}
            if(data.user.followerCount>=0) {goal01.innerHTML=10}
            if(data.user.followerCount>=10) {goal01.innerHTML=100}
            if(data.user.followerCount>=100) {goal01.innerHTML=1000}
            if(data.user.followerCount>=1000) {goal01.innerHTML=(Math.floor(data.user.followerCount/1000)*1000)+1000}
            if(data.user.followerCount>=10000) {goal01.innerHTML=(Math.floor(data.user.followerCount/10000)*10000)+10000}
            if(data.user.followerCount>=100000) {goal01.innerHTML=(Math.floor(data.user.followerCount/100000)*100000)+100000}
            if(data.user.followerCount>=1000000) {goal01.innerHTML=(Math.floor(data.user.followerCount/1000000)*1000000)+1000000}
            if(data.user.followerCount>=10000000) {goal01.innerHTML=(Math.floor(data.user.followerCount/10000000)*10000000)+10000000}
            if(data.user.followerCount>=100000000) {goal01.innerHTML=(Math.floor(data.user.followerCount/100000000)*100000000)+100000000}
            channel_goal.innerHTML=goal01.innerHTML-data.user.followerCount
        })
    }
    function instagrammain(chanid) {
        fetch('https://api.subscriberwars.space/instagram/'+chanid)
        .then(res=>res.json())
        .then(data=>{
            channel_image.src=data.business_discovery.profile_picture_url
            channel_banner.src=data.business_discovery.profile_picture_url
        })
    }

    instagrammain(channel)
    setInterval(() => {
        instagram(channel)
    }, 6000);


</script>
