<!DOCTYPE html>
<head>
    <title id="tab_header">Spotify Artist</title>
    <meta name="description" content="Live Spotify Stats">
    <link rel="stylesheet" href="https://subscriberwars.space/css/odometer.css">
    <link rel="stylesheet" href="https://subscriberwars.space/css/main.css">
    <script src="https://subscriberwars.space/js/odometer.js"></script>
    <script src="https://code.highcharts.com/highcharts.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
</head>

<body>
    <div id="count-block">
        <img id="logo" style="top: 0px;" src="https://subscriberwars.space/images/sw.png" alt="">
        <h1 id="title">Loading...</h1>
        <div id='followercount' class="odometer odometer-auto-theme" style="font-size: 120pt; font-weight: 500; text-align: center; margin: 0px auto; margin-top: 10px; margin-bottom: 10px; position: relative; width: 1260px;">0</div>
        <h2>Followers</h2>
    </div>
    <div id="mini-counts">
        <div id="like-box">
            <div id='videocount' class="odometer odometer-auto-theme" style="font-size: 30pt; font-weight: 500; text-align: center; margin: 0px auto; margin-top: 10px; margin-bottom: 10px; position: relative; width: 620px;">0</div>
            <h2>Popularity</h2>
        </div>
        <div id="comment-box">
            <a id="profilelink" style="text-decoration: none; top: -30px; position: relative;" target="_blank">
                <div style="text-align: center; width: 620px; font-size: 30px; height: 120px;">
                    <p id="profile" style="top: 35%; position:relative;"></p>
                </div>
            </a>
        </div>
    </div>
    <div id="graph-block">
        <div id="graph" style="width: 1260px; height: 400px;"></div>
        <p id="graphstat" style="visibility: hidden;"></p>
    </div>
</body>

<script>
var channel = window.location.href.split('?u=')[1] || '';

function load(chanid) {
    fetch('https://api.subscriberwars.space/spotify/artist/'+chanid+'').then(res => res.json()).then(data => {
        tab_header.innerHTML = data.name +"'s Live Spotify Stats"
        title.innerHTML = data.name
        followercount.innerHTML= data.followers.total
        videocount.innerHTML= data.popularity
        graphstat.innerHTML = data.followers.total
        logo.src = data.images[0].url
        profilelink.href=data.external_urls.spotify
        profile.innerHTML="Visit "+data.name+"'s Profile"
    });
}

function update(chanid) {
    fetch('https://api.subscriberwars.space/spotify/artist/'+chanid+'').then(res => res.json()).then(data => {
        followercount.innerHTML= data.followers.total
        videocount.innerHTML= data.popularity
        graphstat.innerHTML = data.followers.total
        var yep=(graphstat.innerHTML)
        console.log(yep)
        var injection=yep
        if(graph.series[0].points.length>=180)graph.series[0].data[0].remove();
        graph.series[0].addPoint([Date.now(),parseFloat(injection)])
    });
}

// Intervals
setInterval(() => {
    update(channel);
}, 10000);

load(channel)

</script>

<script>//graph styling
    var graph = new Highcharts.chart({
chart: {
renderTo: 'graph',
type: 'spline',
zoomType: 'x',
backgroundColor: 'transparent',
plotBorderColor: 'transparent'
},
title: {
text: ''
},
xAxis: {
type: 'datetime',
tickPixelInterval: 100,
gridLineColor: '#transparent',
labels: {
    style: {
        color: 'white'
    }
},
minorGridLineColor: '#transparent',
tickColor: 'white',
title: {
    style: {
        color: '#transparent'
    }
}
},
yAxis: {
title: {
  text: ''
},
gridLineColor: '#transparent',
labels: {
    style: {
        color: 'white'
    }
},
lineColor: 'white',
minorGridLineColor: 'transparent',
tickColor: 'white'
},
credits: {
enabled: false,
text: "Subscriberwars.space"
},
series: [{
showInLegend: false,
name: 'Followers',
marker: { enabled: false },
color: '#1DB954',
lineColor: '#1DB954'
}]
});
</script>
