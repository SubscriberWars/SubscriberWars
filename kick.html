<!DOCTYPE html>
<head>
    <title>Live Kick Follower Count</title>
    <meta name="description" content="Live Kick Stats">
    <link rel="stylesheet" href="/css/odometer.css">
    <link rel="stylesheet" href="/css/main.css">
    <script src="/js/odometer.js"></script>
    <script src="https://code.highcharts.com/highcharts.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
    <div style="width: 100%; background-image: linear-gradient(to right, #00e701, #01aa01); height: 80px;">
        <h1 style="text-align: center; color: #fff; top: 8px; position: relative;">Kick Live User Statistics</h1>
    </div>
    <div id="count-block">
        <img id="logo" src="/images/kick.svg" alt="">
        <h1 id="title">Loading...</h1>
        <div id='followercount' class="odometer odometer-auto-theme" style="font-size: 120pt; font-weight: 500; text-align: center; margin: 0px auto; margin-top: 10px; margin-bottom: 10px; position: relative; width: 1260px;">0</div>
        <h2>Followers</h2>
    </div>
    <div id="mini-counts">
        <div id="api-box" style="width: 1260px;">
            <div id='goalcount' class="odometer odometer-auto-theme" style="font-size: 30pt; font-weight: 500; text-align: center; margin: 0px auto; margin-top: 10px; margin-bottom: 10px; position: relative; width: 1260px;">0</div>
            <h2>Goal</h2>
        </div>
    </div>
    <div id="graph-block">
        <div id="graph" style="width: 1260px; height: 400px;"></div>
        <p id="graphstat" style="visibility: hidden;"></p>
        <p id="goal01" style="visibility: hidden;"></p>
    </div>
</body>

<script>
var channel = window.location.href.split('?u=')[1] || '';

function update(chanid) {
    fetch('https://kick.com/api/v1/channels/'+chanid+'').then(res => res.json()).then(data => {
        title.innerHTML = data.user.username
        followercount.innerHTML= data.followersCount
        graphstat.innerHTML = data.followersCount
        logo.src = data.user.profile_pic
        var yep=(graphstat.innerHTML)
        console.log(yep)
        var injection=yep
        if(graph.series[0].points.length>=720)graph.series[0].data[0].remove();
        graph.series[0].addPoint([Date.now(),parseFloat(injection)])
        if(data.followersCount>=0) {goal01.innerHTML=10}
        if(data.followersCount>=10) {goal01.innerHTML=100}
        if(data.followersCount>=100) {goal01.innerHTML=1000}
        if(data.followersCount>=1000) {goal01.innerHTML=(Math.floor(data.followersCount/1000)*1000)+1000}
        if(data.followersCount>=10000) {goal01.innerHTML=(Math.floor(data.followersCount/10000)*10000)+10000}
        if(data.followersCount>=100000) {goal01.innerHTML=(Math.floor(data.followersCount/100000)*100000)+100000}
        if(data.followersCount>=1000000) {goal01.innerHTML=(Math.floor(data.followersCount/1000000)*1000000)+1000000}
        if(data.followersCount>=10000000) {goal01.innerHTML=(Math.floor(data.followersCount/10000000)*10000000)+10000000}
        if(data.followersCount>=100000000) {goal01.innerHTML=(Math.floor(data.followersCount/100000000)*100000000)+100000000}
        goalcount.innerHTML=goal01.innerHTML-data.followersCount
    });
}

// Intervals
setInterval(() => {
    update(channel);
}, 5000);

update(channel)

</script>

<script>//graph styling
    var graph = new Highcharts.chart({
chart: {
renderTo: 'graph',
type: 'spline',
zoomType: 'x',
backgroundColor: 'transparent',
plotBorderColor: 'transparent'
},
title: {
text: ''
},
xAxis: {
type: 'datetime',
tickPixelInterval: 100,
gridLineColor: '#transparent',
labels: {
    style: {
        color: 'white'
    }
},
minorGridLineColor: '#transparent',
tickColor: 'white',
title: {
    style: {
        color: '#transparent'
    }
}
},
yAxis: {
title: {
  text: ''
},
gridLineColor: '#transparent',
labels: {
    style: {
        color: 'white'
    }
},
lineColor: 'white',
minorGridLineColor: 'transparent',
tickColor: 'white'
},
credits: {
enabled: true,
text: "Subscriberwars.space"
},
series: [{
showInLegend: false,
name: 'Followers',
marker: { enabled: false },
lineColor: '#00e701',
color: '#00e701'
}]
});
</script>
