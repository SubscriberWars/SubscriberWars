<head>
    <link href="https://fonts.googleapis.com/css?family=Roboto:100,200,300,400,500,600,700,800" rel="stylesheet" type="text/css">
    <script src="https://kit.fontawesome.com/93168af8d4.js" crossorigin="anonymous"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <title>Minecraft Java Search</title>
</head>
<div class="container">
    <div class="head">
        <div class="head_text">Minecraft Java Server Search</div>
    </div>
    <form>
        <div style="display: flex; width: 80%; margin: auto;">
            <input class="form-control mr-sm-2" id="search" placeholder="Server IP">
            <button type="submit" class="searchbtn" value="Search"><i class="fa fa-fw fa-search" style="width: 100%;"></i></button>
        </div>
    </form>
    <br>
    <div class="row">
        <div id="chan1" class="chan-card">
            <a href="" id="link1">
                <img src="" id="img1" class="pfp">
                <div id="nam1" class="chan-name"></div>
            </a>
        </div>
    </div>
</div>
</body>
</html>

<script>
$(document).ready(function(){

$('form').submit(function(event){
event.preventDefault()

var search = $("#search").val()

channelSearch(search)
})

function channelSearch(search) {
fetch("https://api.subscriberwars.space/minecraft/java/" + search).then(res => res.json()).then(data => {
console.log(data)

img1.src = data.logo
nam1.innerHTML = data.name
link1.href = "/minecraft/java?u="+data.name
})
}
})
</script>
<style>
    body {
    background-color: #222222;
    font-family: roboto;
    width: 100%;
    color: #fff;
    margin: 0;
}
    .head {
        width: 100%;
        height: 60px;
        background-image: linear-gradient(to right, #33ff00, #1d8702);
        overflow: hidden;
        border-bottom: 1px solid #000;
        margin-bottom: 20px;
    }
    .head_text {
        text-align: center;
        vertical-align: middle;
        font-weight: 500;
        font-size: 3rem;
    }

    a {
        width: 80%;
    }

::placeholder {
    color: #fff;
    opacity: 5;
    background: #333;
}

:-ms-input-placeholder {
    color: #FFFFFF;
    background: #333
    ;
  }

  ::-ms-input-placeholder {
    color: #FFFFFF;
    background: #333
    ;
  }

#search {
    width: 100%;
    background-color: #333;
    height: 50px;
    color: #fff;
    border: solid #111;
    border-radius: 10px 0px 0px 10px;
    font-size: 30px;
}

.searchbtn {
    color: #FFF;
    height: 50px;
    width: 10%;
    box-sizing: border-box;
    display: inline-block;
    border-radius: 0.25rem;
    border: solid #111;
    background: #111;
    margin-left: -10px;
}

.searchbtn:hover{
    background: #000;
    border: #000;
    transition: 0.5s;
}

.chan-card {
    background: #181818;
    border-radius: 10px;
    height: 120px;
    margin-bottom: 10px;
    width: 80%;
    margin: auto;
    margin-bottom: 10px;
    border: #000 1px solid;
}

.chan-card:hover {
    cursor: pointer;
    text-decoration: none;
    background: #000;
}

a {
    text-decoration: none;
    color: #fff;
    width: 100%;
}

.pfp {
    border-radius: 50%;
    position: relative;
    top: 10px;
    height: 100px;
    width: 100px;
    margin-left: 5px;
}

.chan-name {
    font-size: 20pt;
    font-weight: 900;
    position: relative;
    left: 120px;
    top: -90px
}

.chan-id {
    font-size: 20pt;
    font-weight: 400;
    position: relative;
    left: 120px;
    top: -80px;
}
</style>
