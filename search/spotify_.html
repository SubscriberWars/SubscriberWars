<head>
    <link href="https://fonts.googleapis.com/css?family=Roboto:100,200,300,400,500,600,700,800" rel="stylesheet" type="text/css">
    <script src="https://kit.fontawesome.com/93168af8d4.js" crossorigin="anonymous"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <title>Spotify Search</title>
</head>
<div class="container">
    <div class="head">
        <div class="head_text">Spotify Search</div>
    </div>
    <div style="text-align: center;">
        <div class="dropdown">
            <label for="dropdown" style="font-size: 40px;">What Statistic do you want to lookup?:</label>
            <select id="dropdown">
                <option value="artist">Artist</option>
                <option value="playlist">Playlist</option>
            </select>
        </div>
    </div>
    <form>
        <div style="display: flex; width: 80%; margin: auto;">
            <input class="form-control mr-sm-2" id="search" placeholder="Query">
            <button type="submit" class="searchbtn" value="Search"><i class="fa fa-fw fa-search" style="width: 100%;"></i></button>
        </div>
    </form>
    <br>
    <div class="row">
        <a href="" id="link1">
           <div id="chan1" class="chan-card">
               <img src="" id="img1" class="pfp">
               <div id="nam1" class="chan-name"></div>
               <div id="id1" class="chan-id"></div>
           </div>
        </a>
        <a href="" id="link2">
           <div id="chan2" class="chan-card">
               <img src="" id="img2" class="pfp">
               <div id="nam2" class="chan-name"></div>
               <div id="id2" class="chan-id"></div>
           </div>
        </a>
        <a href="" id="link3">
           <div id="chan3" class="chan-card">
               <img src="" id="img3" class="pfp">
               <div id="nam3" class="chan-name"></div>
               <div id="id3" class="chan-id"></div>
           </div>
        </a>
        <a href="" id="link4">
           <div id="chan4" class="chan-card">
               <img src="" id="img4" class="pfp">
               <div id="nam4" class="chan-name"></div>
               <div id="id4" class="chan-id"></div>
            </div>
        </a>
        <a href="" id="link5">
           <div id="chan5" class="chan-card">
               <img src="" id="img5" class="pfp">
               <div id="nam5" class="chan-name"></div>
               <div id="id5" class="chan-id"></div>
           </div>
        </a>
    </div>
</div>
</body>
</html>

<script>
const dropdown = document.getElementById('dropdown');
$(document).ready(function(){

$('form').submit(function(event){
event.preventDefault()

var search = $("#search").val()

if(dropdown.value=="artist"){artistSearch(search)}
if(dropdown.value=="playlist"){playlistSearch(search)}
})

function artistSearch(search) {
    fetch("https://api.subscriberwars.space/spotify/search/artist/" + search).then(res => res.json()).then(data => {
       console.log(data)

       img1.src = data.artists.items[0].images[0].url
       nam1.innerHTML = data.artists.items[0].name
       id1.innerHTML = data.artists.items[0].id
       link1.href = "/spotify/artist?u="+data.artists.items[0].id

       img2.src = data.artists.items[1].images[0].url
       nam2.innerHTML = data.artists.items[1].name
       id2.innerHTML = data.artists.items[1].id
       link2.href = "/spotify/artist?u="+data.artists.items[1].id

       img3.src = data.artists.items[2].images[0].url
       nam3.innerHTML = data.artists.items[2].name
       id3.innerHTML = data.artists.items[2].id
       link3.href = "/spotify/artist?u="+data.artists.items[2].id

       img4.src = data.artists.items[3].images[0].url
       nam4.innerHTML = data.artists.items[3].name
       id4.innerHTML = data.artists.items[3].id
       link4.href = "/spotify/artist?u="+data.artists.items[3].id

       img5.src = data.artists.items[4].images[0].url
       nam5.innerHTML = data.artists.items[4].name
       id5.innerHTML = data.artists.items[4].id
       link5.href = "/spotify/artist?u="+data.artists.items[4].id
    })
}
function playlistSearch(search) {
    fetch("https://api.subscriberwars.space/spotify/search/playlist/" + search).then(res => res.json()).then(data => {
       console.log(data)

       img1.src = data.playlists.items[0].images[0].url
       nam1.innerHTML = data.playlists.items[0].name
       id1.innerHTML = data.playlists.items[0].id
       link1.href = "/spotify/playlist?u="+data.playlists.items[0].id

       img2.src = data.playlists.items[1].images[0].url
       nam2.innerHTML = data.playlists.items[1].name
       id2.innerHTML = data.playlists.items[1].id
       link2.href = "/spotify/playlist?u="+data.playlists.items[1].id

       img3.src = data.playlists.items[2].images[0].url
       nam3.innerHTML = data.playlists.items[2].name
       id3.innerHTML = data.playlists.items[2].id
       link3.href = "/spotify/playlist?u="+data.playlists.items[2].id

       img4.src = data.playlists.items[3].images[0].url
       nam4.innerHTML = data.playlists.items[3].name
       id4.innerHTML = data.playlists.items[3].id
       link4.href = "/spotify/playlist?u="+data.playlists.items[3].id

       img5.src = data.playlists.items[4].images[0].url
       nam5.innerHTML = data.playlists.items[4].name
       id5.innerHTML = data.playlists.items[4].id
       link5.href = "/spotify/playlist?u="+data.playlists.items[4].id
    })
}
})
</script>

    .head {
        width: 100%;
        height: 60px;
        background-image: linear-gradient(to right, #00ff73, #03571f);
        overflow: hidden;
        border-bottom: 1px solid #000;
        margin-bottom: 20px;
    }
    .head_text {
        text-align: center;
        vertical-align: middle;
        font-weight: 500;
        font-size: 3rem;
    }

::placeholder {
    color: #fff;
    opacity: 5;

}

    color: #FFFFFF;
    background: #333
    ;
  }

  ::-ms-input-placeholder {
    color: #FFFFFF;
    background: #333
    ;
  }

#search {
    width: 100%;
    background-color: #333;
    height: 50px;
    color: #fff;
    border: solid #111;

    color: #FFF;

}
</style>
