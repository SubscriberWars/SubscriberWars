<head>
    <link href="https://fonts.googleapis.com/css?family=Roboto:100,200,300,400,500,600,700,800" rel="stylesheet"
        type="text/css">
    <script src="https://kit.fontawesome.com/93168af8d4.js" crossorigin="anonymous"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <title>Rumble Search</title>
</head>
<div class="container">
    <div class="head">
        <div class="head_text">Rumble Search</div>
    </div>
    <div style="text-align: center;">
        <div class="dropdown">
            <label for="dropdown" style="font-size: 40px;">What Statistic do you want to lookup?:</label>
            <select id="dropdown">
                <option value="channel">Channel</option>
                <option value="video">Video</option>
            </select>
        </div>
    </div>
    <form>
        <div style="display: flex; width: 80%; margin: auto;">
            <input class="form-control mr-sm-2" id="search" placeholder="Query">
            <button type="submit" class="searchbtn" value="Search"><i class="fa fa-fw fa-search"
                    style="width: 100%;"></i></button>
        </div>
    </form>
    <br>
    <div class="row">
        <div id="chan1" class="chan-card">
            <a href="" id="link1">
                <img src="" id="img1" class="pfp">
                <div id="nam1" class="chan-name"></div>
                <div id="id1" class="chan-id"></div>
            </a>
        </div>
        <div id="chan2" class="chan-card">
            <a href="" id="link2">
                <img src="" id="img2" class="pfp">
                <div id="nam2" class="chan-name"></div>
                <div id="id2" class="chan-id"></div>
            </a>
        </div>
        <div id="chan3" class="chan-card">
            <a href="" id="link3">
                <img src="" id="img3" class="pfp">
                <div id="nam3" class="chan-name"></div>
                <div id="id3" class="chan-id"></div>
            </a>
        </div>
        <div id="chan4" class="chan-card">
            <a href="" id="link4">
                <img src="" id="img4" class="pfp">
                <div id="nam4" class="chan-name"></div>
                <div id="id4" class="chan-id"></div>
            </a>
        </div>
        <div id="chan5" class="chan-card">
            <a href="" id="link5">
                <img src="" id="img5" class="pfp">
                <div id="nam5" class="chan-name"></div>
                <div id="id5" class="chan-id"></div>
            </a>
        </div>
    </div>
</div>
</body>

</html>

<script>
    $(document).ready(function () {

        $('form').submit(function (event) {
            event.preventDefault()

            var search = $("#search").val()
            if (dropdown.value == "channel") { channelSearch(search) }
            if (dropdown.value == "video") { videoSearch(search) }

        })

        const dropdown = document.getElementById('dropdown');

        function channelSearch(search) {
            fetch("https://api.subscriberwars.space/search/rumble/channel/" + search).then(res => res.json()).then(data => {
                console.log(data)

                img1.src = data.items[0].pfp
                nam1.innerHTML = data.items[0].title
                id1.innerHTML = data.items[0].id
                link1.href = "/rumble/channel?q=" + data.items[0].id

                img2.src = data.items[1].pfp
                nam2.innerHTML = data.items[1].title
                id2.innerHTML = data.items[1].id
                link2.href = "/rumble/channel?q=" + data.items[1].id

                img3.src = data.items[2].pfp
                nam3.innerHTML = data.items[2].title
                id3.innerHTML = data.items[2].id
                link3.href = "/rumble/channel?q=" + data.items[2].id

                img4.src = data.items[3].pfp
                nam4.innerHTML = data.items[3].title
                id4.innerHTML = data.items[3].id
                link4.href = "/rumble/channel?q=" + data.items[3].id

                img5.src = data.items[4].pfp
                nam5.innerHTML = data.items[4].title
                id5.innerHTML = data.items[4].id
                link5.href = "/rumble/channel?q=" + data.items[4].id
            })
        }

        function videoSearch(search) {
            fetch("https://api.subscriberwars.space/search/rumble/video/" + search).then(res => res.json()).then(data => {
                console.log(data)

                img1.src = data.items[0].pfp
                nam1.innerHTML = data.items[0].title
                id1.innerHTML = data.items[0].id
                link1.href = "/rumble/video?q=" + data.items[0].id

                img2.src = data.items[1].pfp
                nam2.innerHTML = data.items[1].title
                id2.innerHTML = data.items[1].id
                link2.href = "/rumble/video?q=" + data.items[1].id

                img3.src = data.items[2].pfp
                nam3.innerHTML = data.items[2].title
                id3.innerHTML = data.items[2].id
                link3.href = "/rumble/video?q=" + data.items[2].id

                img4.src = data.items[3].pfp
                nam4.innerHTML = data.items[3].title
                id4.innerHTML = data.items[3].id
                link4.href = "/rumble/video?q=" + data.items[3].id

                img5.src = data.items[4].pfp
                nam5.innerHTML = data.items[4].title
                id5.innerHTML = data.items[4].id
                link5.href = "/rumble/video?q=" + data.items[4].id
            })
        }
    })
</script>
<style>
    body {
        background-color: #222222;
        font-family: roboto;
        width: 100%;
        color: #fff;
        margin: 0;
    }

    .head {
        width: 100%;
        height: 60px;
        background-image: linear-gradient(to right, #69b52b, #396118);
        overflow: hidden;
        border-bottom: 1px solid #000;
        margin-bottom: 20px;
    }

    .head_text {
        text-align: center;
        vertical-align: middle;
        font-weight: 500;
        font-size: 3rem;
    }

    ::placeholder {
        color: #fff;
        opacity: 5;
        background: #333;
    }

    :-ms-input-placeholder {
        color: #FFFFFF;
        background: #333;
    }

    ::-ms-input-placeholder {
        color: #FFFFFF;
        background: #333;
    }

    #search {
        width: 100%;
        background-color: #333;
        height: 50px;
        color: #fff;
        border: solid #111;
        border-radius: 10px 0px 0px 10px;
        font-size: 30px;
    }

    .searchbtn {
        color: #FFF;
        height: 50px;
        width: 10%;
        box-sizing: border-box;
        display: inline-block;
        border-radius: 0.25rem;
        border: solid #111;
        background: #111;
        margin-left: -10px;
        font-size: 30px;
    }

    .searchbtn:hover {
        background: #000;
        border: #000;
        transition: 0.5s;
        cursor: pointer;
    }

    .chan-card {
        background: #181818;
        border-radius: 10px;
        height: 120px;
        margin-bottom: 10px;
        width: 80%;
        margin: auto;
        margin-bottom: 10px;
        border: #000 1px solid;
    }

    .chan-card:hover {
        cursor: pointer;
        text-decoration: none;
        background: #000;
    }

    a {
        text-decoration: none;
        color: #fff;
        width: 100%;
    }

    .pfp {
        border-radius: 50%;
        position: relative;
        top: 10px;
        height: 100px;
        width: 100px;
        margin-left: 5px;
    }

    .chan-name {
        font-size: 20pt;
        font-weight: 900;
        position: relative;
        left: 120px;
        top: -90px
    }

    .chan-id {
        font-size: 20pt;
        font-weight: 400;
        position: relative;
        left: 120px;
        top: -80px;
    }

    #dropdown {
        height: 60px;
        font-size: 2rem;
        width: 20%;
        border: 1px solid #000;
        border-radius: 10px;
        background: #0f0f0f;
        text-align: center;
        color: #fff;
        margin-bottom: 10px;
        margin-top: 10px;
        font-weight: 500;
    }
</style>
