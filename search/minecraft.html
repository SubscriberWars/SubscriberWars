<head>
    <link href="https://fonts.googleapis.com/css?family=Roboto:100,200,300,400,500,600,700,800" rel="stylesheet" type="text/css">
    <script src="https://kit.fontawesome.com/93168af8d4.js" crossorigin="anonymous"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <title>Minecraft Search</title>
</head>
<div class="container">
    <div class="head">
        <div class="head_text">Minecraft Search</div>
    </div>
    <div style="text-align: center;">
        <div class="dropdown">
            <label for="dropdown" style="font-size: 40px;">What Statistic do you want to lookup?:</label>
            <select id="dropdown">
                <option value="java">Java Server</option>
                <option value="bedrock">Bedrock Server</option>
            </select>
        </div>
    </div>
    <form>
        <div style="display: flex; width: 80%; margin: auto;">
            <input class="form-control mr-sm-2" id="search" placeholder="Query">
            <button type="submit" class="searchbtn" value="Search"><i class="fa fa-fw fa-search" style="width: 100%;"></i></button>
        </div>
    </form>
    <br>
    <div class="row">
        <a href="" id="link1">
           <div id="chan1" class="chan-card">
               <img src="" id="img1" class="pfp">
               <div id="nam1" class="chan-name"></div>
               <div id="id1" class="chan-id"></div>
           </div>
        </a>
    </div>
</div>
</body>
</html>

<script>
const dropdown = document.getElementById('dropdown');
$(document).ready(function(){

$('form').submit(function(event){
event.preventDefault()

var search = $("#search").val()

if(dropdown.value=="java"){javaSearch(search)}
if(dropdown.value=="bedrock"){bedrockSearch(search)}
})

function javaSearch(search) {
    fetch("https://api.subscriberwars.space/minecraft/java/" + search).then(res => res.json()).then(data => {
        console.log(data)
        img1.src = data.logo
        nam1.innerHTML = data.name
        link1.href = "/minecraft/java?u="+data.name
    })
}
function bedrockSearch(search) {
    fetch("https://api.subscriberwars.space/minecraft/bedrock/" + search).then(res => res.json()).then(data => {
        console.log(data)
        img1.src = data.logo
        nam1.innerHTML = data.name
        link1.href = "/minecraft/bedrock?u="+data.name
    })
}
})
</script>
