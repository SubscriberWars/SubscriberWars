<head>
    <link href="https://fonts.googleapis.com/css?family=Roboto:100,200,300,400,500,600,700,800" rel="stylesheet"
        type="text/css">
    <script src="https://kit.fontawesome.com/93168af8d4.js" crossorigin="anonymous"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <title>Modrinth Search</title>
</head>
<div class="container">
    <div class="head">
        <div class="head_text">Club Search</div>
    </div>
    <div style="text-align: center;">
        <div class="dropdown">
            <label for="dropdown" style="font-size: 40px;">What type of content do you want to search?:</label>
            <select id="dropdown">
                <option value="users">Users</option>
            </select>
        </div>
    </div>
    <form>
        <div style="display: flex; width: 80%; margin: auto;">
            <input class="form-control mr-sm-2" id="search" placeholder="Query">
            <button type="submit" class="searchbtn" value="Search"><i class="fa fa-fw fa-search"
                    style="width: 100%;"></i></button>
        </div>
    </form>
    <br>
    <div class="row">
        <div id="chan1" class="chan-card">
            <a id="link1">
                <img src="" id="img1" class="pfp">
                <div id="nam1" class="chan-name"></div>
                <div id="id1" class="chan-id"></div>
            </a>
        </div>
        <div id="chan2" class="chan-card">
            <a id="link2">
                <img src="" id="img2" class="pfp">
                <div id="nam2" class="chan-name"></div>
                <div id="id2" class="chan-id"></div>
            </a>
        </div>
        <div id="chan3" class="chan-card">
            <a id="link3">
                <img src="" id="img3" class="pfp">
                <div id="nam3" class="chan-name"></div>
                <div id="id3" class="chan-id"></div>
            </a>
        </div>
        <div id="chan4" class="chan-card">
            <a id="link4">
                <img src="" id="img4" class="pfp">
                <div id="nam4" class="chan-name"></div>
                <div id="id4" class="chan-id"></div>
            </a>
        </div>
        <div id="chan5" class="chan-card">
            <a id="link5">
                <img src="" id="img5" class="pfp">
                <div id="nam5" class="chan-name"></div>
                <div id="id5" class="chan-id"></div>
            </a>
        </div>
    </div>
</div>
</body>

</html>

<script>
    $(document).ready(function () {
        $('form').submit(function (event) {
            event.preventDefault();

            var search = $("#search").val();
            var dropdown = document.getElementById('dropdown');
            var apiURL = "";

            switch (dropdown.value) {
                case "users":
                    apiURL = "https://api.subscriberwars.space/search/club/";
                default:
                    apiURL = "https://api.subscriberwars.space/search/club/";
            }

            generalSearch(search, apiURL);
        });

        function generalSearch(search, apiURL) {
            fetch(apiURL + search).then(res => res.json()).then(data => {
                for (let i = 1; i <= 5; i++) {
                    document.getElementById(`img${i}`).src = "https://media.club.com/users/" + data.users[i - 1].id + "/profile-picture";
                    document.getElementById(`nam${i}`).innerHTML = data.users[i - 1].name;
                    document.getElementById(`id${i}`).innerHTML = "@" + data.users[i - 1].username;
                    document.getElementById(`link${i}`).href = "/club/users?q=" + data.users[i - 1].id;
                }
            });
        }
    });
</script>

        color: #fff;

    }

        color: #FFFFFF;

    }

        color: #FFFFFF;

    }

    #search {
        width: 100%;

        color: #fff;
