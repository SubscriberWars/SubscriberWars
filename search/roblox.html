<head>
    <link href="https://fonts.googleapis.com/css?family=Roboto:100,200,300,400,500,600,700,800" rel="stylesheet"
        type="text/css">
    <script src="https://kit.fontawesome.com/93168af8d4.js" crossorigin="anonymous"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <title>roblox Search</title>
</head>
<div class="container">
    <div class="head">
        <div class="head_text">Roblox Search</div>
    </div>
    <div style="text-align: center;">
        <div class="dropdown">
            <label for="dropdown" style="font-size: 40px;">What type of content do you want to search?:</label>
            <select id="dropdown">
                <option value="groups">Communities</option>
                <option value="users">Users(Unstable)</option>
            </select>
        </div>
    </div>
    <form>
        <div style="display: flex; width: 80%; margin: auto;">
            <input class="form-control mr-sm-2" id="search" placeholder="Query">
            <button type="submit" class="searchbtn" value="Search"><i class="fa fa-fw fa-search"
                    style="width: 100%;"></i></button>
        </div>
    </form>
    <br>
    <div class="row">
        <div id="chan1" class="chan-card">
            <a id="link1">
                <img src="" id="img1" class="pfp">
                <div id="nam1" class="chan-name"></div>
                <div id="id1" class="chan-id"></div>
            </a>
        </div>
        <div id="chan2" class="chan-card">
            <a id="link2">
                <img src="" id="img2" class="pfp">
                <div id="nam2" class="chan-name"></div>
                <div id="id2" class="chan-id"></div>
            </a>
        </div>
        <div id="chan3" class="chan-card">
            <a id="link3">
                <img src="" id="img3" class="pfp">
                <div id="nam3" class="chan-name"></div>
                <div id="id3" class="chan-id"></div>
            </a>
        </div>
        <div id="chan4" class="chan-card">
            <a id="link4">
                <img src="" id="img4" class="pfp">
                <div id="nam4" class="chan-name"></div>
                <div id="id4" class="chan-id"></div>
            </a>
        </div>
        <div id="chan5" class="chan-card">
            <a id="link5">
                <img src="" id="img5" class="pfp">
                <div id="nam5" class="chan-name"></div>
                <div id="id5" class="chan-id"></div>
            </a>
        </div>
    </div>
</div>
</body>

</html>

<script>
$(document).ready(function () {
    $('form').submit(function (event) {
        event.preventDefault();

        var search = $("#search").val();
        var dropdown = document.getElementById('dropdown');
        var apiURL = "";
        var type = "";

        switch (dropdown.value) {
            case "users":
                apiURL = "https://api.subscriberwars.space/search/roblox/user/";
                type = "user";
                break;
            case "groups":
                apiURL = "https://api.subscriberwars.space/search/roblox/group/";
                type = "group";
                break;
        }

        generalSearch(search, apiURL, type);
    });

    function generalSearch(search, apiURL, type) {
        fetch(apiURL + encodeURIComponent(search))
            .then(res => {
                if (!res.ok) {
                    throw new Error("HTTP error " + res.status);
                }
                return res.json();
            })
            .then(data => {
                console.log("API response:", data);

                if (!data.item || !Array.isArray(data.item)) {
                    console.error("No data.items array found");
                    return;
                }

                // Only loop over the number of items we actually have (max 5)
                const count = Math.min(5, data.item.length);

                for (let i = 0; i < count; i++) {
                    const item = data.item[i];

                    const imgEl  = document.getElementById(`img${i + 1}`);
                    const namEl  = document.getElementById(`nam${i + 1}`);
                    const idEl   = document.getElementById(`id${i + 1}`);
                    const linkEl = document.getElementById(`link${i + 1}`);

                    // Skip if any element is missing
                    if (!imgEl || !namEl || !idEl || !linkEl) {
                        console.warn("Missing element for index", i + 1);
                        continue;
                    }

                    imgEl.src = item.pfp;
                    namEl.innerHTML = item.title;
                    idEl.innerHTML = item.id;
                    linkEl.href = `/roblox/${type}?q=${item.id}`;
                }
            })
            .catch(err => {
                console.error("Fetch error:", err);
            });
    }
});

</script>
