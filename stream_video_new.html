<head>
    <script src="/js/odometer.js"></script>
    <link rel=stylesheet href="/css/odometer.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons"rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/93168af8d4.js" crossorigin="anonymous"></script>  
</head>

<style>
    *{
      font-family: 'Roboto';
      font-weight: 500;
      margin: 0;
    }
    body {
      height: 400px;
      width: 400px;
      border: 1px dashed red;
      background: #000;
      padding: 5px;
      text-align: center;
    }
    h1 {
      height: 80px;
      width: 400px;
      font-size: 30px;
      color: #fff;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    #thumbnail {
      width: 150px;
      height: 100px;
      border: 1px #000 solid;
      border-radius: 10px;
    }
    #views_ {
      font-size: 50px;
      color: #fff;
      font-weight: 500;
      text-align: center;
      width: 100%;
    }
</style>

<body>
  <img id=thumbnail>
  <h1 id=vidtitle>Loading Latest Video...</h1>
  <div id="views_">
    <i class="fa fa-sharp fa-eye"></i><div id="viewsOdometer" class= "odometer">0</div>
    <br>
    <i class="fa fa-sharp fa-thumbs-up" style="color: #00ff0d;"></i><div id="likesOdometer" class="odometer" style="color: #00ff0d; margin-top: 10px;">0</div>
    <br>
    <i class="fa fa-sharp fa-comment" style="color: #00c8ff;"></i><div id="commentsOdometer" class="odometer" style="color: #00c8ff; margin-top: 10px;">0</div>
  </div>
</body>

<script>
  var newestvidID = ''
var channel = window.location.href.split('?')[1] || '';
var capi = 0;
var lapi = 0;
var likes = 0;
var views = 0;
var viewsC = 0;
var lol = 0;

function checkForNew(chanid) { // replace UC with UU
    fetch('https://api.subscriberwars.space/youtube/playlist/'+chanid+'').then(res => res.json()).then(data => {
        newestvidID = data.items[0].contentDetails.videoId
    });
}


function updateStats(id) {
    fetch('https://youtube.googleapis.com/youtube/v3/videos?part=snippet,statistics&id='+id+'&key=AIzaSyAUfG3BP2Zx4XSPSaigqUFzkBqa8CbMx00').then(res => res.json()).then(data => {
        capi = data.items[0].statistics.viewCount
        lapi = data.items[0].statistics.likeCount

    var ratio = parseFloat(capi) / parseFloat(lapi)
                console.log(ratio)
                    views = (Math.floor(parseFloat(views) + ratio * (parseFloat(lapi) - likes)))
                        if (viewsC == capi) { } else {
                            views = (Math.floor(parseFloat(capi)))
                        }
                viewsC = (Math.floor(capi))
                likes = (Math.floor(lapi))
                lol = views
        likesOdometer.innerHTML = data.items[0].statistics.likeCount,
        viewsOdometer.innerHTML = lol,
        vidtitle.innerHTML = data.items[0].snippet.title,
        thumbnail.src = data.items[0].snippet.thumbnails.default.url
        commentsOdometer.innerHTML = data.items[0].statistics.commentCount
    });
    
}

setInterval(() => {
    updateStats(newestvidID);
}, 2000);

checkForNew(channel)
updateStats(newestvidID)

setInterval(() => {
    checkForNew(channel);
}, 10000);
</script>
