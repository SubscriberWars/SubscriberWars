.grid_container {
    display: grid;
    grid-template-columns: repeat(auto-fit,minmax(400px,1fr));

    margin: auto;
    grid-gap: 20px;
}
.grid_item {
    background: #0f0f0f;
    border: 1px solid #000;

    height: 300px;
    text-align: center;
    min-width: 400px;
}
.grid_item:hover{

    border: 1px solid #fff;
    cursor: pointer;
}
.grid_button{

    height: 100%;
}
#footer {

    height: 200px;
    margin-top: 20px;
}
.footer_bar {
    width: 100%;
    height: 10px;
    background-color: #ff0000;

.footer_items {

.social_icons {

}
::-webkit-scrollbar {

}

::-webkit-scrollbar-thumb {
