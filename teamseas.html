<!DOCTYPE html>
<head>
    <title>#TeamSeas</title>
    <meta name="description" content="Live #TeamSeas Statistics">
    <link rel="stylesheet" href="odometer.css">
    <link rel="stylesheet" href="teamseas.css">
    <script src="odometer.js"></script>
    <script type="text/javascript" src="jquery-3.1.1.min.js"></script>
    <script src="https://code.highcharts.com/highcharts.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
    <div id="count-block">
        <img id="logo" src="https://teamseas.org/assets/images/teamseas-logo.png" alt="#TeamSeas">
        <h1><a style="color: #fff" href="https://teamseas.org" target="_blank">#TeamSeas</a></h1>
        <div id='total' class="odometer odometer-auto-theme" style="font-size: 120pt; font-weight: 500; text-align: center; margin: 0px auto; margin-top: 10px; margin-bottom: 10px; position: relative; width: 1260px;">0</div>
        <h2>Pounds/lbs</h2>
    </div>
    <div id="mini-counts">
        <div id="stat-box">
            <div id='latlbs' class="odometer odometer-auto-theme" style="font-size: 40pt; font-weight: 500; text-align: center; margin: 0px auto; margin-top: 10px; margin-bottom: 10px; position: relative; width: 400px;">0</div>
            <h2>Latest Donation</h2>
            <div id='latnam' style="font-size: 40pt; font-weight: 500; text-align: center; margin: 0px auto; margin-top: 20px; margin-bottom: 10px; position: relative; width: 400px; text-overflow: ellipsis; white-space: nowrap;">Loading...</div>
            <h2>Latest Donator</h2>
        </div>
        <div id="goal-box">
            <div id='goal' class="odometer odometer-auto-theme" style="font-size: 40pt; font-weight: 500; text-align: center; margin: 0px auto; margin-top: 10px; margin-bottom: 10px; position: relative; width: 400px;">0</div>
            <h2>30M Goal</h2>
        </div>
        <div id="stat-box">
            <div id='toplbs' class="odometer odometer-auto-theme" style="font-size: 40pt; font-weight: 500; text-align: center; margin: 0px auto; margin-top: 10px; margin-bottom: 10px; position: relative; width: 400px;">0</div>
            <h2>Highest Donation</h2>
        <div id='topnam' style="font-size: 40pt; font-weight: 500; text-align: center; margin: 0px auto; margin-top: 20px; margin-bottom: 10px; position: relative; width: 400px; text-overflow: ellipsis; white-space: nowrap;">Loading...</div>
            <h2>Highest Donator</h2>
        </div>
    </div>
</body>

<script>//Data Interval
    var url='https://api.subscriberwars.space/teamseas'

    setInterval(() => {
        $.getJSON(url,function(data){
            total.innerHTML=data.total
            goal.innerHTML=30000000-data.total
            toplbs.innerHTML=data.top_count
            topnam.innerHTML=data.top_name
            latlbs.innerHTML=data.latest_count
            latnam.innerHTML=data.latest_name
        })    
    }, 2000);
</script>
