 async function getStats() {
        let request = await fetch('https://mixerno.space/api/youtube-channel-counter/user/'+ids[0], { mode: "cors" })
        let data = await request.json().catch(() => {})
        if (!data) return;
        count.innerHTML = data.counts[0].count
        title.innerHTML = data.user[0].count
        updateimage(data.user[1].count);
   }
