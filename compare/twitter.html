<!DOCTYPE html>
<head>
    <title>Twitch Vs Trovo Test</title>
    <meta name="description" content="Live compare test">
    <link rel="stylesheet" href="odometer.css">
    <link rel="stylesheet" href="compare.css">
    <script src="odometer.js"></script>
    <script src="https://code.highcharts.com/highcharts.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
    <div id="main-block">
        <div id="count-block1">
            <img class="logo" id="logo1" src="https://subscriberwars.space/logo/twitter.svg" alt="">
            <h1 id="title1" class="title">Loading...</h1>
            <div id="count1" class="odometer odometer-auto-theme" style="font-size: 120pt; font-weight: 500; text-align: center; margin: 0px auto; margin-top: 10px; margin-bottom: 10px; position: relative; width: 890px;">0</div>
            <h2>Followers</h2>
        </div>
        <div id="count-block2">
            <img class="logo" id="logo2" src="https://subscriberwars.space/logo/twitter.svg" alt="">
            <h1 id="title2" class="title">Loading...</h1>
            <div id="count2" class="odometer odometer-auto-theme" style="font-size: 120pt; font-weight: 500; text-align: center; margin: 0px auto; margin-top: 10px; margin-bottom: 10px; position: relative; width: 890px;">0</div>
            <h2>Followers</h2>

        </div>
    </div>
    <div id="mini-counts">
        <div id="gap-box">
            <div id='gapcount' class="odometer odometer-auto-theme" style="font-size: 30pt; font-weight: 500; text-align: center; margin: 0px auto; margin-top: 10px; margin-bottom: 10px; position: relative; width: 620px;">0</div>
            <h2>Gap</h2>
        </div>
    </div>
</body>

<script>
    var user1 = window.location.href.split('?u1=')[1] || '';
    var user2 = window.location.href.split('?u2=')[1] || '';
    var gap01= 0;
    var gap02= 0;
    
    function u1(uid1) {
        fetch('https://api.subscriberwars.space/twitter/'+uid1+'').then(res => res.json()).then(data => {
            title1.innerHTML = data.displayName
            count1.innerHTML= data.followers
            logo1.src = data.pfp.replace("normal.jpg","400x400.jpg")
            gap01=parseFloat(data.followers)
        });
    }

    function u2(uid2) {
        fetch('https://api.subscriberwars.space/twitter/'+uid2+'').then(res => res.json()).then(data => {
            title2.innerHTML = data.displayName
            count2.innerHTML= data.followers
            logo2.src = data.pfp.replace("normal.jpg","400x400.jpg")
            gap02=parseFloat(data.followers)
            gapcount.innerHTML=gap01-gap02
        });
    }
    
    // Intervals
    setInterval(() => {
        u1(user1);
        u2(user2);
    }, 5000);
    
    u1(user1)
    u2(user2)
    
    </script>
