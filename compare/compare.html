<!DOCTYPE html>
<head>
    <title>Twitch Vs Trovo Test</title>
    <meta name="description" content="Live compare test">
    <link rel="stylesheet" href="odometer.css">
    <link rel="stylesheet" href="compare.css">
    <script src="odometer.js"></script>
    <script src="https://code.highcharts.com/highcharts.js"></script>

<body>
    <div id="main-block">
        <div id="count-block1">
            <img class="logo" src="https://subscriberwars.space/logo/twitch.svg" alt="">
            <h1 id="twitchtitle" class="title">Loading...</h1>
            <div id="twitchcount" class="odometer odometer-auto-theme" style="font-size: 120pt; font-weight: 500; text-align: center; margin: 0px auto; margin-top: 10px; margin-bottom: 10px; position: relative; width: 890px; top: -100px;">0</div>
            <h2 style="top:-100px">Followers</h2>
            <div id="twitchgraph" style="width: 890px; height: 300px; top: -100px; position: relative;"></div>
            <p id="twitchstat" style="visibility: hidden;"></p>
        </div>
        <div id="count-block2">
            <img class="logo" src="https://subscriberwars.space/logo/trovo.png" alt="">
            <h1 id="trovotitle" class="title">Loading...</h1>
            <div id="trovocount" class="odometer odometer-auto-theme" style="font-size: 120pt; font-weight: 500; text-align: center; margin: 0px auto; margin-top: 10px; margin-bottom: 10px; position: relative; width: 890px; top: -100px;">0</div>
            <h2 style="top:-100px">Followers</h2>
            <div id="trovograph" style="width: 890px; height: 300px; top: -100px; position: relative;"></div>
            <p id="trovostat" style="visibility: hidden;"></p>
        </div>
    </div>
    <div id="mini-counts">
        <div id="gap-box">
            <div id='gapcount' class="odometer odometer-auto-theme" style="font-size: 30pt; font-weight: 500; text-align: center; margin: 0px auto; margin-top: 10px; margin-bottom: 10px; position: relative; width: 620px;">0</div>
            <h2>Gap</h2>
        </div>
    </div>
</body>

<script>
function updateStats(id) {
    fetch('https://api.twitch.tv/helix/users/follows?to_id=750736092&first=1', {
        headers: {
            'Authorization': 'Bearer sfxckiabuotm1v4f0vf3luqk0uguzn',
            'Client-Id': 'lkcbcha1jh4q70evrikggligbkbhpx',
        }
    }
    ).then(res => res.json()).then(data => {
        twitchtitle.innerHTML = data.data[0].to_name
        twitchcount.innerHTML = data.total
        gap01=parseFloat(data.total)
        twitchstat.innerHTML = data.total
        var twitchaccept=(twitchstat.innerHTML)
        console.log(twitchaccept)
        var twitchinjection=twitchaccept
        if(twitchgraph.series[0].points.length>=720)twitchgraph.series[0].data[0].remove();
        twitchgraph.series[0].addPoint([Date.now(),parseFloat(twitchinjection)])
    });
}


function trovoupdate() {
    fetch('https://api.subscriberwars.space/trovo/channel/106210667')
    .then(res => res.json()).then(data => {
        trovotitle.innerHTML=data.username
        trovocount.innerHTML = data.followers
        gap02=parseFloat(data.followers)
        gapcount.innerHTML=gap01-gap02
        trovostat.innerHTML = data.followers
        var trovoaccept=(trovostat.innerHTML)
        console.log(trovoaccept)
        var trovoinjection=trovoaccept
        if(trovograph.series[0].points.length>=720)trovograph.series[0].data[0].remove();
        trovograph.series[0].addPoint([Date.now(),parseFloat(trovoinjection)])
    });
}

var gap01=0
var gap02=0

updateStats();
trovoupdate();

// Intervals
setInterval(() => {
    updateStats();
    trovoupdate();
}, 5000);


</script>
