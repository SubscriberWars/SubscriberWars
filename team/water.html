<head>
    <link href="https://fonts.googleapis.com/css?family=Roboto:100,200,300,400,500,600,700,800" rel="stylesheet"
        type="text/css">
    <link rel="stylesheet" href="/css/odometer.css">
    <link rel="stylesheet" href="/css/font.css">
    <script src="https://kit.fontawesome.com/93168af8d4.js" crossorigin="anonymous"></script>
    <script src="/js/odometer.js"></script>
    <title>#TeamWater</title>
</head>

<body>
    <div class="head">
        <div class="head_text">#TeamWater</div>
    </div>
    <div class="main_box">
        <img id="channel_banner" src="/images/banner_teamwater.png">
        <img id="channel_image"
            src="https://files.jotform.com/jufs/Matthew_Fitzgerald/form_files/_TeamWater_logo_border.67e748b1bd6815.03849867.png?md5=lMw1f8_xwYKtBdgQzx58Ww&expires=1752245992">
        <div id="channel_title_container">
            <a id="channel_title" href="https://teamwater.org" style="text-decoration: none; color: #fff;" title=""
                target="_blank">#TeamWater</a>
        </div>
        <div id="channel_subscribers" class="odometer"></div>
        <div id="subscribers"><i class="fa-solid fa-dollar-sign"></i> US Dollars</div>
        <div class="bottom_data">
            <div class="bottom_counts">
                <div class="odometer bottom_odometer" id="latest_donation"></div>
                <div class="bottom_text"><i class="fa fa-sharp fa-heart"></i> Latest Donation</div>
                <div class="bottom_odometer" id="latest_donator"></div>
                <div class="bottom_text"><i class="fa fa-sharp fa-user"></i> Latest Donator</div>
            </div>
            <div class="bottom_counts">
                <div class="odometer bottom_odometer" id="top_donation"></div>
                <div class="bottom_text"><i class="fa fa-sharp fa-heart"></i> Top Donation</div>
                <div class="bottom_odometer" id="top_donator"></div>
                <div class="bottom_text"><i class="fa fa-sharp fa-user"></i> Top Donator</div>
            </div>
        </div>
        <div class="button_box">
            <button class="bott_button">
                <a href="https://teamwater.org" target="_blank" style="margin: auto; width: 100%; text-decoration: none; color: #fff;">
                    <i class="fa-sharp fa-solid fa-dollar-sign"></i> Donate Now!
                </a>
            </button>
        </div>
    </div>
</body>

<style>
    body {
        background: #181818;
        color: #fff;
        margin: 0;
        font-family: roboto;
    }

    .head {
        width: 100%;
        height: 60px;
        background-image: linear-gradient(to right, #0070f8, #052479);
        overflow: hidden;
        border-bottom: 1px solid #000;
    }

    .head_text {
        text-align: center;
        vertical-align: middle;
        font-weight: 500;
        font-size: 3rem;
    }

    .main_box {
        width: 1260px;
        height: 1010px;
        background: #0f0f0f;
        margin: auto;
        padding: 10px;
        margin-top: 20px;
        border: 1px solid #000;
        border-radius: 10px;
        text-align: center;
    }

    #channel_banner {
        width: 100%;
        border: 1px solid #000;
        border-radius: 10px;
        height: 208px;
    }

    #channel_image {
        width: 200px;
        height: 200px;
        border: 0px solid #000;
        border-radius: 10px;
        top: -100px;
        position: relative;
    }

    #channel_title_container {
        position: relative;
        top: -100px;
        font-size: 4rem;
    }

    #channel_subscribers {
        position: relative;
        top: -90px;
        font-size: 11rem;
        font-weight: 600;
        font-family: Montserrat;
        font-feature-settings: "tnum";
    }

    #subscribers {
        position: relative;
        top: -80px;
        font-size: 2rem;
    }

    .bottom_data {
        width: 100%;
        height: 150px;
        position: relative;
        display: flex;
    }

    .bottom_counts {
        margin: 5px;
        padding: 10px;
        width: 600px;
        height: 260px;
        background: #000;
        border-radius: 10px;
    }

    .bottom_odometer {
        font-weight: 500;
        font-size: 3rem;
        font-family: Montserrat;
        font-feature-settings: "tnum";
    }

    .bottom_text {
        font-size: 2rem;
        margin-top: 20px;
    }

    ::-webkit-scrollbar {
        width: 5px;
    }

    ::-webkit-scrollbar-track {
        border-radius: 2.5px;
    }

    ::-webkit-scrollbar-thumb {
        background: #0070f8;
        border-radius: 2.5px;
    }

    ::-webkit-scrollbar-thumb:hover {
        background: #052479;
        border-radius: 2.5px;
    }

    .button_box {
        width: 1260px;
        margin: auto;
        display: flex;
        position: relative;
        top: 170px;
    }

    .bott_button {
        width: 620px;
        margin: auto;
        background: #0f0f0f;
        color: #fff;
        height: 100px;
        font-size: 30px;
        border-radius: 10px;
        border: 1px solid #000;
    }

    .bott_button:hover {
        cursor: pointer;
        background: #000;
        border: 1px solid #fff;
    }
</style>


<script>

    function stats() {
        fetch("https://subscriberwars.replit.app/teamwater").then(res => res.json()).then(data => {
            channel_subscribers.innerHTML = data.total
            latest_donation.innerHTML = data.latest_count
            top_donation.innerHTML = data.highest_count
            latest_donator.innerHTML = data.latest_name
            top_donator.innerHTML = data.highest_name
        })
    }
    stats()
    setInterval(() => {
        stats()
    }, 10000);
</script>
