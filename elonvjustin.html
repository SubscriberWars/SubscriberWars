<script>
    var list1=[]
var list2=[]
var gap01=[]
var gap02=[]
function mainstats() {
    fetch('https://api.subscriberwars.space/twitter/justinbieber').then(res=>res.json()).then(data=>{
        followers_one.innerHTML=data.followers
        gap01=parseFloat(data.followers)
        title_one.innerHTML=data.displayName
        tag_one.innerHTML="@"+data.handle
        img_one.src=data.pfp.replace('normal','400x400')
        a1.innerHTML=data.followers
        list1.unshift(data.followers)
        if(list1.length>900){list1.pop()}
        min1.innerHTML= data.followers-parseFloat(list1[14])+"/Min"
        hrs1.innerHTML= data.followers-parseFloat(list1[899])+"/Hr"
        var result = (a1.innerHTML)
        var inject = result
        if (chart1.series[0].points.length >= 900) chart1.series[0].data[0].remove();
        chart1.series[0].addPoint([Date.now(),parseFloat(inject)])
    })
    fetch('https://api.subscriberwars.space/twitter/v2/elonmusk').then(res=>res.json()).then(data=>{
        followers_two.innerHTML=data.data.public_metrics.followers_count
        gap02=parseFloat(data.data.public_metrics.followers_count)
        diff.innerHTML=gap01-gap02
        title_two.innerHTML=data.data.name
        tag_two.innerHTML="@"+data.data.username
        img_two.src=data.data.profile_image_url.replace('normal','400x400')
        a2.innerHTML=data.data.public_metrics.followers_count
        list2.unshift(data.data.public_metrics.followers_count)
        if(list2.length>900){list2.pop()}
        min2.innerHTML= data.data.public_metrics.followers_count-parseFloat(list2[14])+"/Min"
        hrs2.innerHTML= data.data.public_metrics.followers_count-parseFloat(list2[899])+"/Hr"
        var result2 = (a2.innerHTML)
        var inject2 = result2
        if (chart2.series[0].points.length >= 900) chart2.series[0].data[0].remove();
        chart2.series[0].addPoint([Date.now(),parseFloat(inject2)])
        var result3 = (a1.innerHTML-a2.innerHTML)
        var inject3 = result3
        if (chart3.series[0].points.length >= 900) chart3.series[0].data[0].remove();
        chart3.series[0].addPoint([Date.now(),parseFloat(inject3)])
    })
}
