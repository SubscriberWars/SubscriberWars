<head>
    <title>Lecester City's Premier League Statistics</title>
    <link rel='stylesheet' href='prem.css'>
</head>

<body>
    <div style='clear:both'></div>
    <div id='top-header'>
        <img id='top-header-background' src='https://www.banner.yt/UCBkRQtxofyXr09mWtgoUUqw?width=1280'>
    </div>
    <div id='UserTopInfoWrap'>
        <img id='UserTopInfoAvatar' src='https://ssl.gstatic.com/onebox/media/sports/logos/UDYY4FSlty6fXFBzvFfcyw_96x96.png'>
        <div id='UserTopInfoBlockTop'>
            <div>
                <h1 style='float: left; font-size: 1.4em; font-weight: bold; color:rgb(255, 255, 255); margin: 0px; padding: 0px; margin-right: 5px;'>Leicester City F.C.</h1>
            </div>
            <br><br>
            <div style='clear:both'></div>
            <div id="UserTopInfoBlock">
                <div class="UserTopInfo">
                    <span class="UserTopLight">Played</span><br>
                    <span style="font-weight: bold;">10</span>
                </div>
                <div class="UserTopInfo">
                    <span class="UserTopLight">Points</span><br>
                    <span style="font-weight: bold;">14</span> 
                </div>
                <div class="UserTopInfo">
                    <span class="UserTopLight">Won</span><br>
                    <span style="font-weight: bold;">4</span>
                </div>
                <div class="UserTopInfo">
                    <span class="UserTopLight">Drew</span><br>
                    <span style="font-weight: bold;">2</span>
                </div>		
                <div class="UserTopInfo">
                    <span class="UserTopLight">Lost</span><br>
                    <span style="font-weight: bold;">4</span>
                </div>
                <div class="UserTopInfo">
                    <span class="UserTopLight">Goals For</span><br>
                    <span style="font-weight: bold;">15</span>
                </div>
                <div class="UserTopInfo">
                    <span class="UserTopLight">Goals Against</span><br>
                    <span style="font-weight: bold;">17</span>
                </div>
                <div class="UserTopInfo">
                    <span class="UserTopLight">Goal Difference</span><br>
                    <span style="font-weight: bold;">-2</span>
                </div>			   
            </div>
        </div>
    </div>
    <br>
    <div style='width:1260px; margin: 0px auto;'>
        <div id='UserContainer;'>
            <div id='UserContent'>
                <div style='float: left; width: 1260px; height: 150px;'>
                    <div style='float: left; width: 122px; height: 120px; padding: 10px; background: #8d7f01; border-radius: 4px;'>
                        <div style='width: 122px; height: 80px; margin-top: 10px; line-height: 80px; text-align: center; color: #fff; font-size: 4.4em; font-weight: bold; background: #8d7f01;'>11th</div>
                        <div style='width: 120px; height: 20px; margin-top: 0px; text-align: center; font-size: 12pt; color: #fff; background: #8d7f01;'>
                            <span style="text-transform: uppercase; background: #8d7f01;">Position</span>
                        </div>
                    </div>
                    <div style='float: right; width: 1080px; height: 120px; padding: 10px; background: rgb(26,26,26);'>
                        <div style='height: 110px; width: 530px; float: left; border-right: 1px solid #333333;'>
                            <div style='width: 532px; text-align: center; margin-top: 30px;'>
                                <p style='font-size: 1.5em; color: rgb(255, 0, 0); font-weight: 600;'>Lost</p> <!--#41a200=green-->
                            </div>
                            <div style='width: 532px; text-align: center;'>
                                <span style='text-transform: uppercase; font-size: 12pt; color: rgb(194, 194, 194);'>Latest Game Result</span>
                            </div>
                        </div>
                        <div style='height: 110px; width: 530px; float: left;'>
                            <div style='width: 532px; text-align: center; margin-top: 30px;'>
                                <p style='font-size: 1.5em; color: #fff; font-weight: 600;'>Mid-Table</p>
                            </div>
                            <div style='width: 532px; text-align: center;'>
                                <span style='text-transform: uppercase; font-size: 12pt; color: rgb(194, 194, 194);'>Zone</span>
                            </div>
                        </div>
                    </div>   
                </div>
                <div style='clear: both;'></div>
                <div style='width:1260px; float: left; font-size: 8pt; margin-top: 20px;'>
                    <div style='width: 1220px; background: rgb(26,26,26); padding: 20px; text-transform: uppercase; color: #fff;'>
                        <h2 style='font-size: 12pt;'>Game Statistics</h2>
                    </div>
                    <div style='width: 1220px; height: 30px; line-height: 30px; background: rgb(31, 30, 30); padding: 0px 20px; text-transform: uppercase; color: #fff; font-size: 10pt;'>
                        <div style='width: 50px; float: left;'>Game</div>
                        <div style='width: 160px; float: left;'>Date</div>
                        <div style='width: 160px; float: left;'>Against</div>
                        <div style='width: 160px; float: left;'>Location</div>
                        <div style='width: 160px; float: left;'>Outcome</div>
                        <div style='width: 160px; float: left;'>Goals For</div>
                        <div style='width: 160px; float: left;'>Goals Against</div>
                        <div style='width: 160px; float: left;'>Points</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
