<head>
    <link href="https://fonts.googleapis.com/css?family=Roboto:100,200,300,400,500,600,700,800" rel="stylesheet" type="text/css">
    <link rel="stylesheet" href="/css/odometer.css">
    <script src="https://kit.fontawesome.com/93168af8d4.js" crossorigin="anonymous"></script>
    <script src="/js/odometer.js"></script>
    <title id="page_title"></title>
</head>

<body>
    <div class="head">
        <div class="head_text">Live Rumble Video Statistics</div>
    </div>
    <div class="main_box">
        <img id="channel_banner" src="/images/banner_placeholder.png">
        <img id="channel_image" src="/images/pfp_placeholder.png">
        <div id="channel_title_container">
            <span id="channel_title"></span>
        </div>
        <div id="video_views" class="odometer"></div>
        <div id="subscribers">Views</div>
        <div class="bottom_data">
            <div class="bottom_counts">
                <div class="odometer bottom_odometer" id="video_likes"></div>
                <div class="bottom_text">Likes</div>
            </div>
            <div class="bottom_counts">
                <div class="odometer bottom_odometer" id="video_dislikes"></div>
                <div class="bottom_text">Dislikes</div>
            </div>
            <div class="bottom_counts">
                <div class="odometer bottom_odometer" id="video_comments"></div>
                <div class="bottom_text">Comments</div>
            </div>
        </div>
    </div>
    <div class="button_box">
        <a id="channel_link" target="_blank" style="margin: auto;">
            <button class="bott_button">
                Go To Video
            </button>
        </a>
    </div>
</body>

<style>
    body {
        background: #171717;
        color: #f5f5f5;
        margin: 0;
        font-family: roboto;
    }
    .head {
        width: 100%;
        height: 60px;
        background-image: linear-gradient(to right, #69b52b, #396118);
        overflow: hidden;
        border-bottom: 1px solid #000;
    }
    .head_text {
        text-align: center;
        vertical-align: middle;
        font-weight: 500;
        font-size: 50px;
    }
    .main_box {
        width: 1260px;
        height: 780px;
        background: #262626;
        margin: auto;
        padding: 10px;
        margin-top: 20px;
        border: 1px solid #000;
        border-radius: 10px;
        text-align: center;
    }
    #channel_banner {
        width: 100%;
        border: 1px solid #000;
        border-radius: 10px;
        height: 208px;
        filter: blur(3px);
    }
    #channel_image {
        width: 355.56px;
        height: 200px;
        border: 1px solid #000;
        border-radius: 10px;
        top: -100px;
        position: relative;
    }
    #channel_title_container {
        position: relative;
        top: -100px;
        font-size: 3rem;
        max-height: 4.8rem;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }
    #video_views {
        position: relative;
        top: -90px;
        font-size: 10rem;
        font-weight: 500;
    }
    #subscribers {
        position: relative;
        top: -80px;
        font-size: 2rem;
    }
    .bottom_data {
        width: 100%;
        height: 150px;
        position: relative;
        display: flex;
        top: -70px;
    }
    .bottom_counts {
        margin: 5px;
        padding: 10px;
        width: 600px;
        height: 130px;
        background: #000;
        border-radius: 10px;
    }
    .bottom_odometer {
        font-weight: 500;
        font-size: 3rem;
    }
    .bottom_text {
        font-size: 2rem;
        margin-top: 20px;
    }
    ::-webkit-scrollbar {
        width: 5px;
    }
    ::-webkit-scrollbar-track {
        border-radius: 2.5px;
    }
    ::-webkit-scrollbar-thumb {
        background: #69b52b;
        border-radius: 2.5px;
    }
    ::-webkit-scrollbar-thumb:hover {
        background: #396118;
        border-radius: 2.5px;
    }
    .button_box {
        width: 1260px;
        margin: auto;
        display: flex;
        margin-top: 10px;
    }
    .bott_button {
        width: 620px;
        margin: auto;
        background: #262626;
        color: #fff;
        height: 100px;
        font-size: 30px;
        border-radius: 10px;
        border: 1px solid #000;
    }
    .bott_button:hover {
        cursor: pointer;
        background: #000;
        border: 1px solid #fff;
    }
</style>

<script>
    var channel = window.location.href.split('?q=')[1] || '';

    function stats(chanid) {
    fetch('https://api.subscriberwars.space/rumble/video/'+chanid).then(res => res.json()).then(data => {
        page_title.innerHTML= data.title + "Live Statistics"
        channel_title.innerHTML=data.title
        channel_image.src=data.thumbnail
        channel_banner.src=data.thumbnail
        video_likes.innerHTML = data.likeCount
        video_views.innerHTML = data.viewCount
        video_dislikes.innerHTML = data.dislikeCount
        video_comments.innerHTML = data.commentCount
        channel_link.href=data.url
    });
    
}
    stats(channel)
    setInterval(() => {
        stats(channel)
    }, 10000);
</script>
