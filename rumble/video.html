<!DOCTYPE html>
<head>
    <title>Video Statistics</title>
    <meta name="description" content="Live YouTube Video Stats">
    <link rel="stylesheet" href="/css/odometer.css">
    <link rel="stylesheet" href="/css/video.css">
    <script src="https://code.highcharts.com/highcharts.js"></script>
    <script src="/js/odometer.js"></script>
    <script src="/js/video.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
    <div id="count-block">
        <img id="logo" src="" alt="Thumbnail">
        <h1 id="title">Loading...</h1>
        <div id='viewscount' class="odometer odometer-auto-theme" style="font-size: 120pt; font-weight: 500; text-align: center; margin: 0px auto; margin-top: 10px; margin-bottom: 10px; position: relative; width: 1260px;">0</div>
        <h2>Views</h2>
    </div>
    <div id="mini-counts">
        <div id="like-box">
            <div id='likecount' class="odometer odometer-auto-theme" style="font-size: 30pt; font-weight: 500; text-align: center; margin: 0px auto; margin-top: 10px; margin-bottom: 10px; position: relative; width: 406px;">0</div>
            <h2>Likes</h2>
        </div>
        <div id="comment-box">
            <div id='commentcount' class="odometer odometer-auto-theme" style="font-size: 30pt; font-weight: 500; text-align: center; margin: 0px auto; margin-top: 10px; margin-bottom: 10px; position: relative; width: 406px;">0</div>
            <h2>Comments</h2>
        </div>
        <div id="dislike-box">
            <div id='dislikecount' class="odometer odometer-auto-theme" style="font-size: 30pt; font-weight: 500; text-align: center; margin: 0px auto; margin-top: 10px; margin-bottom: 10px; position: relative; width: 406px;">0</div>
            <h2>Dislikes</h2>
        </div>
    </div>
    <div id="graph-block" style="width:1260px; height:400px; margin: 0px auto; margin-top: 20px; margin-bottom: 20px; background:#0f0f0f; overflow: hidden; position: relative;">
        <div id="graph" style="width: 1260px; height: 400px;"></div>
        <p id="graphstat" style="visibility: hidden;"></p>
    </div>
</body>
<script>
    var channel = window.location.href.split('?v=')[1] || '';
    
    function update(chanid) {
        fetch('https://api.subscriberwars.space/rumble/v/'+chanid+'').then(res => res.json()).then(data => {
            title.innerHTML = data.data.title
            viewscount.innerHTML= data.data.views
            likecount.innerHTML= data.data.rumble_votes.num_votes_up
            dislikecount.innerHTML= data.data.rumble_votes.num_votes_down
            commentcount.innerHTML=data.data.comments.count
            logo.src = data.data.thumbnail
            graphstat.innerHTML = data.data.views
            var yep=(graphstat.innerHTML)
            console.log(yep)
            var injection=yep
            if(graph.series[0].points.length>=900)graph.series[0].data[0].remove();
            graph.series[0].addPoint([Date.now(),parseFloat(injection)])
        });
    }
    
    // Intervals
    setInterval(() => {
        update(channel);
    }, 2000);
    
    update(channel)
    
    </script>
    
    <script>//graph styling
        var graph = new Highcharts.chart({
    chart: {
    renderTo: 'graph',
    type: 'spline',
    zoomType: 'x',
    backgroundColor: 'transparent',
    plotBorderColor: 'transparent'
    },
    title: {
    text: ''
    },
    xAxis: {
    type: 'datetime',
    tickPixelInterval: 100,
    gridLineColor: '#transparent',
    labels: {
        style: {
            color: 'white'
        }
    },
    minorGridLineColor: '#transparent',
    tickColor: 'white',
    title: {
        style: {
            color: '#transparent'
        }
    }
    },
    yAxis: {
    title: {
      text: ''
    },
    gridLineColor: '#transparent',
    labels: {
        style: {
            color: 'white'
        }
    },
    lineColor: 'white',
    minorGridLineColor: 'transparent',
    tickColor: 'white'
    },
    credits: {
    enabled: true,
    text: "Subscriberwars.space"
    },
    series: [{
    showInLegend: false,
    name: 'Views',
    marker: { enabled: false },
    color: '#69b52b',
    lineColor: '#69b52b'
    }]
    });
    </script>
