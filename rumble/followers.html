            <thead>
                <tr>
                    <th>Released</th>
                    <th>Thumbnail</th>
                    <th>Title</th>
                    <th>Views</th>
                    <th>Likes</th>
                    <th>Dislikes</th>
                    <th>Comments</th>
                    <th>Est. Earnings <i class="fa fa-circle-question" title="Based on a $2 - $15 CPM. This is assuming the channel is monetized."></i></th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
    <p id="goal01" style="display: none;"></p>

<script>
    var channel = window.location.href.split('?u=')[1] || '';
    var id="";
    const videoarray = [];

    function load(chanid) {
        fetch("https://api.subscriberwars.space/rumble/"+chanid).then(res=>res.json()).then(data=>{
            page_title.innerHTML=data.data.title+"'s Live Follower Count"
            channel_image.src=data.data.thumb
            channel_title.innerHTML=data.data.title
            channel_subscribers.innerHTML=data.data.followers
            channel_videos.innerHTML=data.data.videos
            channel_views.innerHTML=data.data.following
            channel_banner.src=data.data.backsplash
            id=data.data.id.replace("_c", "c-")
            channel_title.href="https://rumble.com/c/"+id
            channel_link.href="https://rumble.com/c/"+id
            channel_sb.href="https://www.rumblestats.com/"+data.data.name
        })

        fetch("https://api.subscriberwars.space/rumble/latest/10/"+chanid).then(res=>res.json()).then(data=>{
            videoarray[0] = data.data.items[0]
            videoarray[1] = data.data.items[1]
            videoarray[2] = data.data.items[2]
            videoarray[3] = data.data.items[3]
            videoarray[4] = data.data.items[4]
            videoarray[5] = data.data.items[5]
            videoarray[6] = data.data.items[6]
            videoarray[7] = data.data.items[7]
            videoarray[8] = data.data.items[8]
            videoarray[9] = data.data.items[9]
            console.log(videoarray)
        })
    }

    function inject() {
        const tableBody = document.querySelector('#video_table tbody');
        videoarray.forEach(dataRow => {
            const newRow = document.createElement('tr');
            //properties to extract
            const properties = [
                'upload_date',
                'thumb',
                'title',
                'views',
                'rumble_votes.num_votes_up',
                'rumble_votes.num_votes_down',
                'comments.count',
                'estimated_revenue'
            ];
            properties.forEach(property => {
                const newCell = document.createElement('td');
                const propertyPath = property.split('.');
                let value = dataRow;
                propertyPath.forEach(path => {
                    value = value[path];
                });
                if (property === 'upload_date') {
                    value = value.split("T") [0]
                }
                if (property === 'views' || property === 'rumble_votes.num_votes_up' || property === 'rumble_votes.num_votes_down' || property === 'comments.count') {
                    value = value.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
                } else if (property === 'estimated_revenue') {
                    const views = dataRow.views;
                    const revenueLow = (views / 1000) * 2;
                    const revenueHigh = (views / 1000) * 15;
                    value = `$${abbreviateNumber(revenueLow)} - $${abbreviateNumber(revenueHigh)}`;
                    newCell.style.color = 'green';
                }
                if (property === 'thumb') {
                    const image = document.createElement('img');
                    image.src = value;
                    image.alt = 'Thumbnail';
                    image.style.height = '90px';
                    newCell.appendChild(image);
                } else {
                    newCell.textContent = value;
                    newCell.style.maxWidth = '300px';
                    newCell.style.overflow = 'hidden';
                    newCell.style.whiteSpace = 'noWrap';
                    newCell.style.textOverflow = 'ellipsis';
                    newCell.style.paddingRight = '10px';
                }
                newRow.appendChild(newCell);
            });
            tableBody.appendChild(newRow);
        });
    }

    function abbreviateNumber(number) {
        const SI_SYMBOLS = ["", "K", "M", "B", "T"];
        const tier = Math.log10(Math.abs(number)) / 3 | 0;
        const suffix = SI_SYMBOLS[tier];
        const abbreviatedNumber = (number / Math.pow(10, tier * 3)).toPrecision(3) + suffix;
        return abbreviatedNumber;
    }

    function stats(chanid) {
        fetch("https://api.subscriberwars.space/rumble/"+chanid).then(res=>res.json()).then(data=>{
            channel_subscribers.innerHTML=data.data.followers
            channel_videos.innerHTML=data.data.videos
            if(data.data.followers>=0) {goal01.innerHTML=10}
            if(data.data.followers>=10) {goal01.innerHTML=100}
            if(data.data.followers>=100) {goal01.innerHTML=1000}
            if(data.data.followers>=1000) {goal01.innerHTML=(Math.floor(data.data.followers/1000)*1000)+1000}
            if(data.data.followers>=10000) {goal01.innerHTML=(Math.floor(data.data.followers/10000)*10000)+10000}
            if(data.data.followers>=100000) {goal01.innerHTML=(Math.floor(data.data.followers/100000)*100000)+100000}
            if(data.data.followers>=1000000) {goal01.innerHTML=(Math.floor(data.data.followers/1000000)*1000000)+1000000}
            if(data.data.followers>=10000000) {goal01.innerHTML=(Math.floor(data.data.followers/10000000)*10000000)+10000000}
            if(data.data.followers>=100000000) {goal01.innerHTML=(Math.floor(data.data.followers/100000000)*100000000)+100000000}
            channel_goal.innerHTML=goal01.innerHTML-data.data.followers
        })
    }
    load(channel)
    setInterval(() => {
        stats(channel)
    }, 2000);
    setTimeout(() => {
        inject()
    }, 1000);
</script>
