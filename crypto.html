<head>
    <link href="https://fonts.googleapis.com/css?family=Roboto:100,200,300,400,500,600,700,800" rel="stylesheet" type="text/css">
    <link rel="stylesheet" href="/css/odometer.css">
    <script src="https://kit.fontawesome.com/93168af8d4.js" crossorigin="anonymous"></script>
    <script src="/js/odometer.js"></script>
    <title id="page_title"></title>
    <script src="https://code.highcharts.com/highcharts.js"></script>
</head>
<!-- Google tag (gtag.js) -->

  window.dataLayer = window.dataLayer || [];

<body>
    <div class="head">
        <div class="head_text">Crypto Prices</div>
    </div>
    <div class="main_box">
        <div id="channel_title_container">
            <div id="channel_title">Loading...</div>
        </div>
        <div id="channel_subscribers" class="odometer"></div>
        <div id="subscribers">Price</div>
        <div id="chart"></div>
        <p id="gdata1" style="display: none;"></p>
        <div class="bottom_data">
            <div class="bottom_counts">
                <div class="bottom_odometer odometer" id="high"></div>
                <div class="bottom_text"><i class="fa fa-sharp fa-up"></i> High Since Open</div>
            </div>
            <div class="bottom_counts">
                <div class="bottom_counts">
                    <div class="bottom_odometer odometer" id="change"></div>
                    <div class="bottom_text"><i class="fa fa-sharp fa-swap"></i> Change Since Open</div>
                </div>
            </div>
            <div class="bottom_counts">
                <div class="bottom_odometer odometer" id="low"></div>
                <div class="bottom_text"><i class="fa fa-sharp fa-down"></i> Low Since Open</div>
            </div>
        </div>
    </div>
</body>

<style>
    body {
        background: #181818;
        color: #fff;
        margin: 0;
        font-family: roboto;
    }
    .head {
        width: 100%;
        height: 60px;
        background-image: linear-gradient(to right, #009dff, #005e98);
        overflow: hidden;
        border-bottom: 1px solid #000;
    }
    .head_text {
        text-align: center;
        vertical-align: middle;
        font-weight: 500;
        font-size: 3rem;
    }
    .main_box {
        width: 1260px;
        height: 900px;
        background: #0f0f0f;
        margin: auto;
        padding: 10px;
        margin-top: 20px;
        border: 1px solid #000;
        border-radius: 10px;
        text-align: center;
    }
    #channel_title_container {
        position: relative;
        top: 0px;
        font-size: 4rem;
    }
    #channel_subscribers {
        position: relative;
        top: 0px;
        font-size: 12rem;
        font-weight: 500;
    }
    #subscribers {
        position: relative;
        top: 0px;
        font-size: 2rem;
    }
    .bottom_data {
        width: 100%;
        height: 150px;
        position: relative;
        display: flex;
        top: 0px;
    }
    .bottom_counts {
        margin: 5px;
        padding: 10px;
        width: 100%;
        height: 130px;
        background: #000;
        border-radius: 10px;
        overflow: hidden;
    }
    .bottom_odometer {
        font-weight: 500;
        font-size: 3rem;
    }
    .bottom_text {
        font-size: 2rem;
        margin-top: 20px;
    }
    ::-webkit-scrollbar {
        width: 5px;
    }
    ::-webkit-scrollbar-track {
        border-radius: 2.5px;
    }
    ::-webkit-scrollbar-thumb {
        background: #009dff;
        border-radius: 2.5px;
    }
    ::-webkit-scrollbar-thumb:hover {
        background: #005e98;
        border-radius: 2.5px;
    }
</style>

<script>
    var params = new URLSearchParams(document.location.search.substring(1));
    var cry=params.get("cry");
    var cur=params.get("cur");
    document.addEventListener("DOMContentLoaded", function () {
        var chart;

        chart = Highcharts.chart({
            chart: {
                renderTo: 'chart',
                type: 'spline',
                zoomType: 'x',
                backgroundColor: 'transparent',
                plotBorderColor: 'transparent'
            },
            title: { text: '' },
            xAxis: {
                type: 'datetime',
                tickPixelInterval: 100,
                gridLineColor: '#transparent',
                labels: { style: { color: 'white' } },
                minorGridLineColor: '#transparent',
                tickColor: 'white',
                lineColor: 'white',
                title: { style: { color: '#transparent' } }
            },
            yAxis: {
                title: { text: '' },
                gridLineColor: '#transparent',
                labels: { style: { color: 'white' } },
                lineColor: 'white',
                minorGridLineColor: 'transparent',
                tickColor: 'white'
            },
            credits: { enabled: false, text: "" },
            plotOptions: { spline: { fillOpacity: 0.5 } },
            series: [{ showInLegend: false, name: 'Players Online', marker: { enabled: false }, lineColor: '#009dff', color: '#009dff', lineWidth: 4 }]
        });

        function load(cry,cur) {
            fetch("https://api.subscriberwars.space/crypto/"+cry+"/"+cur)
                .then(res => res.json())
                .then(data => {
                    page_title.innerHTML = data.display_name+" conversion"
                    channel_title.innerHTML = data.display_name
                    if (data.quote_currency=="GBP"){subscribers.innerHTML="£ Pound Sterling"}
                    else if (data.quote_currency=="USD"){subscribers.innerHTML="$ United States Dollar"}
                    else if (data.quote_currency=="EUR"){subscribers.innerHTML="€ Euro"}
                    else {subscribers.innerHTML="Unknown Currency"}
                })
        }

        function stats(cry,cur) {
                fetch("https://api.subscriberwars.space/crypto/"+cry+"/"+cur+"/stats")
                .then(res => res.json())
                .then(data => {
                    channel_subscribers.innerHTML = data.last
                    gdata1.innerHTML = data.last
                    high.innerHTML=data.high
                    low.innerHTML=data.low
                    change.innerHTML=data.last-data.open
                    if((data.last-data.open)>0){document.getElementById("change").style.color="green"}
                    else if((data.last-data.open)<0){document.getElementById("change").style.color="red"}
                    else{document.getElementById("change").style.color="white"}
                    var result = gdata1.innerHTML
                    var inject = parseFloat(result)

                    if (chart.series[0].points.length >= 180) {
                        chart.series[0].data[0].remove()
                    }
                    chart.series[0].addPoint([Date.now(), inject])
                })
        }
        load(cry,cur)
        stats(cry,cur)
        setInterval(function () {
            stats(cry,cur)
        }, 10000)
    })
</script>
