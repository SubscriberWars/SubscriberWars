<head>
    <title>SW Channel</title>
    <script src="/js/odometer.js"></script>
    <link rel="stylesheet" href="/css/odometer.css">
    <script type="text/javascript" src="jquery-3.1.1.min.js"></script>
</head>

<style>
    body, html {
    margin: 0px;
    padding: 0px;
    background: transparent;
    font-size: 11pt;
    font-family: roboto;
    display: block;
}
div {
    display: block;
}
</style>

<body>
    <div style="width: 1300px;">
        <div id="subs" class="odometer odometer-auto-theme" style="width: 1200px; height: 110px; background: transparent; margin-bottom: 20px; font-size: 60pt; font-weight: 700; text-align: center; color: #fff;">0</div>
        <div id="views" class="odometer odometer-auto-theme" style="width: 1200px; height: 110px; background: transparent; margin-bottom: 20px; font-size: 60pt; font-weight: 700; text-align: center; color: #fff;">0</div>
    </div>
</body>

<script>
    var url1='https://api.subscriberwars.space/sw/30day'


    setInterval(() => {
        fetch(url1).then(res => res.json()).then(data => {

            subs.innerHTML= data.totals.subscribers

            views.innerHTML= data.totals.views

        })
    }, 10000);

</script>
