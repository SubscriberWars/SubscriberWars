<head>
    <link href="https://fonts.googleapis.com/css?family=Roboto:100,200,300,400,500,600,700,800" rel="stylesheet"
        type="text/css">
    <link rel="stylesheet" href="/css/odometer.css">
    <script src="https://kit.fontawesome.com/93168af8d4.js" crossorigin="anonymous"></script>
    <script src="/js/odometer.js"></script>
    <title id="page_title"></title>
    <meta charset="UTF-8">
</head>

<body>
    <div class="head">
        <div class="head_text">Bluesky live Follower Count</div>
    </div>
    <div class="main_box">
        <img id="channel_banner" src="/images/banner_placeholder.png">
        <img id="channel_image" src="/images/pfp_placeholder.png">
        <div id="channel_title_container">
            <span id="channel_title"></span>
            <i class="fa fa-badge-check" style="display: none;" id="verified_" title=""></i>

        <div id="channel_subscribers" class="odometer"></div>
        <div id="subscribers">Followers</div>
        <div class="bottom_data">
            <div class="bottom_counts">
                <div class="odometer bottom_odometer" id="channel_views"></div>
                <div class="bottom_text">Following</div>
            </div>
            <div class="bottom_counts">
                <div class="odometer bottom_odometer" id="channel_videos"></div>

        <div class="button_box">
            <a id="channel_link" target="_blank" style="margin: auto; width: 1260px;">

                </button>

    </div>
    <p id="goal01" style="display: none;"></p>
    <table id="top"></table>
</body>

<style>
    body {

        color: #fff;
        margin: 0;

    #top {
        margin: 0 auto;

        border-collapse: collapse;
        font-family: roboto;
        margin-top: 120px;

    th {
        background: #000;
        height: 50px;
        text-align: left;
    }

    tr:nth-child(odd) {

    }

    tr:nth-child(even) {

    }

    tr {
        border: 0px;
        border-bottom: 1px solid #000;
    }

    .head {
        width: 100%;
        height: 60px;
        background-image: linear-gradient(to right, #00b7ff, #046a77);
        overflow: hidden;
        border-bottom: 1px solid #000;
    }

    .head_text {
        text-align: center;
        vertical-align: middle;
        font-weight: 500;
        font-size: 50px;
    }

    .main_box {
        width: 1260px;
        height: 800px;
        background: #0f0f0f;
        margin: auto;
        padding: 10px;
        margin-top: 20px;
        border: 1px solid #000;
        border-radius: 10px;
        text-align: center;
    }

    #channel_banner {
        width: 100%;
        border: 1px solid #000;
        border-radius: 10px;
        height: 208px;
    }

    #channel_image {
        width: 200px;
        height: 200px;
        border: 1px solid #000;
        border-radius: 10px;
        top: -100px;
        position: relative;
    }

    #channel_title_container {
        position: relative;
        top: -100px;
        font-size: 4rem;
    }

    #channel_subscribers {
        position: relative;
        top: -90px;
        font-size: 10rem;
        font-weight: 600;

    }

    #subscribers {
        position: relative;
        top: -80px;
        font-size: 2rem;
    }

    .bottom_data {
        width: 100%;
        height: 150px;
        position: relative;
        display: flex;
        top: -70px;
    }

    .bottom_counts {
        margin: 5px;
        padding: 10px;
        width: 620px;
        height: 130px;
        background: #000;
        border-radius: 10px;
    }

    .bottom_odometer {
        font-weight: 500;
        font-size: 2.5rem;
    }

    .bottom_text {
        font-size: 2rem;
        margin-top: 20px;
    }

    ::-webkit-scrollbar {
        width: 5px;
    }

    ::-webkit-scrollbar-track {
        border-radius: 2.5px;
    }

    ::-webkit-scrollbar-thumb {
        background: #00b7ff;
        border-radius: 2.5px;
    }

    ::-webkit-scrollbar-thumb:hover {
        background: #046a77;
        border-radius: 2.5px;
    }

    .button_box {

        margin: auto;
        display: flex;

        top: -30px;

        margin: auto;
        background: #0f0f0f;

    }

        cursor: pointer;
        background: #000;
        border: 1px solid #fff;
    }
</style>

<script>
    var channel = window.location.href.split('?q=')[1] || '';

    function stats(chanid) {
        fetch("https://api.subscriberwars.space/bluesky/channel/" + chanid).then(res => res.json()).then(data => {
            page_title.innerHTML = data.title + "'s Live Follower Count"
            channel_title.innerHTML = data.title
            username = data.slug
            channel_image.src = data.pfp
            channel_subscribers.innerHTML = data.followers
            channel_videos.innerHTML = data.posts
            channel_views.innerHTML = data.following
            channel_link.href = "https://bsky.app/profile/" + username
            channel_banner.src = data.banner

        })
    }

    stats(channel)

    setInterval(() => {
        stats(channel)
    }, 30000);


    function createTableFromJSON(jsonData) {
  let table = document.getElementById('top');
  while (table.firstChild) {
    table.removeChild(table.firstChild);
  }

  let headerRow = document.createElement('tr');
  let headers = ['Rank', 'Icon', 'Name', 'Followers', 'Following'];
  headers.forEach(header => {
    let th = document.createElement('th');
    th.textContent = header;
    th.style.border = '1px solid black';
    headerRow.appendChild(th);
  });
  table.appendChild(headerRow);

  for(let i = 0; i < Math.min(jsonData.length, 100); i++) {
    let item = jsonData[i];
    let row = document.createElement('tr');
    
    // Rank
    let rankCell = document.createElement('td');
    rankCell.textContent = item.rank;
    rankCell.style.border = '1px solid black';
    row.appendChild(rankCell);

    // Icon (Avatar URL)
    let iconCell = document.createElement('td');
    let img = document.createElement('img');
    img.src = item.avatar_url;
    img.style.maxWidth = '50px';
    iconCell.appendChild(img);
    iconCell.style.border = '1px solid black';
    row.appendChild(iconCell);

    // Name
    let nameCell = document.createElement('td');
    nameCell.textContent = item.name;
    nameCell.style.border = '1px solid black';
    row.appendChild(nameCell);

    // Followers
    let followersCell = document.createElement('td');
    followersCell.textContent = item.followers;
    followersCell.style.border = '1px solid black';
    row.appendChild(followersCell);

    // Following
    let followingCell = document.createElement('td');
    followingCell.textContent = item.following;
    followingCell.style.border = '1px solid black';
    row.appendChild(followingCell);

    table.appendChild(row);
  }
}

function fetchAndCreateTable(url) {
  fetch(url)
    .then(response => response.json())
    .then(jsonData => {
      createTableFromJSON(jsonData);
    })
    .catch(error => {
      console.error('Error:', error);
      let errorDiv = document.createElement('div');
      errorDiv.textContent = 'Failed to load data: ' + error.message;
      document.body.appendChild(errorDiv);
    });
}

let jsonURL = 'https://vqv.app/top500.json';

fetchAndCreateTable(jsonURL);
</script>
