<script>
    var list1=[]
var list2=[]
var gap01=[]
var gap02=[]
var string='';
string +='';
var string2='';
string2 +='';
function mainstats() {
    fetch('https://api.subscriberwars.space/stream/UC-lHJZR3Gqxm24_Vd_AJ5Yw').then(res=>res.json()).then(data=>{
        followers_one.innerHTML=data.estCounts[0]
        gap01=parseFloat(data.estCounts[0])
        title_one.innerHTML=data.name
        tag_one.innerHTML=data.tag
        img_one.src=data.pfp
        a1.innerHTML=data.estCounts[0]
        list1.unshift(data.estCounts[0])
        if(list1.length>900){list1.pop()}
        min1.innerHTML= data.estCounts[0]-parseFloat(list1[14])+"/Min"
        hrs1.innerHTML= data.estCounts[0]-parseFloat(list1[899])+"/Hr"
        var result = (a1.innerHTML)
        var inject = result
        if (chart1.series[0].points.length >= 900) chart1.series[0].data[0].remove();
        chart1.series[0].addPoint([Date.now(),parseFloat(inject)])
        if (data.apiCounts[0]<1000) {string=parseFloat(data.apiCounts[0])}
        if (data.apiCounts[0]>1000) {string=parseFloat(data.apiCounts[0]/1000)}
        if (data.apiCounts[0]>1000) {string +='K'}
        if (data.apiCounts[0]>10000) {string=parseFloat(data.apiCounts[0]/1000)}
        if (data.apiCounts[0]>10000) {string +='K'}
        if (data.apiCounts[0]>100000) {string=parseFloat(data.apiCounts[0]/1000)}
        if (data.apiCounts[0]>100000) {string +='K'}
        if (data.apiCounts[0]>1000000) {string=parseFloat(data.apiCounts[0]/1000000)}
        if (data.apiCounts[0]>1000000) {string +='M'}
        if (data.apiCounts[0]>10000000) {string=parseFloat(data.apiCounts[0]/1000000)}
        if (data.apiCounts[0]>10000000) {string +='M'}
        if (data.apiCounts[0]>100000000) {string=parseFloat(data.apiCounts[0]/1000000)}
        if (data.apiCounts[0]>100000000) {string +='M'}
        api_one.innerHTML=string
    })
    fetch('https://api.subscriberwars.space/stream/UCX6OQ3DkcsbYNE6H8uQQuVA').then(res=>res.json()).then(data=>{
        followers_two.innerHTML=data.estCounts[0]
        gap02=parseFloat(data.estCounts[0])
        diff.innerHTML=gap01-gap02
        title_two.innerHTML=data.name
        tag_two.innerHTML=data.tag
        api_two.innerHTML=data.apiCounts[0]
        img_two.src=data.pfp
        a2.innerHTML=data.estCounts[0]
        list2.unshift(data.estCounts[0])
        if(list2.length>900){list2.pop()}
        min2.innerHTML= data.estCounts[0]-parseFloat(list2[14])+"/Min"
        hrs2.innerHTML= data.estCounts[0]-parseFloat(list2[899])+"/Hr"
        var result2 = (a2.innerHTML)
        var inject2 = result2
        if (chart2.series[0].points.length >= 900) chart2.series[0].data[0].remove();
        chart2.series[0].addPoint([Date.now(),parseFloat(inject2)])
        var result3 = (a1.innerHTML-a2.innerHTML)
        var inject3 = result3
        if (chart3.series[0].points.length >= 900) chart3.series[0].data[0].remove();
        chart3.series[0].addPoint([Date.now(),parseFloat(inject3)])
        if (data.apiCounts[0]<1000) {string2=parseFloat(data.apiCounts[0])}
        if (data.apiCounts[0]>1000) {string2=parseFloat(data.apiCounts[0]/1000)}
        if (data.apiCounts[0]>1000) {string2 +='K'}
        if (data.apiCounts[0]>10000) {string2=parseFloat(data.apiCounts[0]/1000)}
        if (data.apiCounts[0]>10000) {string2 +='K'}
        if (data.apiCounts[0]>100000) {string2=parseFloat(data.apiCounts[0]/1000)}
        if (data.apiCounts[0]>100000) {string2 +='K'}
        if (data.apiCounts[0]>1000000) {string2=parseFloat(data.apiCounts[0]/1000000)}
        if (data.apiCounts[0]>1000000) {string2 +='M'}
        if (data.apiCounts[0]>10000000) {string2=parseFloat(data.apiCounts[0]/1000000)}
        if (data.apiCounts[0]>10000000) {string2 +='M'}
        if (data.apiCounts[0]>100000000) {string2=parseFloat(data.apiCounts[0]/1000000)}
        if (data.apiCounts[0]>100000000) {string2 +='M'}
        api_two.innerHTML=string2
    })
}
function chanstats() {
    fetch('https://api.subscriberwars.space/sw/30day').then(res=>res.json()).then(data=>{
        mini1_count.innerHTML=data.totals.subscribers
    })
    fetch('https://api.subscriberwars.space/jmbsw/30day').then(res=>res.json()).then(data=>{
        mini2_count.innerHTML=data.totals.subscribers
    })
}
function singleload(){
    fetch('https://api.subscriberwars.space/youtube/channel/UCdKLd9f_8ZyDSKxMm16oRww').then(res=>res.json()).then(data=>{
        mini1_title.innerHTML=data.items[0].snippet.title
        mini1_tag.innerHTML=data.items[0].snippet.customUrl
        mini1_img.src=data.items[0].snippet.thumbnails.medium.url
    })
    fetch('https://api.subscriberwars.space/youtube/channel/UClx-t76jqvFTcBxQsQBYJWA').then(res=>res.json()).then(data=>{
        mini2_title.innerHTML=data.items[0].snippet.title
        mini2_tag.innerHTML=data.items[0].snippet.customUrl
        mini2_img.src=data.items[0].snippet.thumbnails.medium.url
    })
}
var vidid=0;
var capi = 0;
var lapi = 0;
var likes = 0;
var views = 0;
var viewsC = 0;
var lol = 0;

function checkForNew() { // replace UC with UU
    fetch('https://api.subscriberwars.space/priv/yt/playlist/UUX6OQ3DkcsbYNE6H8uQQuVA').then(res => res.json()).then(data => {
        vidid = data.items[0].contentDetails.videoId
    });
}

function updateStats(id) {
    fetch('https://youtube.googleapis.com/youtube/v3/videos?part=snippet,statistics&key=AIzaSyAUfG3BP2Zx4XSPSaigqUFzkBqa8CbMx00&id='+id).then(res => res.json()).then(data => {
        capi = data.items[0].statistics.viewCount
        lapi = data.items[0].statistics.likeCount

    var ratio = parseFloat(capi) / parseFloat(lapi)
                console.log(ratio)
                    views = (Math.floor(parseFloat(views) + ratio * (parseFloat(lapi) - likes)))
                        if (viewsC == capi) { } else {
                            views = (Math.floor(parseFloat(capi)))
                        }
                viewsC = (Math.floor(capi))
                likes = (Math.floor(lapi))
                lol = views
        likesOdometer.innerHTML = data.items[0].statistics.likeCount,
        viewsOdometer.innerHTML = lol,
        vidtitle.innerHTML = data.items[0].snippet.title,
        commentsOdometer.innerHTML= data.items[0].statistics.commentCount
        thumbnail.src = data.items[0].snippet.thumbnails.maxres.url
    });
    
}

mainstats()
chanstats()

checkForNew()

setInterval(() => {
