    function pass(currentTime, user1Followers, user1Growth, user2Followers, user2Growth) {
        const now = currentTime.getTime();
        // Check if growth rates are different to avoid division by zero
        if (user2Growth === user1Growth) {
            // If growth rates are the same, they'll never meet or meet at infinity
            return {
                followers: Infinity,
                date: "Never"
            };
        }
        const minutesToMeet = (user1Followers - user2Followers) / (user2Growth - user1Growth);
        const meetingTimeMs = now + (minutesToMeet * 60 * 1000);
        const meetingDate = new Date(meetingTimeMs);
        return {
            followers: user1Followers + (minutesToMeet * user1Growth),
            date: meetingDate.toUTCString()
        };
    }

    function calculateMultipleMeetingPoints(dataSets, currentTime) {
        return dataSets.map(dataSet => {
            return pass(
                currentTime,
                dataSet.user1.followers,
                parseFloat(dataSet.user1.growth) || 0,
                dataSet.user2.followers,
                parseFloat(dataSet.user2.growth) || 0
            );
        });
    }

    function formatDate(dateString) {
        const date = new Date(dateString);
        const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
        const month = months[date.getUTCMonth()];
        const day = date.getUTCDate();
        let hours = date.getUTCHours();
        const ampm = hours >= 12 ? 'pm' : 'am';
        hours = hours % 12;
        hours = hours || 12; // the hour '0' should be '12'

        return `${month} ${day} ${hours}${ampm}`;
    }

    function abbreviateNumber(num) {
        if (num === Infinity) return 'Never';
        if (num === null || num === undefined) return 'N/A';

        const abbrev = ['', 'K', 'M', 'B', 'T']; // K for thousands, M for millions, B for billions, T for trillions
        let i = 0;
        while (num >= 1000 && i < abbrev.length - 1) {
            num /= 1000;
            i++;
        }
        return num.toFixed(1) + abbrev[i];
    }
