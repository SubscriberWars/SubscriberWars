function sw(){
    fetch('https://api.subscriberwars.space/sw/30day').then(res=>res.json()).then(data=>{
        swcount.innerHTML=data.totals.subscribers
    })
}

function mainstats() {
    fetch('https://api.subscriberwars.space/tiktok/v2/6614519312189947909').then(res=>res.json()).then(data=>{
        followers.innerHTML=data.followers
        a1.innerHTML=data.followers
        af28.innerHTML=data.followers.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",")
        list.unshift(data.followers)
        if(list.length>1800){list.pop()}
        min.innerHTML= data.followers-parseFloat(list[29])+"/Min"
        hrs.innerHTML= data.followers-parseFloat(list[1799])+"/Hr"
        var result = (a1.innerHTML)
        var inject = result
        if (chart1.series[0].points.length >= 900) chart1.series[0].data[0].remove();
        chart1.series[0].addPoint([Date.now(),parseFloat(inject)])
        ag28.innerHTML=(data.followers-diff).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",")
        if(data.followers-diff<0){document.getElementById('ag14').style.color='#ed2121'} else{document.getElementById('ag14').style.color='#1bed0c'}
    })
}
