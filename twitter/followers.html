<!DOCTYPE html>
<head>
    <title>Live Twitter Follower Count</title>
    <meta name="description" content="Live Twitter Stats">
    <link rel="stylesheet" href="/css/odometer.css">
    <link rel="stylesheet" href="/css/main.css">
    <script src="/js/odometer.js"></script>
    <script src="https://code.highcharts.com/highcharts.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
    <div id="count-block">
        <img id="logo" src="https://subscriberwars.space/logo/twitter.svg" alt="">
        <h1 id="title">Loading...</h1>
        <div id='followercount' class="odometer odometer-auto-theme" style="font-size: 120pt; font-weight: 500; text-align: center; margin: 0px auto; margin-top: 10px; margin-bottom: 10px; position: relative; width: 1260px;">0</div>
        <h2>Followers</h2>
    </div>
    <div id="mini-counts">
        <div id="like-box">
            <div id='tweetscount' class="odometer odometer-auto-theme" style="font-size: 30pt; font-weight: 500; text-align: center; margin: 0px auto; margin-top: 10px; margin-bottom: 10px; position: relative; width: 411px;">0</div>
            <h2>Tweets</h2>
        </div>
        <div id="comment-box">
            <div id='followingcount' class="odometer odometer-auto-theme" style="font-size: 30pt; font-weight: 500; text-align: center; margin: 0px auto; margin-top: 10px; margin-bottom: 10px; position: relative; width: 411px;">0</div>
            <h2>Following</h2>
        </div>
        <div id="api-box">
            <div id='goalcount' class="odometer odometer-auto-theme" style="font-size: 30pt; font-weight: 500; text-align: center; margin: 0px auto; margin-top: 10px; margin-bottom: 10px; position: relative; width: 411px;">0</div>
            <h2>Goal</h2>
        </div>
    </div>
    <div id="graph-block">
        <div id="graph" style="width: 1260px; height: 400px;"></div>
        <p id="graphstat" style="visibility: hidden;"></p>
        <p id="goal01" style="visibility: hidden;"></p>
    </div>
    <div style="width: 1260px; margin: 0px auto;">
        <div id="container">
            <div id="panel-left">
                <div style="float:left; width:560px;">
                    <div class="head-box">
                        <div id="name">
                            <a style="color: #fff; text-align: center;" href="https://subscriberwars.space/twitter/search">Change User</a>
                        </div>
                    </div>
                </div>
            </div>
            <div id="panel-right">
                <div style="float:left; width:560px;">
                    <div class="head-box">
                        <div id="name">
                            <a style="color: #fff; text-align: center;" href="https://subscriberwars.space">Home</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

<script>
var channel = window.location.href.split('?u=')[1] || '';

function update(chanid) {
    fetch('https://api.subscriberwars.space/twitter/'+chanid+'').then(res => res.json()).then(data => {
        title.innerHTML = data.displayName
        followercount.innerHTML= data.followers
        tweetscount.innerHTML= data.tweets
        followingcount.innerHTML= data.following
        graphstat.innerHTML = data.followers
        logo.src = data.pfp.replace("normal","400x400")
        var yep=(graphstat.innerHTML)
        console.log(yep)
        var injection=yep
        if(graph.series[0].points.length>=720)graph.series[0].data[0].remove();
        graph.series[0].addPoint([Date.now(),parseFloat(injection)])
        if(data.followers>=0) {goal01.innerHTML=10}
        if(data.followers>=10) {goal01.innerHTML=100}
        if(data.followers>=100) {goal01.innerHTML=1000}
        if(data.followers>=1000) {goal01.innerHTML=(Math.floor(data.followers/1000)*1000)+1000}
        if(data.followers>=10000) {goal01.innerHTML=(Math.floor(data.followers/10000)*10000)+10000}
        if(data.followers>=100000) {goal01.innerHTML=(Math.floor(data.followers/100000)*100000)+100000}
        if(data.followers>=1000000) {goal01.innerHTML=(Math.floor(data.followers/1000000)*1000000)+1000000}
        if(data.followers>=10000000) {goal01.innerHTML=(Math.floor(data.followers/10000000)*10000000)+10000000}
        if(data.followers>=100000000) {goal01.innerHTML=(Math.floor(data.followers/100000000)*100000000)+100000000}
        goalcount.innerHTML=goal01.innerHTML-data.followers
    });
}

// Intervals
setInterval(() => {
    update(channel);
}, 5000);

update(channel)

</script>

<script>//graph styling
    var graph = new Highcharts.chart({
chart: {
renderTo: 'graph',
type: 'spline',
zoomType: 'x',
backgroundColor: 'transparent',
plotBorderColor: 'transparent'
},
title: {
text: ''
},
xAxis: {
type: 'datetime',
tickPixelInterval: 100,
gridLineColor: '#transparent',
labels: {
    style: {
        color: 'white'
    }
},
minorGridLineColor: '#transparent',
tickColor: 'white',
title: {
    style: {
        color: '#transparent'
    }
}
},
yAxis: {
title: {
  text: ''
},
gridLineColor: '#transparent',
labels: {
    style: {
        color: 'white'
    }
},
lineColor: 'white',
minorGridLineColor: 'transparent',
tickColor: 'white'
},
credits: {
enabled: true,
text: "Subscriberwars.space"
},
series: [{
showInLegend: false,
name: 'Followers',
marker: { enabled: false },
lineColor: '#03d7fc'
}]
});
</script>
