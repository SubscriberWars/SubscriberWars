<!DOCTYPE html>
<head>
    <title>Live Twitter Follower Count</title>
    <meta name="description" content="Live Twitter Stats">
    <link rel="stylesheet" href="/css/odometer.css">
    <link rel="stylesheet" href="/css/compare-main.css">
    <script src="/js/odometer.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
    <div id="count-block">
        <img class="logo" id="logo" src="https://subscriberwars.space/logo/twitter.svg">
        <h1 id="title">Loading...</h1>
        <div id='followercount' class="odometer odometer-auto-theme" style="font-size: 80pt; font-weight: 500; text-align: center; margin: 0px auto; margin-top: 10px; margin-bottom: 10px; position: relative; width: 100%;">0</div>
        <h2>Followers</h2>
    </div>
    <div id="count-block2">
        <img class="logo"  id="logob" src="https://subscriberwars.space/logo/twitter.svg">
        <h1 id="titleb">Loading...</h1>
        <div id='followercountb' class="odometer odometer-auto-theme" style="font-size: 80pt; font-weight: 500; text-align: center; margin: 0px auto; margin-top: 10px; margin-bottom: 10px; position: relative; width: 100%;">0</div>
        <h2>Followers</h2>
    </div>
    <div id="gap-block">
        <div id='difference' class="odometer odometer-auto-theme" style="font-size: 50pt; font-weight: 500; text-align: center; margin: 0px auto; margin-top: 10px; margin-bottom: 10px; position: relative; width: 100%;">0</div>
        <h2>Difference</h2>
    </div>
</body>

<script>
var channel = window.location.href.split('&')[1];
var channel2 = window.location.href.split('&')[2];
var gap01=[]
var gap02=[]

function update(chanid) {
    fetch('https://api.subscriberwars.space/twitter/'+chanid).then(res => res.json()).then(data => {
        title.innerHTML = data.displayName
        followercount.innerHTML= data.followers
        logo.src = data.pfp.replace("normal","400x400")
        gap01= data.followers
    });
}
function update2(chanid) {
    fetch('https://api.subscriberwars.space/twitter/'+chanid).then(res => res.json()).then(data => {
        titleb.innerHTML = data.displayName
        followercountb.innerHTML= data.followers
        logob.src = data.pfp.replace("normal","400x400")
        gap02= data.followers
        if(gap01>gap02){difference.innerHTML= gap01-gap02} else{difference.innerHTML= gap02-gap01}   
    });
}

// Intervals
setInterval(() => {
    update(channel);
    update2(channel2);
}, 6000);

update(channel)
update2(channel2)

</script>
