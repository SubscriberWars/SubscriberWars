<!DOCTYPE html>
<html>
    <head>
        <title>Twitter User Search</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
        <link rel="stylesheet" href="\css\twitter-search.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
        <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1716761206170121"
     crossorigin="anonymous"></script>
    </head>
    <body>
        <div class="container">
            <br><br><br>
            <h1 style="text-align: center; color: #fff;">Twitter User Search</h1>
            <br>
            <form>
                <div style="display: flex; width: 100%;">
                    <input class="form-control mr-sm-2" id="search" placeholder="User To Search For">
                    <button type="submit" class="searchbtn" value="Search"><i class="fa fa-fw fa-search" style="width: 100%;"></i></button>
                </div>
            </form>
            <br>
            <div class="row">
                <a href="" id="link1">
                   <div id="chan1" class="chan-card">
                       <div id="nam1" class="chan-name" style="top: 0px; left: 5px;"></div>
                       <div id="id1" class="chan-id" style="top: 0px; left: 5px;"></div>
                   </div>
                </a>
                <a href="" id="link2">
                   <div id="chan2" class="chan-card">
                       <div id="nam2" class="chan-name" style="top: 0px; left: 5px;"></div>
                       <div id="id2" class="chan-id" style="top: 0px; left: 5px;"></div>
                   </div>
                </a>
                <a href="" id="link3">
                   <div id="chan3" class="chan-card">
                       <div id="nam3" class="chan-name" style="top: 0px; left: 5px;"></div>
                       <div id="id3" class="chan-id" style="top: 0px; left: 5px;"></div>
                   </div>
                </a>
                <a href="" id="link4">
                   <div id="chan4" class="chan-card">
                       <div id="nam4" class="chan-name" style="top: 0px; left: 5px;"></div>
                       <div id="id4" class="chan-id" style="top: 0px; left: 5px;"></div>
                    </div>
                </a>
                <a href="" id="link5">
                   <div id="chan5" class="chan-card">
                       <div id="nam5" class="chan-name" style="top: 0px; left: 5px;"></div>
                       <div id="id5" class="chan-id" style="top: 0px; left: 5px;"></div>
                   </div>
                </a>
            </div>
        </div> 
    </body>
</html>

<script>
    $(document).ready(function(){

$('form').submit(function(event){
    event.preventDefault()

    var search = $("#search").val()

    channelSearch(search)
})

function channelSearch(search) {
    fetch("https://api.subscriberwars.space/twitter/tweet-search/" + search).then(res => res.json()).then(data => {
       console.log(data)

       nam1.innerHTML = "Tweet: "+data.data[0].text
       id1.innerHTML = "ID: "+data.data[0].id
       link1.href = "https://subscriberwars.space/twitter/tweet?t="+data.data[0].id

       nam2.innerHTML = "Tweet: "+data.data[1].text
       id2.innerHTML = "ID: "+data.data[1].id
       link2.href = "https://subscriberwars.space/twitter/tweet?t="+data.data[1].id

       nam3.innerHTML = "Tweet: "+data.data[2].text
       id3.innerHTML = "ID: "+data.data[2].id
       link3.href = "https://subscriberwars.space/twitter/tweet?t="+data.data[2].id

       nam4.innerHTML = "Tweet: "+data.data[3].text
       id4.innerHTML = "ID: "+data.data[3].id
       link4.href = "https://subscriberwars.space/twitter/tweet?t="+data.data[3].id

       nam5.innerHTML = "Tweet: "+data.data[4].text
       id5.innerHTML = "ID: "+data.data[4].id
       link5.href = "https://subscriberwars.space/twitter/tweet?t="+data.data[4].id
    })
}
})
</script>
