            <div style="width: 49%; float: right; top: -710px; position: relative;" >

                        <button type="submit" class="searchbtn" value="Search2"><i class="fa fa-fw fa-search" style="width: 100%;"></i></button>

<script>

//variables to build url
var user1=[]
var user2=[]

//url https://subscriberwars.space/twitter/followers-compare?&user1&user2

    $(document).ready(function(){

$('form').submit(function(event){
    event.preventDefault()

    var search = $("#search").val()
    var search2 = $("#search2").val()

    channelSearch(search)
    channelSearch2(search2)
})

//button set a
function channelSearch(search) {
    fetch("https://api.subscriberwars.space/twitter/user-search/5/" + search).then(res => res.json()).then(data => {
       console.log(data)

       img1.src = data[0].profile_image_url_https.replace("normal.jpg","400x400.jpg")
       nam1.innerHTML = data[0].name
       id1.innerHTML = "@"+data[0].screen_name

       img2.src = data[1].profile_image_url_https.replace("normal.jpg","400x400.jpg")
       nam2.innerHTML = data[1].name
       id2.innerHTML = "@"+data[1].screen_name

       img3.src = data[2].profile_image_url_https.replace("normal.jpg","400x400.jpg")
       nam3.innerHTML = data[2].name
       id3.innerHTML = "@"+data[2].screen_name

       img4.src = data[3].profile_image_url_https.replace("normal.jpg","400x400.jpg")
       nam4.innerHTML = data[3].name
       id4.innerHTML = "@"+data[3].screen_name

       img5.src = data[4].profile_image_url_https.replace("normal.jpg","400x400.jpg")
       nam5.innerHTML = data[4].name
       id5.innerHTML = "@"+data[4].screen_name
    })
}

//button set b
function channelSearch2(search2) {
    fetch("https://api.subscriberwars.space/twitter/user-search/5/" + search2).then(res => res.json()).then(data => {
       console.log(data)

       img1b.src = data[0].profile_image_url_https.replace("normal.jpg","400x400.jpg")
       nam1b.innerHTML = data[0].name
       id1b.innerHTML = "@"+data[0].screen_name

       img2b.src = data[1].profile_image_url_https.replace("normal.jpg","400x400.jpg")
       nam2b.innerHTML = data[1].name
       id2b.innerHTML = "@"+data[1].screen_name

       img3b.src = data[2].profile_image_url_https.replace("normal.jpg","400x400.jpg")
       nam3b.innerHTML = data[2].name
       id3b.innerHTML = "@"+data[2].screen_name

       img4b.src = data[3].profile_image_url_https.replace("normal.jpg","400x400.jpg")
       nam4b.innerHTML = data[3].name
       id4b.innerHTML = "@"+data[3].screen_name

       img5b.src = data[4].profile_image_url_https.replace("normal.jpg","400x400.jpg")
       nam5b.innerHTML = data[4].name
       id5b.innerHTML = "@"+data[4].screen_name
    })
}
})

</script>
