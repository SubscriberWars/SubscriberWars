<script>
var channel = window.location.href.split('?t=')[1] || '';

function update(chanid) {
    fetch('https://api.subscriberwars.space/twitter/tweet/'+chanid+'').then(res => res.json()).then(data => {
        tag.innerHTML= "Tweet ID: "+ data.data.id
        likecount.innerHTML= data.data.public_metrics.like_count
        replycount.innerHTML= data.data.public_metrics.reply_count
        retweetcount.innerHTML= data.data.public_metrics.retweet_count
        quotecount.innerHTML= data.data.public_metrics.quote_count
        text.innerHTML=data.data.text
    });
}

// Intervals
setInterval(() => {
    update(channel);
}, 5000);

update(channel)

</script>
