<!DOCTYPE html>

<head>
    <title id="title_0">Now Playing...</title>
</head>

<body>
    <div id="background">
        <h1 class="scroll_" id="track">Track</h1>
        <h2 id="artist">Artist</h2>
        <img id="image">
    </div>
</body>

<script>
    var api = "";
    function playing(){
        fetch('https://api.subscriberwars.space/planetrock').then(res=>res.json()).then(data=>{
            api=data.url
            track.innerHTML=data.artist
            artist.innerHTML=data.title
            title_0.innerHTML= "Now Playing: "+data.artist+" By: "+data.title
        })
        fetch(api).then(res=>res.json()).then(data=>{
            image.src=data.eventImageUrl
        })
    }
    playing()
    setInterval(playing , 10000)
</script>

<style>
    #progress_full {
        position: relative;
        border: 1px solid #000 !important;
        height: 30px;
        width: 75%;
        left: 210px;
        top: -350px;
        border-radius: 20px;
        box-shadow: 3px 3px 2px #000;
    }
    .fill {
        color:#fff!important;
        background: #5FFF88;
        background: -webkit-linear-gradient(top, #1db954, #13813A);
        background: -moz-linear-gradient(top, #1db954, #13813A);
        background: linear-gradient(to bottom, #1db954, #13813A);
        height: 30px;
        border-radius: 20px;
    }
    body {
        background-color: transparent;
    }
    #background {
        width: 1000px;
        height: 210px;
        background-color: transparent;
        overflow: hidden;
    }
    img {
        width: 200px;
        height: 200px;
        position: relative;
        top: -300px;
        border: 1px solid #000;
        border-radius: 20px;
        box-shadow: 3px 3px 2px #000;
    }
    h1 {
        color: white;
        font-family: roboto;
        font-weight: 600;
        position: relative;
        left: 210px;
        font-size: 3.5rem;
        text-shadow: 2px 2px 2px #000;
    }
    h2 {
        color: white;
        font-family: roboto;
        font-weight: 400;
        position: relative;
        left: 210px;
        top: -150px;
        font-size: 2rem;
        text-shadow: 2px 2px 2px #000;
    }
    .scroll_ {
        position: relative;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        height: 100%;
        width: 100%;
        margin: 0;
        text-align: left;
        /* Starting position */
        /*-moz-transform:translateX(35%);
        -webkit-transform:translateX(35%);	
        transform:translateX(35%);
        /* Apply animation to this element */	
        /*-moz-animation: scroll_ 20s linear infinite;
        -webkit-animation: scroll_ 20s linear infinite;
        animation: scroll_ 20s linear infinite;*/
    }
    /* Move it (define the animation) */
    @-moz-keyframes scroll_ {
        0%   { -moz-transform: translateX(35%); }
        100% { -moz-transform: translateX(-50%); }
        }
    @-webkit-keyframes scroll_ {
        0%   { -webkit-transform: translateX(35%); }
        100% { -webkit-transform: translateX(-50%); }
        }
    @keyframes scroll_ {
        0%   { 
        -moz-transform: translateX(35%); /* Browser bug fix */
        -webkit-transform: translateX(35%); /* Browser bug fix */
        transform: translateX(35%); 		
        }
        100% { 
        -moz-transform: translateX(-50%); /* Browser bug fix */
        -webkit-transform: translateX(-50%); /* Browser bug fix */
        transform: translateX(-50%);
        }
    }
</style>
