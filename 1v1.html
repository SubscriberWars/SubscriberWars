function updateStats(vidid,tweetid) {
    fetch('https://youtube.googleapis.com/youtube/v3/videos?part=snippet,statistics&key=AIzaSyAUfG3BP2Zx4XSPSaigqUFzkBqa8CbMx00&id='+vidid).then(res => res.json()).then(data => {
        capi = data.items[0].statistics.viewCount
        lapi = data.items[0].statistics.likeCount

    var ratio = parseFloat(capi) / parseFloat(lapi)
                console.log(ratio)
                    views = (Math.floor(parseFloat(views) + ratio * (parseFloat(lapi) - likes)))
                        if (viewsC == capi) { } else {
                            views = (Math.floor(parseFloat(capi)))
                        }
                viewsC = (Math.floor(capi))
                likes = (Math.floor(lapi))
                lol = views
        likesOdometer.innerHTML = data.items[0].statistics.likeCount,
        viewsOdometer.innerHTML = lol,
        vidtitle.innerHTML = data.items[0].snippet.title,
        thumbnail.src = data.items[0].snippet.thumbnails.maxres.url
        commentsOdometer.innerHTML = data.items[0].statistics.commentCount
    });

        bcapi = data.items[0].statistics.viewCount
        blapi = data.items[0].statistics.likeCount

    var bratio = parseFloat(bcapi) / parseFloat(lapi)
                console.log(bratio)
                    bviews = (Math.floor(parseFloat(bviews) + bratio * (parseFloat(blapi) - blikes)))
                        if (bviewsC == bcapi) { } else {
                            bviews = (Math.floor(parseFloat(bcapi)))
                        }
                bviewsC = (Math.floor(bcapi))
                blikes = (Math.floor(blapi))
                blol = bviews
        likesOdometer1.innerHTML = data.items[0].statistics.likeCount,
        viewsOdometer1.innerHTML = blol,
        vidtitle1.innerHTML = data.items[0].snippet.title,
        thumbnail1.src = data.items[0].snippet.thumbnails.maxres.url
        commentsOdometer1.innerHTML = data.items[0].statistics.commentCount
    });
}
