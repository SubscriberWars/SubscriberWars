
<style>
    body {
        background: #0f0f0f;
        color: #fff;
    }
    h1{
        font-family: bank-gothic;
        font-size: 100px;
    }
    @font-face{
    font-family: bank-gothic;
    src: url('/css/bank_gothic.woff') format('woff');
    }
</style>

<body>
    <h1 id="likes"></h1>
    <h1 id="viewers"></h1>
</body>
<script>
    var channel = window.location.href.split('?s=')[1] || '';
    function stats(stid) {
        fetch('https://api.subscriberwars.space/youtube/livestream/'+stid).then(res=>res.json()).then(data=>{
            likes.innerHTML = data.statistics.likeCount
            viewers.innerHTML = data.statistics.concurrentViewers
        });
    }
    stats(channel)

    setInterval(() => {
        stats(channel)
    }, 10000);
</script>
