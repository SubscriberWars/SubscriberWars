<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>top 10s</title>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.0/jquery.min.js"></script>
  <link rel="stylesheet" href="https://subscriberwars.space/css/odometer.css"/>
</head>
<body>
<div class="loader"></div>
<div class="counters"></div>
<script src="https://subscriberwars.space/js/odometer.js"></script>
</html>

<style>

* {
    box-sizing: border-box;
}

body {
    background: transparent;
    font-family: roboto;
    margin: 0;
}

.row {
  display: inline-block;
}

.card {
height: 80px;
width: 330px;
padding: 4px;
margin: 4px;
text-align: left;
margin-left: 2px;
background: #0f0f0f;
transition: 0.5s;
border: solid 3px #ff0000;
border-radius: 10px;
box-shadow: #000 2px 2px 1px; 
}

.cimg {
    height: 70px;
    width: 70px;
    float: left;
    margin-top: -2px;
    border-radius: 50%;
    margin-right: 10px;
    border: solid 1px #000;
}
.rankdis {
   float: right;
    border-radius: 8px;
    color: #fff;
    padding: 5px;
    background: rgb(0, 223, 0);
    font-size: 16px;
    transition: background 2s;
    font-weight: 500;
}

.cnb {
    font-size: 26px;
    margin-top: 20px;
    float: left;
    color: #fff;
    margin-left: 5px;
    margin-right: 10px;
    font-weight: 900;
}

    .subscriberCount {
        font-size: 34px;
        color: #fff;
        margin-top: 5px;
        font-weight: 400;
    }

.chnam {
    margin-top: 0px;
    font-family: 'Roboto';
    white-space: nowrap; 
    overflow: hidden;
    text-overflow: ellipsis;
    font-size: 20px;
    color: #fff;
    font-weight: 500;
}
</style>

<script type="text/javascript">

var c = 1;
var lol = []
var d = 1;
var lol2 = []

for (var l = 1; l <= 1; l++) {
  var htmlrow = `<div class="row_${l} row"></div>`;
  $('.counters').append(htmlrow);
    for (var w = 1; w <= 10; w++) {
      let number;
      if(c.toString().length == 1) {
          number = `<div class="cnb">0${c}</div>`
      } else {
            number = `<div class="cnb">${c}</div>`
      }

      var htmlcard = `<div class="channel_${c} card" id="card_thing_${c}">
      ${number}
      <img src="https://subscriberwars.space/images/sw.png" alt="" class="cimg">
      <div class="chnam">Loading</div>
      <div class="subscriberCount odometer">0</div>
      </div>`;
      $('.row_'+l).append(htmlcard);
      c += 1;
    }
}

function random(min, max){
  return Math.floor(Math.random()* (max-min) + min);
}

function updateData(q, data) {
  setTimeout(function () { 
    var cnb = q+1;


    $(".channel_"+cnb+" .cimg").attr("src",data.channel[q].pfp);
    $(".channel_"+cnb+" .chnam").html(data.channel[q].name);
    $(".channel_"+cnb+" .subscriberCount").html(Math.floor(data.channel[q].subscriberCount));


    if (lol[q] - data.channel[q].subscriberCount >= 1) {
      document.getElementById("card_thing_"+cnb+"").style.backgroundColor = "#282828";
      setTimeout(reset, 500)
    }
    if (lol[q] - data.channel[q].subscriberCount <= -1) {
      document.getElementById("card_thing_"+cnb+"").style.backgroundColor = "#282828";
      setTimeout(reset, 500)
    }

    setTimeout(idkpopdelay, 1000) 

    function idkpopdelay() {
      lol[q] = data.channel[q].subscriberCount
    }

function reset() {
  document.getElementById("card_thing_"+cnb+"").style.backgroundColor = "#0f0f0f";
}


    }, random(5 , 25)*1000);
}

function update(){
    $.getJSON("https://top10s.subscriberwars.repl.co/youtube",(data)=>{

        data.channel.sort(function(a,b){return b.subscriberCount - a.subscriberCount});

        for (var q = 0; q < 10; q++) {
          updateData(q, data)
        }
    });
}


update();
setInterval(update,5000);
setTimeout(function(){$('.loader').fadeOut(); $('.counters').fadeIn(1000);},1000)
setTimeout(function(){$('#loading').fadeOut(); $('.counters').fadeIn(1000);},1000)

</script>
