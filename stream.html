<link rel="stylesheet" href="/css/odometer.css">

<link href="https://fonts.googleapis.com/css?family=Roboto:100,200,300,400,500,600,700,800" rel="stylesheet" type="text/css">

<body>
    <div class="container_left">
        <div class="count_box">
            <img class="banner" id="banner1">
            <img class="profile_img" id="pfp1">
            <h1 id="title_1"></h1>
            <h2 class="odometer" id="sub_1"></h2>
            <div class="sec_container">
                <div class="sec_box">
                    <h3 class="odometer" id="view1"></h3>
                    <h4><i class="fa fa-regular fa-eye"></i> Channel Views</h4>
                </div>
                <div class="sec_box">
                    <h3 class="odometer" id="vid1"></h3>
                    <h4><i class="fa fa-regular fa-video"></i> Videos</h4>
                </div>
            </div>
            <div class="sec_container">
                <div class="sec_box">
                    <h3 class="odometer" id="hr1"></h3>
                    <h4><i class="fa fa-regular fa-flame"></i> 1 Hr Gain</h4>
                </div>
                <div class="sec_box">
                    <h3 class="odometer" id="day1"></h3>
                    <h4><i class="fa fa-regular fa-line-chart"></i> 1 Day Gain</h4>
                </div>
            </div>
        </div>
        <div class="bottom_box"></div>
    </div>
    <div class="container_center">
        <div class="embed_box">
            <img src="/images/sw.png" class="embed_img">
            <div class="embed_title"><i class="fa fa-brand fa-youtube"></i> Subscriber Wars</div>
            <div class="embed_count odometer" id="swyoutube"></div>
        </div>
        <div class="embed_box">
            <img src="https://static-cdn.jtvnw.net/jtv_user_pictures/b4420795-8da6-4872-bfbb-7f8b9b00acfe-profile_image-300x300.png" class="embed_img">
            <div class="embed_title"><i class="fa fa-brand fa-twitch"></i> JayMBurtonSW</div>
            <div class="embed_count odometer" id="swtwitch"></div>
        </div>
        <div class="gap_box">
            <div class="gap_count odometer" id="diff"></div>
            <div class="gap_title"><i class="fa fa-regular fa-user"></i> Sub Gap</div>
        </div>
        <div class="embed_box">
            <img class="embed_img" id="p1">
            <div class="embed_title" id="t1"><i class="fa fa-brand fa-youtube"></i> T-Series</div>
            <div class="embed_count odometer" id="e1"></div>
        </div>
        <div class="embed_box">
            <img class="embed_img" id="p2">
            <div class="embed_title" id="t2"><i class="fa fa-brand fa-youtube"></i> Cocomelon</div>
            <div class="embed_count odometer" id="e2"></div>
        </div>
        <div class="embed_box">
            <img class="embed_img" id="p3">
            <div class="embed_title" id="t3"><i class="fa fa-brand fa-youtube"></i> PewDiePie</div>
            <div class="embed_count odometer" id="e3"></div>
        </div>
        <div class="embed_box">
            <img class="embed_img" id="p4">
            <div class="embed_title" id="t4"><i class="fa fa-brand fa-youtube"></i> Kids Diana Show</div>
            <div class="embed_count odometer" id="e4"></div>
        </div>
    </div>
    <div class="container_right">
        <div class="count_box">
            <img class="banner" id="banner2">
            <img class="profile_img" id="pfp2">
            <h1 id="title_2"></h1>
            <h2 class="odometer" id="sub_2"></h2>
            <div class="sec_container">
                <div class="sec_box">
                    <h3 class="odometer" id="view2"></h3>
                    <h4><i class="fa fa-regular fa-eye"></i> Channel Views</h4>
                </div>
                <div class="sec_box">
                    <h3 class="odometer" id="vid2"></h3>
                    <h4><i class="fa fa-regular fa-video"></i> Videos</h4>
                </div>
            </div>
            <div class="sec_container">
                <div class="sec_box">
                    <h3 class="odometer" id="hr2"></h3>
                    <h4><i class="fa fa-regular fa-flame"></i> 1 Hr Gain</h4>
                </div>
                <div class="sec_box">
                    <h3 class="odometer" id="day2"></h3>
                    <h4><i class="fa fa-regular fa-line-chart"></i> 1 Day Gain</h4>
                </div>
            </div>
        </div>
        <div class="bottom_box"></div>
    </div>
</body>

<script>
    var id1="UClgRkhTL3_hImCAmdLfDE4g"
    var id2="UCX6OQ3DkcsbYNE6H8uQQuVA"
    var gap01=""; gap02="";

    const banner1 = document.getElementById("banner1")
    const banner2 = document.getElementById("banner2")
    const list = [];
    const list1 = [];

    function subwars() {
        fetch('https://api.twitch.tv/helix/users/follows?to_id=750736092&first=1', {
            headers: {
                'Client-ID': 'lkcbcha1jh4q70evrikggligbkbhpx',
                Authorization: 'Bearer jhzd56afyx4rgutfdrsmuavwh5uvd9'
            }
        }).then(res => res.json()).then(data => {
            swtwitch.innerHTML = data.total
        });
        fetch('https://testapi.subscriberwars.repl.co').then(res => res.json()).then(data => {
            t1.innerHTML=data.channel[0].name
            t2.innerHTML=data.channel[1].name
            t3.innerHTML=data.channel[2].name
            t4.innerHTML=data.channel[3].name
            p1.src=data.channel[0].pfp
            p2.src=data.channel[1].pfp
            p3.src=data.channel[2].pfp
            p4.src=data.channel[3].pfp
            e1.innerHTML=data.channel[0].subs
            e2.innerHTML=data.channel[1].subs
            e3.innerHTML=data.channel[2].subs
            e4.innerHTML=data.channel[3].subs
        });
    }
    subwars()
    
    function load() {
        banner1.src='https://www.banner.yt/'+id1+'?width=1240';
        banner2.src='https://www.banner.yt/'+id2+'?width=1240';
        fetch('https://stream.subscriberwars.repl.co/stream/'+id1).then(res => res.json()).then(data => {
            pfp1.src=data.pfp
            title_1.innerHTML=data.name
            sub_1.innerHTML=data.estCounts[0]
            view1.innerHTML=data.estCounts[1]
            vid1.innerHTML=data.apiCounts[2]
            gap01=data.estCounts[0]
        });
        fetch('https://stream.subscriberwars.repl.co/stream/'+id2).then(res => res.json()).then(data => {
            pfp2.src=data.pfp
            title_2.innerHTML=data.name
            sub_2.innerHTML=data.estCounts[0]
            view2.innerHTML=data.estCounts[1]
            vid2.innerHTML=data.apiCounts[2]
            gap02=data.estCounts[0]
            diff.innerHTML=gap01-gap02
         });
    }
    load()

    function main() {
        fetch('https://stream.subscriberwars.repl.co/stream/'+id1).then(res => res.json()).then(data => {
            sub_1.innerHTML=data.estCounts[0]
            view1.innerHTML=data.estCounts[1]
            vid1.innerHTML=data.apiCounts[2]
            gap01=data.estCounts[0]
            list.unshift(data.estCounts[0])//unshift: adds to start. push: adds to end
        if (list.length>43200){list.pop()}//shift: removes start. //pop: removes end
        if (list.length>=1800) {hr1.innerHTML= data.estCounts[0]-list[1799]}
        if (list.length>=43199) {day1.innerHTML=data.estCounts[0]-list[43199]}
        });
        fetch('https://stream.subscriberwars.repl.co/stream/'+id2).then(res => res.json()).then(data => {
            sub_2.innerHTML=data.estCounts[0]
            view2.innerHTML=data.estCounts[1]
            vid2.innerHTML=data.apiCounts[2]
            gap02=data.estCounts[0]
            diff.innerHTML=gap01-gap02
            list1.unshift(data.estCounts[0])//unshift: adds to start. push: adds to end
        if (list1.length>43200){list1.pop()}//shift: removes start. //pop: removes end
        if (list1.length>=1800) {hr2.innerHTML= data.estCounts[0]-list1[1799]}
        if (list1.length>=43199) {day2.innerHTML=data.estCounts[0]-list1[43199]}
        }); 
    }

    setInterval(() => {
        load()
    }, 3600000);

    setInterval(() => {
        main()
    }, 2000);

    setInterval(() => {
        subwars()
    }, 10000);

</script>
