<style>
    @font-face{
    font-family: bank-gothic;
    src: url('/css/bank_gothic.woff') format('woff');
    }
    body {
        background: #0f0f0f;
        font-family: bank-gothic;
        color: #fff;
        width: 1920px;
        height: 1080px;
        border: 1px dashed #e71414;
    }
    .container {
        width: 1920px;
        height: 470px;
        display: flex;
    }
    .container2 {
        width: 400px;
        height: 460px;
        margin-right: 10px;
    }
    .container3 {
        width: 1920px;
        height: 100px;
        display: flex;
    }
    .main-box {
        text-align: center;
        width: 718px;
        height: 438px;
        background: #000;
        padding: 10px;
        margin-top: 10px;
        margin-left: 10px;
        border: #636363 solid 1px;
        border-radius: 10px;
    }
    .mid-box {
        width: 378px;
        height: 118px;
        padding: 10px;
        background: #000;
        margin-top: 10px;
        margin-left: 10px;
        border: #636363 solid 1px;
        border-radius: 10px;
        text-align: center;
    }
    .mid-box-2 {
        width: 378px;
        height: 288px;
        padding: 10px;
        background: #000;
        margin-top: 10px;
        margin-left: 10px;
        border: #636363 solid 1px;
        border-radius: 10px;
        text-align: center;
    }
    .box-container {
        height: 150px;
        text-align: left;
    }
    .main-img {
        width: 148px;
        height: 148px;
        border-radius: 10%;
        border: 1px solid #636363;
        margin-right: 10px;
    }
    .mini-img {
        width: 98px;
        height: 98px;
        border-radius: 10%;
        border: 1px solid #636363;
        margin-right: 10px;
    }
    h1 {
        font-size: 70px;
        top: -190px;
        left: 160px;
        position: relative;
    }
    h2 {
        font-size: 40px;
        position: relative;
        left: 160px;
        top: -220px;
    }
    h3 {
        font-size: 90px;
    }
    h4 {
        font-size: 40px;
        position: relative;
        left: 300px;
        top: -345px;
    }
    h5 {
        font-size: 40px;
        position: relative;
        top: -70px;
    }
    .minibox {
        height: 100px;
        width: 350px;
        padding: 10px;
        background: #000;
        margin-top: 10px;
        margin-left: 10px;
        border: #636363 solid 1px;
        border-radius: 10px;
        text-align: center;
    }
</style>

<head>
    <title>Stream</title>
    <link rel="stylesheet" href="/css/odometer.css">
    <script src="/js/odometer.js"></script>
</head>

<body>
    <div class="container">
        <div class="main-box">
            <div class="box-container">
                <img class="main-img" id="img1">
                <h1 id="title1">User</h1>
                <h2>Tweets:</h2>
                <h4 class="odometer" id="view1">0</h4>
            </div>
            <h3 class="odometer" id="count1">0</h3>
        </div>
        <div class="container2">
            <div class="mid-box">
                <h5>Follower Gap</h5>
                <h5 class="odometer" id="gap1" style="top: -180px;"></h5>
            </div>
            <div class="mid-box-2">
                <img src="/images/twitter.svg" style="width: 200px;">
                <h5 style="font-size: 70px;">Twitter</h5>
            </div>
        </div>
        <div class="main-box">
            <div class="box-container">
                <img class="main-img" id="img2">
                <h1 id="title2">User</h1>
                <h2>Tweets:</h2>
                <h4 class="odometer" id="view2">0</h4>
            </div>
            <h3 class="odometer" id="count2">0</h3>
        </div>
    </div>
    <div class="container">
        <div class="main-box">
            <div class="box-container">
                <img class="main-img" id="img3">
                <h1 id="title3">User</h1>
                <h2>Likes:</h2>
                <h4 class="odometer" id="view3">0</h4>
            </div>
            <h3 class="odometer" id="count3">0</h3>
        </div>
        <div class="container2">
            <div class="mid-box">
                <h5>Follower Gap</h5>
                <h5 class="odometer" id="gap2" style="top: -180px;"></h5>
            </div>
            <div class="mid-box-2">
                <img src="/images/tiktok.svg" style="width: 200px;">
                <h5 style="font-size: 70px; position: relative; top: -120px;">TikTok</h5>
            </div>
        </div>
        <div class="main-box">
            <div class="box-container">
                <img class="main-img" id="img4">
                <h1 id="title4">User</h1>
                <h2>Likes:</h2>
                <h4 class="odometer" id="view4">0</h4>
            </div>
            <h3 class="odometer" id="count4">0</h3>
        </div>
    </div>
    <div class="container3">
        <div class="minibox">
            <h5>Likes</h5>
            <h5 class="odometer" style="position: relative; top: -190px;" id="likes"></h5>
        </div>
        <div class="minibox">
            <h5>Views</h5>
            <h5 class="odometer" style="position: relative; top: -190px;" id="views"></h5>
        </div>
        <div class="minibox">
            <h5>viewers</h5>
            <h5 class="odometer" style="position: relative; top: -190px;" id="viewers"></h5>
        </div>
        <div class="minibox">
            <h5>Subscribers</h5>
            <h5 class="odometer" style="position: relative; top: -190px;" id="subs"></h5>
        </div>
        <div class="minibox">
            <h5>Channel Views</h5>
            <h5 class="odometer" style="position: relative; top: -190px;" id="chanviews"></h5>
        </div>
    </div>
</body>

<script>
    var channel = window.location.href.split('?s=')[1] || '';
    var gap01="";
    var gap02="";
    var gap03="";
    var gap04="";
    function update() {
        fetch('https://api.subscriberwars.space/twitter/2/user/barackobama').then(res=>res.json()).then(data=>{
            title1.innerHTML= data.name
            img1.src= data.profile_image.replace("normal","400x400")
            view1.innerHTML= data.tweet_count
            count1.innerHTML= data.followers_count
            gap01= data.followers_count
        })
        fetch('https://api.subscriberwars.space/twitter/3/user/elonmusk').then(res=>res.json()).then(data=>{
            title2.innerHTML= data.name
            img2.src= data.profile_image.replace("normal","400x400")
            view2.innerHTML= data.tweet_count
            count2.innerHTML= data.followers_count
            gap02= data.followers_count
            if(gap01>gap02){gap1.innerHTML=gap01-gap02} else{gap1.innerHTML=gap02-gap01}
        })
        fetch('https://api.subscriberwars.space/tiktok/v2/21609287').then(res=>res.json()).then(data=>{
            title3.innerHTML= data.nickname
            img3.src= data.pfp
            view3.innerHTML= data.likes
            count3.innerHTML= data.followers+50000
            gap03= data.followers
        })
        fetch('https://api.subscriberwars.space/tiktok/v2/97614653324771328').then(res=>res.json()).then(data=>{
            title4.innerHTML= data.nickname
            img4.src= data.pfp
            view4.innerHTML= data.likes
            count4.innerHTML= data.followers+50000
            gap04= data.followers
            if(gap03>gap04){gap2.innerHTML=gap03-gap04} else{gap2.innerHTML=gap04-gap03}
        })
    }
    function sw(stid) {
        fetch('https://api.subscriberwars.space/sw/30day').then(res=>res.json()).then(data=>{
            subs.innerHTML = data.totals.subscribers
            chanviews.innerHTML = data.totals.views
        })
        fetch('https://api.subscriberwars.space/youtube/livestream/'+stid).then(res=>res.json()).then(data=>{
            likes.innerHTML = data.statistics.likeCount
            views.innerHTML = data.statistics.viewCount
            viewers.innerHTML = data.statistics.concurrentViewers
            
        })
    }
    update()
    sw(channel)
    setInterval(() => {
        update()
    }, 2000);
    setInterval(() => {
        sw(channel)
    }, 20000);
</script>
