<!DOCTYPE html>

<body style="background-color:transparent;">
    <br>
    <img id=thumbnailmax src="" width=400 height=225><br>
    <div id=vidtitle style=" position:absolute; left: 420px; top: 20px; height: 225px; width: 550px; font-size: 50px; color: white;">Loading Latest Video...</div><br>
    <div id="viewsOdometer" class=odometer style="width: 1000px; font-size: 150px; color: white; display: block; text-align: center;">0</div><br>
    <div style="width: 1000px; font-size: 40px; color: white; display: block; text-align: center;">Views</div><br>
    <div>
       <div id="likesOdometer" class=odometer style="width:500px; font-size: 60px; color: rgb(255, 255, 255); display: block; text-align: center;">0</div><br>
       <div style="width: 500px; font-size: 40px; color: rgb(255, 255, 255); display: block; text-align: center;">Likes</div><br>
       <div id="commentsOdometer" class=odometer style="position: relative; left: 480px; top: -160px; width: 500px; font-size: 60px; color: rgb(255, 255, 255); display: block; text-align: center;">0</div><br>
       <div style="position: relative; left: 480px; top: -160px; width: 500px; font-size: 40px; color: rgb(255, 255, 255); display: block; text-align: center;">Comments</div><br>
    </div>
    <div id="viewsOdometerapi" class=odometer style="width: 1000px; font-size: 150px; color: white; display: block; text-align: center; position: relative; top: -100px;">0</div><br>
    <div style="width: 1000px; font-size: 40px; color: white; display: block; text-align: center; position: relative; top: -100px;">Views</div><br>
</body>

<script>
var newestvidID = ''
var channel = window.location.href.split('?')[1] || '';

function checkForNew(chanid) { // replace UC with UU
    fetch('https://www.googleapis.com/youtube/v3/playlistItems?part=contentDetails&maxResults=20&playlistId='+chanid+'&key=AIzaSyB47DvlsNCPSJ6wVTfTTvO8y4mUnOQEO0A').then(res => res.json()).then(data => {
        newestvidID = data.items[0].contentDetails.videoId
    });
}

function updateStats(id) {
    fetch('https://mixerno.space/api/youtube-video-counter/user/'+id).then(res => res.json()).then(data => {
        vidtitle.innerHTML = data.user[0].count,
        viewsOdometer.innerHTML = data.counts[0].count,
        viewsOdometerapi.innerHTML = data.counts[2].count,
        likesOdometer.innerHTML = data.counts[3].count,
        commentsOdometer.innerHTML= data.counts[5].count,
        thumbnailmax.src = data.user[1].count
    }); 
}

setInterval(() => {
    updateStats(newestvidID);
}, 2000);

checkForNew(channel)
updateStats(newestvidID)

setInterval(() => {
    checkForNew(channel);
}, 15000);
</script>
