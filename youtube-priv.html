<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <title>YouTube OAuth</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
    <script src="main.js"></script>
    <script async defer src="https://apis.google.com/js/api.js" onload="this.onload=function(){};handleClientLoad()" onreadystatechange="if(this.readyState==='complete')this.onload()"></script>
</head>
<style>
    #content, #authorize-button, #signout-button {display: none}
</style>
<body>
    <nav class="black">
        <div class="nav-wrapper">
            <div class="container">
                <a href="#!" class="brand-logo">YouTube OAuth</a>
            </div>
        </div>
    </nav>
    <br>
    <section>
        <div class="container">
            <p>Log In</p>
            <button class="btn red" id="authorize-button">Log In</button>
            <button class="btn red" id="signout-button">Log Out</button>
            <br>
            <div id="content">
                <div class="row">
                    <div class="col s6">
                        <form id="channel-form">
                            <div class="input-field col s6">
                                <input type="text" placeholder="Channel Name" id="channel-input">
                                <input type="submit" value="Run" class="btn grey lighten-2">
                            </div>
                        </form>
                    </div>
                    <div class="col s6" id="channel-data"></div>
                </div>
                <div class="row" id="video-container"></div>
            </div>
        </div>
    </section>
</body>
</html>
