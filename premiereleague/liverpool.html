<head>
    <title>Liverpool's Premiere League Statistics</title>
    <link rel='stylesheet' href='prem.css'>
</head>

<body>
    <div style='clear:both'></div>
    <div id='top-header'>
        <img id='top-header-background' src='https://www.banner.yt/UC9LQwHZoucFT94I2h6JOcjw?width=1280'>
    </div>
    <div id='UserTopInfoWrap'>
        <img id='UserTopInfoAvatar' src='https://ssl.gstatic.com/onebox/media/sports/logos/0iShHhASp5q1SL4JhtwJiw_96x96.png'>
        <div id='UserTopInfoBlockTop'>
            <div>
                <h1 style='float: left; font-size: 1.4em; font-weight: bold; color:rgb(255, 255, 255); margin: 0px; padding: 0px; margin-right: 5px;'>Liverpool F.C.</h1>
            </div>
            <br>
            <br>
            <div style='clear:both'></div>
            <div id="UserTopInfoBlock">
                <div class="UserTopInfo">
                    <span class="UserTopLight">Played</span><br>
                    <span style="font-weight: bold;">10</span>
                </div>
                <div class="UserTopInfo">
                    <span class="UserTopLight">Points</span><br>
                    <span style="font-weight: bold;">22</span> 
                </div>
                <div class="UserTopInfo">
                    <span class="UserTopLight">Won</span><br>
                    <span style="font-weight: bold;">6</span>
                </div>
                <div class="UserTopInfo">
                    <span class="UserTopLight">Drew</span><br>
                    <span style="font-weight: bold;">4</span>
                </div>		
                <div class="UserTopInfo">
                    <span class="UserTopLight">Lost</span><br>
                    <span style="font-weight: bold;">0</span>
                </div>
                <div class="UserTopInfo">
                    <span class="UserTopLight">Goals For</span><br>
                    <span style="font-weight: bold;">29</span>
                </div>
                <div class="UserTopInfo">
                    <span class="UserTopLight">Goals Against</span><br>
                    <span style="font-weight: bold;">8</span>
                </div>
                <div class="UserTopInfo">
                    <span class="UserTopLight">Goal Difference</span><br>
                    <span style="font-weight: bold;">21</span>
                </div>			   
            </div>
        </div>
    </div>
    <br>
    <div style='width:1260px; margin: 0px auto;'>
        <div id='UserContainer;'>
            <div id='UserContent'>
                <div style='float: left; width: 1260px; height: 150px;'>
                    <div style='float: left; width: 122px; height: 120px; padding: 10px; background: #1ef900; border-radius: 4px;'>
                        <div style='width: 122px; height: 80px; margin-top: 10px; line-height: 80px; text-align: center; color: #fff; font-size: 4.4em; font-weight: bold; background: #1ef900;'>2nd</div>
                        <div style='width: 120px; height: 20px; margin-top: 0px; text-align: center; font-size: 12pt; color: #fff; background: #1ef900;'>
                            <span style="text-transform: uppercase; background: #1ef900;">Position</span>
                        </div>
                    </div>
                    <div style='float: right; width: 1080px; height: 120px; padding: 10px; background: rgb(26,26,26);'>
                        <div style='height: 110px; width: 530px; float: left; border-right: 1px solid #333333;'>
                            <div style='width: 532px; text-align: center; margin-top: 30px;'>
                                <p style='font-size: 1.5em; color: #fff; font-weight: 600;'>Draw</p>
                            </div>
                            <div style='width: 532px; text-align: center;'>
                                <span style='text-transform: uppercase; font-size: 12pt; color: rgb(194, 194, 194);'>Latest Game Result</span>
                            </div>
                        </div>
                        <div style='height: 110px; width: 530px; float: left;'>
                            <div style='width: 532px; text-align: center; margin-top: 30px;'>

                            <div style='width: 532px; text-align: center;'>
                                <span style='text-transform: uppercase; font-size: 12pt; color: rgb(194, 194, 194);'>Zone</span>
                            </div>
                        </div>
                    </div>
                    <div style='float:left; width: 1260px; height: 60px; background: rgb(26,26,26); margin-top: 20px;'>
                        <div style='float: left; width: 300px; padding: 10px 20px; font-size: 30px;'>
                            <span style="color: #fff; font-weight: 600;">Coming Soon</span>
                            <span style="color: #fff; font-size: 10px;">I think</span>
                        </div>    
                </div>
