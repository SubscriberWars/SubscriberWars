<style>
    body {
        background: #171717;
        color: #f5f5f5;
        margin: 0;
        font-family: roboto;
    }

    .head {
        width: 100%;
        height: 60px;
        background-image: linear-gradient(to right, #2700ff, #4c2588);
        overflow: hidden;
        border-bottom: 1px solid #000;
    }

    .head_text {
        text-align: center;
        vertical-align: middle;
        font-weight: 500;
        font-size: 3rem;
    }

    .main_box {
        width: 1260px;
        height: 1050px;
        background: #262626;
        margin: auto;
        padding: 10px;
        margin-top: 20px;
        border: 1px solid #000;
        border-radius: 10px;
        text-align: center;
    }

    #channel_banner {
        width: 100%;
        border: 1px solid #000;
        border-radius: 10px;
        height: 208px;
    }

    #channel_title {
        font-size: 4rem;
        margin: 10px;
    }

    #channel_subscribers {
        font-size: 10rem;
        font-weight: 500;
        margin: 10px;
    }

    #subscribers {
        font-size: 2rem;
    }

    .bottom_data {
        width: 100%;
        height: 150px;
        display: flex;
    }

    .bottom_counts {
        margin: 5px;
        padding: 10px;
        width: 400px;
        height: 130px;
        background: #181818;
        border-radius: 10px;
        overflow: hidden;
    }

    .bottom_odometer {
        font-weight: 500;
        font-size: 3rem;
    }

    .bottom_text {
        font-size: 2rem;
        margin-top: 20px;
    }

    ::-webkit-scrollbar {
        width: 5px;
    }

    ::-webkit-scrollbar-track {
        border-radius: 2.5px;
    }

    ::-webkit-scrollbar-thumb {
        background: #2700ff;
        border-radius: 2.5px;
    }

    ::-webkit-scrollbar-thumb:hover {
        background: #4c2588;
        border-radius: 2.5px;
    }

    .button_box {
        width: 1260px;
        margin: auto;
        display: flex;
        position: relative;
        top: -30px;
    }

    .bott_button {
        width: 620px;
        margin: auto;
        background: #0f0f0f;
        color: #fff;
        height: 100px;
        font-size: 30px;
        border-radius: 10px;
        border: 1px solid #000;
    }

    .bott_button:hover {
        cursor: pointer;
        background: #000;
        border: 1px solid #fff;
    }

    .container {
        width: 1280px;
        display: flex;
        margin: auto;
        height: fit-content;
    }

    .tableBox {
        min-width: 610px;
        height: 666px;
        background: #262626;
        margin: auto;
        padding: 10px;
        margin-top: 20px;
        border: 1px solid #000;
        border-radius: 10px;
        text-align: left;
    }

    .tableTitle {
        display: inline-flex;
        font-size: 30pt;
    }

    .iconBG {
        border-radius: 10px;
        width: 50pt;
        height: 50pt;
        display: flex;
        justify-content: center;
        margin-right: 10px;
    }

    table {
        border-collapse: collapse;
        width: 100%;
        max-width: 800px;
        margin: 20px 0;
        font-size: 16pt;
    }

    td {
        border-bottom: 1px solid #000;
        padding: 8px;
        text-align: left;
        height: 56px;
    }

    tr:nth-child(even) {
        background-color: #151515;
    }

    tr:nth-child(odd) {
        background-color: #181818;
    }

    img.emote {
        width: 40px;
        height: 40px;
        vertical-align: middle;
    }
</style>

<script>

    // Store odometer instances and row references
    const odometers = {};
    const rows = {};
    let isBttvInitialized = false;
    let isffzInitialized = false;
    let isstvInitialized = false;
    let isttvInitialized = false;
    let ischattersInitialized = false;
    let ishashInitialized = false;
    let iscomInitialized = false;

    function initializechattersTable(data) {
        const tbody = document.querySelector('#chatters_table tbody');
        tbody.innerHTML = ''; // Clear only once

        data.chatters.forEach((emote, index) => {
            const row = document.createElement('tr');
            row.dataset.emoteId = emote.name; // Store emote ID for reference

            // Rank cell
            const rankCell = document.createElement('td');
            rankCell.textContent = index + 1;
            row.appendChild(rankCell);

            // Name cell
            const nameCell = document.createElement('td');
            nameCell.textContent = emote.name;
            row.appendChild(nameCell);

            // Amount cell with odometer
            const amountCell = document.createElement('td');
            const odometerDiv = document.createElement('div');
            odometerDiv.className = 'odometer';
            odometerDiv.id = `odometer-${emote.name}`;
            amountCell.appendChild(odometerDiv);
            row.appendChild(amountCell);

            // Add row to table
            tbody.appendChild(row);

            // Store row and create odometer
            rows[emote.id] = row;
            odometers[emote.id] = new Odometer({
                el: odometerDiv,
                value: emote.amount, // Start with actual value
                format: '(,ddd)',
                duration: 1000
            });
        });

    function updatechattersTable(data) {
        const tbody = document.querySelector('#chatters_table tbody');

        // Sort emotes by amount (descending)
        const sortedEmotes = [...data.chatters].sort((a, b) => b.amount - a.amount);

        // Update odometers and ranks, reorder rows
        sortedEmotes.forEach((emote, index) => {
            if (odometers[emote.name]) {
                // Update odometer value
                odometers[emote.name].update(emote.amount);

                // Update rank
                const row = rows[emote.name];
                const rankCell = row.cells[0]; // First cell is rank
                rankCell.textContent = index + 1;

                // Move row to correct position
                tbody.appendChild(row); // This reorders without rebuilding

        });
    }

    // Main load function
    function load() {
        fetch("https://api.subscriberwars.space/se/10")
            .then(res => res.json())
            .then(data => {
                channel_subscribers.innerHTML = data.total;
                uniqueChatters.innerHTML = data.unique;
                const subscriberCount = parseInt(data.total, 10);
                const sub0 = subscriberCount;

                if (sub0) {
                    const series = graph_0.series[0];
                    if (series.data.length >= 1800) {
                        series.data[0].remove();
                    }
                    series.addPoint([Date.now(), subscriberCount], true, false);
                    const allData = series.data.length > 0 ? series.data.map(point => point.y) : [subscriberCount];
                    const minDataPoint = Math.min(...allData);
                    graph_0.yAxis[0].update({ min: minDataPoint });
                }

                // Initialize or update
                if (!isBttvInitialized) {
                    initializeBttvTable(data);
                } else {
                    updateBttvTable(data);
                }
                if (!isffzInitialized) {
                    initializeffzTable(data);
                } else {
                    updateffzTable(data);
                }
                if (!isstvInitialized) {
                    initializestvTable(data);
                } else {
                    updatestvTable(data);
                }
                if (!isttvInitialized) {
                    initializettvTable(data);
                } else {

                }
                if (!ischattersInitialized) {
                    initializechattersTable(data);
                } else {
                    updatechattersTable(data);
                }
                if (!ishashInitialized) {
                    initializehashTable(data);
                } else {
                    updatehashTable(data);
                }
                if (!iscomInitialized) {
                    initializecomTable(data);
                } else {
                    updatecomTable(data);
                }
            })
            .catch(error => console.error('Error fetching data:', error));
    }
