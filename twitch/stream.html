<!DOCTYPE html>
<head>
    <title>Live Twitch viewer Count</title>
    <meta name="description" content="Live Twitch Statistics">
    <link rel="stylesheet" href="https://subscriberwars.space/css/odometer.css">
    <link rel="stylesheet" href="https://subscriberwars.space/css/main.css">
    <script src="https://subscriberwars.space/js/odometer.js"></script>
    <script src="https://code.highcharts.com/highcharts.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
    <div id="count-block">
        <img id="logo" src="https://subscriberwars.space/images/twitch.svg" alt="" style="width: 400px; border-radius: 10px; left: 34%;">
        <h1 id="title">Loading...</h1>
        <div id='viewcount' class="odometer odometer-auto-theme" style="font-size: 120pt; font-weight: 500; text-align: center; margin: 0px auto; margin-top: 10px; margin-bottom: 10px; position: relative; width: 1260px;">0</div>
        <h2>Viewers</h2>
    </div>
    <div id="mini-counts">
        <div id="like-box">
            <div id='user' style="font-size: 30pt; font-weight: 500; text-align: center; margin: 0px auto; margin-top: 10px; margin-bottom: 10px; position: relative; width: 411px;">0</div>
            <h2>Streamer</h2>
        </div>
        <div id="comment-box">
            <div id='game' style="font-size: 30pt; font-weight: 500; text-align: center; margin: 0px auto; margin-top: 10px; margin-bottom: 10px; position: relative; width: 411px;">Loading...</div>
            <h2>Category</h2>
        </div>
    </div>
    <div id="graph-block">
        <div id="graph" style="width: 1260px; height: 400px;"></div>
        <p id="graphstat" style="visibility: hidden;"></p>
    </div>
    <div style="width: 1260px; margin: 0px auto;">
        <div id="container">
            <div id="panel-left">
                <div style="float:left; width:560px;">
                    <div class="head-box">
                        <div id="name">
                            <a style="color: #fff; text-align: center;" href="https://subscriberwars.space/twitch/search">Change User</a>
                        </div>
                    </div>
                </div>
            </div>
            <div id="panel-right">
                <div style="float:left; width:560px;">
                    <div class="head-box">
                        <div id="name">
                            <a style="color: #fff; text-align: center;" href="https://subscriberwars.space">Home</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

<script>
var channel = window.location.href.split('?u=')[1] || '';

function update(chanid) {
    fetch('https://api.subscriberwars.space/twitch/stream/'+chanid)
    .then(res => res.json()).then(data => {
        title.innerHTML = data.data[0].title
        logo.src = data.data[0].thumbnail_url.replace("{width}","400").replace("{height}","225")
        viewcount.innerHTML = data.data[0].viewer_count
        user.innerHTML=data.data[0].user_name
        game.innerHTML=data.data[0].game_name
        graphstat.innerHTML = data.data[0].viewer_count
        var yep=(graphstat.innerHTML)
        console.log(yep)
        var injection=yep
        if(graph.series[0].points.length>=720)graph.series[0].data[0].remove();
        graph.series[0].addPoint([Date.now(),parseFloat(injection)])
    });
}

// Intervals
setInterval(() => {
    update(channel);
}, 6000);

update(channel)

</script>

<script>//graph styling
    var graph = new Highcharts.chart({
chart: {
renderTo: 'graph',
type: 'spline',
zoomType: 'x',
backgroundColor: 'transparent',
plotBorderColor: 'transparent'
},
title: {
text: ''
},
xAxis: {
type: 'datetime',
tickPixelInterval: 100,
gridLineColor: '#transparent',
labels: {
    style: {
        color: 'white'
    }
},
minorGridLineColor: '#transparent',
tickColor: 'white',
title: {
    style: {
        color: '#transparent'
    }
}
},
yAxis: {
title: {
  text: ''
},
gridLineColor: '#transparent',
labels: {
    style: {
        color: 'white'
    }
},
lineColor: 'white',
minorGridLineColor: 'transparent',
tickColor: 'white'
},
credits: {
enabled: true,
text: "Subscriberwars.space"
},
series: [{
showInLegend: false,
name: 'Followers',
marker: { enabled: false },
lineColor: '#a742f5'
}]
});
</script>
