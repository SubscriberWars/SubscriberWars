<head>
    <link href="https://fonts.googleapis.com/css?family=Roboto:100,200,300,400,500,600,700,800" rel="stylesheet"
        type="text/css">
    <link rel="stylesheet" href="/css/odometer.css">
    <link rel="stylesheet" href="/css/font.css">
    <script src="https://kit.fontawesome.com/93168af8d4.js" crossorigin="anonymous"></script>
    <script src="/js/odometer.js"></script>
    <title id="page_title"></title>
</head>

<style>
    * {
        scrollbar-width: auto;
        scrollbar-color: #76C945 #191919bb;
    }

    body {
        background-color: #0f0f0f;
        color: #eeee;
        font-feature-settings: "tnum";
        padding: 0;
        margin: 0;
        font-family: Montserrat;
    }

    .full_width_container {
        width: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    h1 {
        font-weight: 700;
        text-align: center;
        font-size: 40pt;
    }

    h2 {
        font-weight: 700;
        text-align: center;
        font-size: 30pt;
        margin: 10px;
    }

    p1,
    .users {
        font-weight: 600;
        font-size: 20pt;
        margin: 10px;
        max-width: 50%;
        overflow: wrap;
    }

    .quaddy {
        font-weight: 600;
        font-size: 20pt;
        margin: 10px;
    }


    .header {
        width: 100%;
        height: 69px;
        background-image: linear-gradient(to right, green, brown);
    }

    .full_width_box {
        width: 99%;
        height: 530px;
        margin: 15px auto;
        border: 1px solid black;
        background-color: #181818;
        border-radius: 20px;
    }

    .half_width_box {
        width: 49%;
        height: 320px;
        margin: 15px auto;
        border: 1px solid black;
        background-color: #181818;
        border-radius: 20px;
    }

    .user_box {
        width: 33.3%;
        height: 100px;
        border: 1px solid black;
        border-radius: 20px;
        margin: 10px 10px 0px 10px;
        background-color: #131313;
        display: flex;
        justify-content: left;
        align-items: center;
        flex-wrap: wrap;
    }

    .lone_box {
        width: 96%;
        height: 100px;
        border: 1px solid black;
        border-radius: 20px;
        margin: 10px 10px 0px 10px;
        background-color: #131313;
        display: flex;
        justify-content: left;
        align-items: center;
        flex-wrap: wrap;
    }

    .duo_box {
        width: 49%;
        height: 100px;
        border: 1px solid black;
        border-radius: 20px;
        margin: 10px 10px 0px 10px;
        background-color: #131313;
        display: flex;
        justify-content: left;
        align-items: center;
        flex-wrap: wrap;
    }

    .quad_box {
        width: 23%;
        height: 100px;
        border: 1px solid black;
        border-radius: 20px;
        margin: 10px 5px 0px 10px;
        background-color: #131313;
        display: flex;
        justify-content: left;
        align-items: center;
        flex-wrap: wrap;
    }

    .container_inner {
        display: flex;
        width: 100%;
        justify-content: center;
    }

</style>

<body>
    <div class="header">
        <h1>Faithful Stats</h1>
    </div>
    <div class="full_width_container">
        <div class="full_width_box">
            <div class="full_width_container">
                <h2>Users</h2>
            </div>
            <div class="container_inner">
                <div class="user_box">
                    <p1>Total:</p1>
                    <div class="odometer users" id="total"></div>
                </div>
                <div class="user_box">
                    <p1>Roles:</p1>
                    <div class="odometer users" id="roles"></div>
                </div>
                <div class="user_box">
                    <p1>Anonymous:</p1>
                    <div class="odometer users" id="anonymous"></div>
                </div>
            </div>
            <div class="container_inner">
                <div class="user_box">
                    <p1>Translator:</p1>
                    <div class="odometer users" id="translator"></div>
                </div>
                <div class="user_box">
                    <p1>Contributor:</p1>
                    <div class="odometer users" id="contributor"></div>
                </div>
                <div class="user_box">
                    <p1>Mods Contributor:</p1>
                    <div class="odometer users" id="mods_contributor"></div>
                </div>
            </div>
            <div class="container_inner">
                <div class="user_box">
                    <p1>Dev:</p1>
                    <div class="odometer users" id="dev"></div>
                </div>
                <div class="user_box">
                    <p1>Admin:</p1>
                    <div class="odometer users" id="admin"></div>
                </div>
                <div class="user_box">
                    <p1>Add-on Maker:</p1>
                    <div class="odometer users" id="addon_maker"></div>
                </div>
            </div>
            <div class="container_inner">
                <div class="user_box">
                    <p1>VIP:</p1>
                    <div class="odometer users" id="vip"></div>
                </div>
                <div class="user_box">
                    <p1>Art Director Council:</p1>
                    <div class="odometer users" id="adc"></div>
                </div>
                <div class="user_box">
                    <p1>Mod:</p1>
                    <div class="odometer users" id="mod"></div>
                </div>
            </div>
        </div>
    </div>
    <div class="full_width_container">
        <div class="half_width_box">
            <h2>Add-Ons</h2>
            <div class="container_inner">
                <div class="lone_box">
                    <p1>Approved:</p1>
                    <div class="odometer users" id="approved"></div>
                </div>
            </div>
            <div class="container_inner">
                <div class="quad_box">
                    <p1>Java:</p1>
                    <div class="odometer quaddy" id="java"></div>
                </div>
                <div class="quad_box">
                    <p1>Bedrock:</p1>
                    <div class="odometer quaddy" id="bedrock"></div>
                </div>
                <div class="quad_box">
                    <p1>32x:</p1>
                    <div class="odometer quaddy" id="x32"></div>
                </div>
                <div class="quad_box">
                    <p1>64x:</p1>
                    <div class="odometer quaddy" id="x64"></div>
                </div>
            </div>
        </div>
        <div class="half_width_box">
            <h2>Contributions</h2>
            <div class="container_inner">
                <div class="duo_box">
                    <p1>Total:</p1>
                    <div class="odometer quaddy" id="total_cont"></div>
                </div>
                <div class="duo_box">
                    <p1>Last 48 hrs:</p1>
                    <div class="odometer quaddy" id="two_cont"></div>
                </div>
            </div>
            <div class="container_inner">
                <div class="duo_box">
                    <p1>Last Week:</p1>
                    <div class="odometer quaddy" id="week_cont"></div>
                </div>
                <div class="duo_box">
                    <p1>Last Month:</p1>
                    <div class="odometer quaddy" id="month_cont"></div>
                </div>
            </div>
        </div>
    </div>
</body>

<script>
    function api() {
        fetch("https://api.subscriberwars.space/faithful").then(res => res.json()).then(data => {
            translator.innerHTML = data.users.total_per_roles["Translator"]
            contributor.innerHTML = data.users.total_per_roles["Contributor"]
            mods_contributor.innerHTML = data.users.total_per_roles["Mods Contributor"]
            dev.innerHTML = data.users.total_per_roles["Developer"]
            admin.innerHTML = data.users.total_per_roles["Administrator"]
            addon_maker.innerHTML = data.users.total_per_roles["Add-on Maker"]
            vip.innerHTML = data.users.total_per_roles["VIP"]
            adc.innerHTML = data.users.total_per_roles["Art Director Council"]
            mod.innerHTML = data.users.total_per_roles["Moderator"]
            total.innerHTML = data.users.total
            roles.innerHTML = data.users.total_roles
            anonymous.innerHTML = data.users.total_anonymous
            approved.innerHTML = data.addons.approved
            java.innerHTML = data.addons.numbers["Java"]
            bedrock.innerHTML = data.addons.numbers["Bedrock"]
            x32.innerHTML = data.addons.numbers["32x"]
            x64.innerHTML = data.addons.numbers["64x"]
            total_cont.innerHTML = data.contributions.total_contributions
            two_cont.innerHTML = data.contributions.total_last_day
            week_cont.innerHTML = data.contributions.total_last_week
            month_cont.innerHTML = data.contributions.total_last_month
        })
    }
    api()
</script>
