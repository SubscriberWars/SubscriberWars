<script>
    var id1="UCpEhnqL0y41EpW2TvWAHD7Q"
    var id2="UCX6OQ3DkcsbYNE6H8uQQuVA"

    var socialblade1="";
    var socialblade2="";

    const banner1 = document.getElementById("banner1")
    const banner2 = document.getElementById("banner2")
    var gap01=""; gap02=""; injection3="";
    const list = [];
    const list1 = [];

    function load() {
        banner1.src='https://www.banner.yt/'+id1+'?width=1240';
        banner2.src='https://www.banner.yt/'+id2+'?width=1240';
        fetch('https://api.subscriberwars.space/youtube/channel/v2/'+id1).then(res => res.json()).then(data => {
        title1.innerHTML = data.items[0].snippet.title
        pfp1.src = data.items[0].snippet.thumbnails.medium.url
        });
        fetch('https://api.subscriberwars.space/youtube/channel/v2/'+id2).then(res => res.json()).then(data => {
        title2.innerHTML = data.items[0].snippet.title
        pfp2.src = data.items[0].snippet.thumbnails.medium.url
        });
        fetch('https://api.subscriberwars.space/sb/yt/'+id1).then(res => res.json()).then(data => {
            socialblade1=data.data.statistics.growth.subs[1]
        });
        fetch('https://api.subscriberwars.space/sb/yt/'+id2).then(res => res.json()).then(data => {
            socialblade2=data.data.statistics.growth.subs[1]
        });
    }

    function main() {
        fetch('https://api.subscriberwars.space/stream/'+id1).then(res => res.json()).then(data => {
        x1.innerHTML = data.estCounts[1]
        x2.innerHTML = data.apiCounts[2]
        subs1.innerHTML = data.estCounts[0]
        gap01=data.estCounts[0]
        list.unshift(data.estCounts[0])//unshift: adds to start. push: adds to end
        if (list.length>43200){list.pop()}//shift: removes start. //pop: removes end
        if (list.length>=1800) {x5.innerHTML= data.estCounts[0]-list[1799]}
        if (list>=43199) {x6.innerHTML=data.estCounts[0]-list[43199]} else{x6.innerHTML=socialblade1}
        });
        fetch('https://api.subscriberwars.space/stream/'+id2).then(res => res.json()).then(data => {
        x3.innerHTML = data.estCounts[1]
        x4.innerHTML = data.apiCounts[2]
        subs2.innerHTML=data.estCounts[0]
        gap02=data.estCounts[0]
        list1.unshift(data.estCounts[0])//unshift: adds to start. push: adds to end
        if (list1.length>43200){list1.pop()}//shift: removes start. //pop: removes end
        if (list1.length>=1800) {x7.innerHTML= data.estCounts[0]-list1[1799]}
        if (list1>=43199) {x8.innerHTML=data.estCounts[0]-list1[43199]} else{x8.innerHTML=socialblade2}
        if(gap01>gap02){injection3=gap01-gap02} else{injection3=gap02-gap01}
        diff.innerHTML=injection3
        });
    }

    function gap() {
        if(graph3.series[0].points.length>=1800)graph3.series[0].data[0].remove();
        graph3.series[0].addPoint([Date.now(),parseFloat(injection3)])
    }

    function subwars() {
        fetch('https://api.subscriberwars.space/sw/30day').then(res => res.json()).then(data => {
            sw.innerHTML = data.totals.subscribers
        });
        fetch('https://api.subscriberwars.space/twitch/750736092').then(res => res.json()).then(data => {
            swtwitch.innerHTML = data.followerCount
        });
        fetch('https://kick.com/api/v1/channels/jaymburtonsw').then(res => res.json()).then(data => {
            swkick.innerHTML = data.followersCount
        });
    }
    function socialblade() {
        
    }

    load()
    subwars()

    setInterval(() => {
        subwars()
    }, 10000);

    setTimeout(() => {
        setInterval(() => {
           main() 
        }, 2000);
    }, 5000);

    setTimeout(() => {
        setInterval(() => {
           gap() 
        }, 2000);
    }, 8000);

    setInterval(() => {
           load() 
        }, 1800000);

    

</script>
