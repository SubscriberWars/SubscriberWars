<!DOCTYPE html>

<script src="https://code.highcharts.com/stock/highstock.js"></script>
<div id="chart" style="width:400px; height:350px"></div>	

<script type="text/javascript">

var chart = Highcharts.chart({
chart: {renderTo: 'chart',type: 'line',zoomType: 'x',backgroundColor: '#000',plotBorderColor: 'transparent'},
title: {text: ''},
xAxis: {type: 'datetime', tickPixelInterval: 100, gridLineColor: '#transparent', labels: {style: {color: 'white'}}, minorGridLineColor: '#transparent', tickColor: 'white', title: {style: {color: '#transparent'}}},
yAxis: {title: {text: ''}, gridLineColor: '#212121', labels: {style: {color: 'white'}}, lineColor: 'white', minorGridLineColor: 'transparent', tickColor: 'white'},
credits: {enabled: false, text: ""},
plotOptions:{line:{fillOpacity: 1}},
series: [{showInLegend: false, name: '', marker: { enabled: false }, lineColor: '#8f00ff', color: '#8f00ff'}]
});

    var url0="https://api.subscriberwars.space/stream/UCq-Fj5jknLsUf-MWSy4_brA"
    var url1="https://api.subscriberwars.space/stream/UCX6OQ3DkcsbYNE6H8uQQuVA"

    var u0=[]
    var u1=[]
    var diff=[]
 
function getdata() {
    fetch(url0).then(res => res.json()).then(data => {
        u0=data.estCounts[0]
    })
    fetch(url1).then(res => res.json()).then(data => {
        u1=data.estCounts[0]
    })
}

function inject() {
    diff = u0-u1
    chart.series[0].addPoint([Date.now(),parseFloat(diff)])
}

getdata()
setTimeout(() => {
    inject()
}, 1000);
setInterval(() => {
    getdata()
    setTimeout(() => {
        inject()
    }, 1000);
}, 60000);
 
</script>
