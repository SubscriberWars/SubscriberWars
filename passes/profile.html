<body>
    <div class="head">
        <div class="head_text">Live Passes Profile Stats</div>
    </div>
    <div class="main_box">
        <img id="channel_banner" src="https://www.passes.com/img/profile/default-banner-image-dark.png">
        <img id="channel_image" src="https://www.passes.com/img/profile/default-profile-image-dark.svg">
        <div id="channel_title_container">
            <span id="channel_title"></span>
            <i class="fa fa-badge-check"  style="display: none;" id="verified_standard" title=""></i>
            <i class="fa fa-sharp fa-regular fa-gem"  style="display: none;" id="verified_advanced" title=""></i>
        </div>
        <div id="channel_subscribers" class="odometer"></div>
        <div id="subscribers"><i class="fa fa-sharp fa-users"></i> Followers</div>
        <div class="bottom_data">
            <div class="bottom_counts">
                <div class="odometer bottom_odometer" id="channel_views"></div>
                <div class="bottom_text"><i class="fa fa-sharp fa-thumbs-up"></i> Likes</div>
            </div>
            <div class="bottom_counts">
                <div class="odometer bottom_odometer" id="channel_videos"></div>
                <div class="bottom_text"><i class="fa fa-sharp fa-video"></i> Media</div>
            </div>
            <div class="bottom_counts">
                <div class="odometer bottom_odometer" id="channel_goal"></div>
                <div class="bottom_text"><i class="fa fa-sharp fa-address-card"></i> Posts</div>
            </div>
        </div>
        <div class="button_box">
            <a id="channel_link" target="_blank" style="margin: auto; width: 1260px;">
                <button class="bott_button">
                    Go To Profile
                </button>
            </a>
        </div>
    </div>
</body>

<style>
    body {

        color: #fff;

        overflow: hidden;
        border-bottom: 1px solid #000;

        text-align: center;
        vertical-align: middle;
        font-weight: 500;
        font-size: 3rem;
    }
    .main_box {
        width: 1260px;
        height: 825px;
        background: #0f0f0f;
        margin: auto;
        padding: 10px;
        margin-top: 20px;
        border: 1px solid #000;
        border-radius: 10px;
        text-align: center;
    }
    #channel_banner {
        width: 100%;
        border: 1px solid #000;
        border-radius: 10px;
        height: 208px;
    }
    #channel_image {
        width: 200px;
        height: 200px;
        border: 1px solid #000;
        border-radius: 10px;
        top: -100px;
        position: relative;
    }
    #channel_title_container {
        position: relative;
        top: -100px;
        font-size: 4rem;
    }
    #channel_subscribers {
        position: relative;
        top: -90px;
        font-size: 12rem;
        font-weight: 500;
    }
    #subscribers {
        position: relative;
        top: -80px;
        font-size: 2rem;
    }
    .bottom_data {
        width: 100%;
        height: 150px;
        position: relative;
        display: flex;
        top: -70px;
    }
    .bottom_counts {
        margin: 5px;
        padding: 10px;
        width: 400px;
        height: 130px;
        background: #000;
        border-radius: 10px;
    }
    .bottom_odometer {
        font-weight: 500;
        font-size: 3rem;
    }
    .bottom_text {
        font-size: 2rem;
        margin-top: 20px;
    }
    ::-webkit-scrollbar {
        width: 5px;
    }
    ::-webkit-scrollbar-track {
        border-radius: 2.5px;
    }
    ::-webkit-scrollbar-thumb {
        background: #000;
        border-radius: 2.5px;
    }
    ::-webkit-scrollbar-thumb:hover {
        background: #fff;
        border-radius: 2.5px;
    }
    .button_box {
        width: 1260px;
        margin: auto;
        display: flex;
        position: relative;
        top: -30px;
    }
    .bott_button {
        width: 620px;
        margin: auto;
        background: #0f0f0f;
        color: #fff;
        height: 100px;
        font-size: 30px;
        border-radius: 10px;
        border: 1px solid #000;
    }
    .bott_button:hover {
        cursor: pointer;
        background: #000;
        border: 1px solid #fff;
    }
</style>

<script>
    var channel = window.location.href.split('?u=')[1] || '';
    var string='';
    string +='';
    var veri="";
    var id="";

    function get(chanid) {
        fetch("https://api.subscriberwars.space/fanhouse/profile/"+chanid).then(res=>res.json()).then(data=>{
            id=data.user.userId
            page_title.innerHTML=data.user.displayName+"'s Live Follower Count"
            if (data.user.hasProfileImage==true){channel_image.src="https://cdn.passes.com/profile/media/"+data.user.userId+"/profile-image.jpeg"}
            if (data.hasBannerImage==true){channel_banner.src="https://cdn.passes.com/profile/media/"+data.user.userId+"/profile-banner.jpeg"}
            channel_title.innerHTML=data.user.displayName
            channel_link.href="https://passes.com/"+data.user.username
            if (data.user.verifiedIcon=="advanced") {document.getElementById("verified_advanced").style.display="inline"} else {document.getElementById("verified_advanced").style.width="0px"}
            if (data.user.verifiedIcon=="advanced") {document.getElementById("verified_advanced").title="This user is a VIP"}
            if (data.user.verifiedIcon=="basic") {document.getElementById("verified_standard").style.display="inline"} else {document.getElementById("verified_standard").style.width="0px"}
            if (data.user.verifiedIcon=="basic") {document.getElementById("verified_standard").title="This User is Verified"}
        })
    }

    function stats(chanid) {
        fetch("https://api.subscriberwars.space/fanhouse/stats/"+chanid).then(res=>res.json()).then(data=>{
            channel_subscribers.innerHTML=data.numFollowers
            channel_views.innerHTML=data.numLikes
            channel_videos.innerHTML=data.numMedia
            channel_goal.innerHTML=data.numPosts
        })
    }

    get(channel)
    setTimeout(() => {
        setInterval(() => {
            stats(id)
        }, 10000);
    }, 2000);

</script>
