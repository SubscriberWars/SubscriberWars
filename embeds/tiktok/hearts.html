<head>
    <title>Live Hearts Count</title>
    <meta name="description" content="Hearts Count">
    <link rel="stylesheet" href="https://subscriberwars.space/css/odometer.css">
    <link rel="stylesheet" href="https://subscriberwars.space/css/embed_profile.css">
    <script src="https://subscriberwars.space/js/odometer.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
</head>

<body>
    <img id="image">
    <span id="title"></span>
    <span id="count" class="odometer"></span>
</body>

<script>
    var userID = ''
var channel = window.location.href.split('?u=')[1] || '';

function checkForNew(chanid) {
    fetch('https://api.subscriberwars.space/tiktok/user/'+chanid+'').then(res => res.json()).then(data => {
        userID = data.id
        title.innerHTML = data.username
        image.src = data.avatar
    });
}


function updateStats(id) {
    fetch('https://api.subscriberwars.space/tiktok/'+id+'').then(res => res.json()).then(data => {
        count.innerHTML = data.hearts
    });
}

// Intervals
setInterval(() => {
    updateStats(userID);
}, 5000);

checkForNew(channel)

</script>
