<head>
    <title>Live Follower Count</title>
    <meta name="description" content="Follower Count">
    <link rel="stylesheet" href="https://subscriberwars.space/css/odometer.css">
    <link rel="stylesheet" href="https://subscriberwars.space/css/embed_profile.css">
    <script src="https://subscriberwars.space/js/odometer.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
</head>

<body>
    <img id="image">
    <span id="title"></span>
    <span id="count" class="odometer"></span>
</body>

<script>
    var twitchid = ''
    var channel = window.location.href.split('?u=')[1] || '';
    
    function checkForNew(chanid) {
        fetch('https://api.subscriberwars.space/twitch/user/'+chanid+'')
        .then(res => res.json()).then(data => {
            twitchid = data.iD
            title.innerHTML = data.name
            image.src = data.logo
        });
    }
    
    
    function updateStats(id) {
        fetch('https://api.subscriberwars.space/twitch/'+id+'')
        .then(res => res.json()).then(data => {
            count.innerHTML = data.followerCount
        });
    }
    
    // Intervals
    setInterval(() => {
        updateStats(twitchid);
    }, 5000);
    setInterval(() => {
        checkForNew(channel)
    }, 60000);
    
    checkForNew(channel)
    
    </script>
