<head>
    <title>Live Video Count</title>
    <meta name="description" content="Video Count">
    <link rel="stylesheet" href="https://subscriberwars.space/css/odometer.css">
    <link rel="stylesheet" href="https://subscriberwars.space/css/embed_profile.css">
    <script src="https://subscriberwars.space/js/odometer.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
</head>

<body>
    <img id="image">
    <span id="title"></span>
    <span id="count" class="odometer"></span>
</body>

<script>
    var channel = window.location.href.split('?u=')[1] || '';
    function stats(chanid){
        fetch('https://api-v6.mixerno.space/youtube-channel-counter/live/'+chanid).then(res => res.json()).then(data=>{
            image.src=data.profile_picture
            title.innerHTML=data.name
            count.innerHTML=data.videos
        })
    }
    setInterval(() => {
    stats(channel)
}, 2000)
stats(channel)
</script>
