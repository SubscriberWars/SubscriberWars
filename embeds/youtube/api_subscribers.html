<head>
    <title>Live API Subscriber Count</title>
    <meta name="description" content="Subscriber Count">
    <link rel="stylesheet" href="https://subscriberwars.space/css/embed_profile.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
</head>

<body>
    <img id="image">
    <span id="title"></span>
    <span id="count"></span>
</body>

<script>
    var string='';
    string +='';
    var channel = window.location.href.split('?u=')[1] || '';
    function stats(chanid){
        fetch('https://api-v6.mixerno.space/youtube-channel-counter/live/'+chanid).then(res => res.json()).then(data=>{
            image.src=data.profile_picture
            title.innerHTML=data.name
            if (data.subscribers_api<1000) {string=parseFloat(data.subscribers_api)}
            if (data.subscribers_api>1000) {string=parseFloat(data.subscribers_api/1000)}
            if (data.subscribers_api>1000) {string +='K'}
            if (data.subscribers_api>10000) {string=parseFloat(data.subscribers_api/1000)}
            if (data.subscribers_api>10000) {string +='K'}
            if (data.subscribers_api>100000) {string=parseFloat(data.subscribers_api/1000)}
            if (data.subscribers_api>100000) {string +='K'}
            if (data.subscribers_api>1000000) {string=parseFloat(data.subscribers_api/1000000)}
            if (data.subscribers_api>1000000) {string +='M'}
            if (data.subscribers_api>10000000) {string=parseFloat(data.subscribers_api/1000000)}
            if (data.subscribers_api>10000000) {string +='M'}
            if (data.subscribers_api>100000000) {string=parseFloat(data.subscribers_api/1000000)}
            if (data.subscribers_api>100000000) {string +='M'}
            count.innerHTML=string
        })
    }
    setInterval(() => {
    stats(channel)
}, 10000);
stats(channel)
</script>
