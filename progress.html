<style>
    body{background: #181818;}
    * {font-family: roboto;font-size: 40px;color: #FFF;font-weight: 500;}
    .border{border:1px solid rgb(255, 255, 255)!important; position: relative; left: 120px; top: 5px; border-radius: 10px;}
    .fill{color:#fff!important; height: 20px; border-radius: 10px;}
    </style>
    <div style="width: 800px;">
        <div class="border">
            <div class="fill" id="c" style="background-color: red;"></div>
        </div>
        <h1 id="first" style="color: #FFF; font-family: roboto; top: -55px; position: relative;"></h1>
        <h1 id="second" style="color: #FFF; font-family: roboto; top: -130px; left: 940px; position: relative;"></h1>
    </div>
    <div style="width: 800px;">
        <div class="border">
            <div class="fill" id="d" style="background-color: blue;"></div>
        </div>
        <h1 id="first2" style="color: #FFF; font-family: roboto; top: -55px; position: relative;"></h1>
        <h1 id="second2" style="color: #FFF; font-family: roboto; top: -130px; left: 940px; position: relative;"></h1>
    </div>
    
    <script>
    function bar() {
    var goal=0;
    var start=0;
    var now=0;
    fetch('https://api.subscriberwars.space/stream/UCq-Fj5jknLsUf-MWSy4_brA')
    .then(res=>res.json())
    .then(data=>{
        now=data.estCounts[0];
        start=parseInt(data.apiCounts[0])
        goal=start+1000000;
    })
    .then(()=>{
    var progress = (((((goal - start) / (1000 * 60)) - ((goal - now) / (1000 * 60))) / ((goal - start) / (1000 * 60))) * 100).toFixed(6);
    if (progress < goal) {
        document.getElementById('first').innerHTML = abbreviateNumber(start);
        document.getElementById('second').innerHTML = abbreviateNumber(goal);
        document.getElementById('c').style.width = ""+progress+"%"}
    else{
        document.getElementById('first').innerHTML = "100,000"
        document.getElementById('c').style.width = "100%"}
    })
    }

    function bar2() {
    var goal1=0;
    var start1=0;
    var now1=0;
    fetch('https://api.subscriberwars.space/stream/UCX6OQ3DkcsbYNE6H8uQQuVA')
    .then(res=>res.json())
    .then(data=>{
        now1=data.estCounts[0];
        start1=parseInt(data.apiCounts[0])
        goal1=start1+1000000})
    .then(()=>{
    var progress1 = (((((goal1 - start1) / (1000 * 60)) - ((goal1 - now1) / (1000 * 60))) / ((goal1 - start1) / (1000 * 60))) * 100).toFixed(6);
    if (progress1 < goal1) {
        document.getElementById('first2').innerHTML = abbreviateNumber(start1);
        document.getElementById('second2').innerHTML = abbreviateNumber(goal1);
        document.getElementById('d').style.width = ""+progress1+"%"}
    else{
        document.getElementById('first2').innerHTML = "100,000"
        document.getElementById('d').style.width = "100%"}
    })
    }

    function abbreviateNumber(number) {
    const SI_SYMBOLS = ["", "K", "M", "B", "T"];
    const tier = Math.log10(Math.abs(number)) / 3 | 0;
    const suffix = SI_SYMBOLS[tier];
    const abbreviatedNumber = (number / Math.pow(10, tier * 3)).toPrecision(3) + suffix;
    return abbreviatedNumber;
    }  

        setInterval(bar, 5000)
        setInterval(bar2, 5000)
        bar()
        bar2()
    </script>
