    }
    //30day
    if (list0.length>=43200) {
      const pass_12 = Math.round(diff/((((list1[0]-list1[43199])/43200)-((list0[0]-list0[43199])/43200))/60000))
      const d_12 = now+pass_12
      const d12 = new Date(d_12)
      var hours = d12.getUTCHours()
      var am_pm = hours>=12?'pm':'am';
      hours = (hours %12) || 12;
      if (d12.getUTCMinutes()<10) {minutes="0"+d12.getUTCMinutes()} else {minutes=d12.getUTCMinutes()}
      if (pass_12<=0){
        p13.innerHTML="Never";
        s13.innerHTML="";
      } else {
        p13.innerHTML= d12.getUTCDate()+months[d12.getUTCMonth()]+" @ "+hours+am_pm+" "+d12.getUTCFullYear()
        s13.innerHTML= abbreviateNumber(Math.round((pass_12/60000)*((list1[0]-list1[43199])/43200)+list1[0]))
      }
    }
}

//abbreviator
function abbreviateNumber(number) {
    const SI_SYMBOLS = ["", "K", "M", "B", "T"];
    const tier = Math.log10(Math.abs(number)) / 3 | 0;
    const suffix = SI_SYMBOLS[tier];
    const abbreviatedNumber = (number / Math.pow(10, tier * 3)).toPrecision(3) + suffix;
    return abbreviatedNumber;
}
