    function getTime(t) {
      var str = ['', '', '', '', '', ' seconds'];
      var s = t, m = '', h = '', d = '', m = '', y = '';
      if (t >= 60) {
        str[4] = ' minutes ';
        m = parseInt(t / 60);
        s -= m * 60;
      }
      if (t >= 3600) {
        str[3] = ' hours ';
        h = parseInt(t / 3600);
        m -= h * 60;
      }
      if (t >= 86400) {
        str[2] = ' days ';
        d = parseInt(t / 86400);
        h -= d * 24;
      }
      return d + str[2] + h + str[3] + m + str[4] + s + str[5]; //just add hours, days, months, etc
