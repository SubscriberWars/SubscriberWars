<head>
    <link href="https://fonts.googleapis.com/css?family=Roboto:100,200,300,400,500,600,700,800" rel="stylesheet" type="text/css">
    <link rel="stylesheet" href="/css/odometer.css">
    <script src="https://kit.fontawesome.com/93168af8d4.js" crossorigin="anonymous"></script>
    <script src="/js/odometer.js"></script>
    <title id="page_title"></title>
    <script src="https://code.highcharts.com/highcharts.js"></script>
</head>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-38E6Z6MEMP"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-38E6Z6MEMP');

<body>
    <div class="head">
        <div class="head_text">Minecraft Java Server Player Count</div>
    </div>
    <div class="main_box">
        <img id="channel_banner" src="/images/minecraft.svg">
        <img id="channel_image" src="/images/pfp_placeholder.png">
        <div id="channel_title_container">
            <div id="channel_title"></div>
        </div>
        <div id="channel_subscribers" class="odometer"></div>
        <div id="subscribers"><i class="fa fa-sharp fa-users"></i> Online Players</div>
        <div class="bottom_data">
            <div class="bottom_counts">
                <div class="bottom_odometer odometer" id="channel_views"></div>
                <div class="bottom_text"><i class="fa fa-sharp fa-users"></i> Max Players</div>
            </div>
            <div class="bottom_counts"></div>
            <div class="bottom_counts">
                <div class="bottom_odometer" id="channel_goal"></div>
            </div>
        </div>
    </div>
    <div class="graph_box">
        <div id="chart"></div>
        <p id="gdata" style="display: none;"></p>
    </div>
</body>

<style>
    body {
        background: #181818;
        color: #fff;
        margin: 0;
        font-family: roboto;
    }
    .head {
        width: 100%;
        height: 60px;
        background-image: linear-gradient(to right, #33ff00, #1d8702);
        overflow: hidden;
        border-bottom: 1px solid #000;
    }
    .head_text {
        text-align: center;
        vertical-align: middle;
        font-weight: 500;
        font-size: 3rem;
    }
    .main_box {
        width: 1260px;
        height: 825px;
        background: #0f0f0f;
        margin: auto;
        padding: 10px;
        margin-top: 20px;
        border: 1px solid #000;
        border-radius: 10px;
        text-align: center;
    }
    #channel_banner {
        width: 100%;
        border: 1px solid #000;
        border-radius: 10px;
        height: 208px;
    }
    #channel_image {
        width: 200px;
        height: 200px;
        border: 1px solid #000;
        border-radius: 10px;
        top: -100px;
        position: relative;
    }
    #channel_title_container {
        position: relative;
        top: -100px;
        font-size: 4rem;
    }
    #channel_subscribers {
        position: relative;
        top: -90px;
        font-size: 12rem;
        font-weight: 500;
    }
    #subscribers {
        position: relative;
        top: -80px;
        font-size: 2rem;
    }
    .bottom_data {
        width: 100%;
        height: 150px;
        position: relative;
        display: flex;
        top: -70px;
    }
    .bottom_counts {
        margin: 5px;
        padding: 10px;
        width: 400px;
        height: 130px;
        background: #000;
        border-radius: 10px;
        overflow: hidden;
    }
    .bottom_odometer {
        font-weight: 500;
        font-size: 3rem;
    }
    .bottom_text {
        font-size: 2rem;
        margin-top: 20px;
    }
    ::-webkit-scrollbar {
        width: 5px;
    }
    ::-webkit-scrollbar-track {
        border-radius: 2.5px;
    }
    ::-webkit-scrollbar-thumb {
        background: #33ff00;
        border-radius: 2.5px;
    }
    ::-webkit-scrollbar-thumb:hover {
        background: #1d8702;
        border-radius: 2.5px;
    }
    .button_box {
        width: 1260px;
        margin: auto;
        display: flex;
        position: relative;
        top: -30px;
    }
    .bott_button {
        width: 620px;
        margin: auto;
        background: #0f0f0f;
        color: #fff;
        height: 100px;
        font-size: 30px;
        border-radius: 10px;
        border: 1px solid #000;
    }
    .bott_button:hover {
        cursor: pointer;
        background: #000;
        border: 1px solid #fff;
    }
    .graph_box {
        width: 1260px;
        height: 400px;
        background: #0f0f0f;
        margin: auto;
        padding: 10px;
        margin-top: 20px;
        border: 1px solid #000;
        border-radius: 10px;
        text-align: center;
        margin-bottom: 20px;
    }
</style>

<script>
    var channel = window.location.href.split('?u=')[1] || '';
    document.addEventListener("DOMContentLoaded", function () {
        var chart;

        chart = Highcharts.chart({
            chart: {
                renderTo: 'chart',
                type: 'spline',
                zoomType: 'x',
                backgroundColor: 'transparent',
                plotBorderColor: 'transparent'
            },
            title: { text: '' },
            xAxis: {
                type: 'datetime',
                tickPixelInterval: 100,
                gridLineColor: '#transparent',
                labels: { style: { color: 'white' } },
                minorGridLineColor: '#transparent',
                tickColor: 'white',
                lineColor: 'white',
                title: { style: { color: '#transparent' } }
            },
            yAxis: {
                title: { text: '' },
                gridLineColor: '#transparent',
                labels: { style: { color: 'white' } },
                lineColor: 'white',
                minorGridLineColor: 'transparent',
                tickColor: 'white'
            },
            credits: { enabled: false, text: "" },
            plotOptions: { spline: { fillOpacity: 0.5 } },
            series: [{ showInLegend: false, name: 'Players Online', marker: { enabled: false }, lineColor: '#33ff00', color: '#33ff00', lineWidth: 4 }]
        });

        function stats(chanid) {
            fetch("https://api.subscriberwars.space/minecraft/java/" + chanid)
                .then(res => res.json())
                .then(data => {
                    page_title.innerHTML = data.name + "'s Live Player Count"
                    channel_title.innerHTML = data.name
                    channel_image.src = data.logo
                    channel_subscribers.innerHTML = data.player_count
                    channel_views.innerHTML = data.max_players
                    channel_goal.innerHTML = data.version
                    gdata.innerHTML = data.player_count

                    var result = gdata.innerHTML
                    var inject = parseFloat(result)

                    if (chart.series[0].points.length >= 180) {
                        chart.series[0].data[0].remove()
                    }
                    chart.series[0].addPoint([Date.now(), inject])
                })
        }

        stats(channel)
        setInterval(function () {
            stats(channel)
        }, 10000)
    })
</script>
