<!DOCTYPE html>
<head>
    <title>Live Twitter Follower Count</title>
    <meta name="description" content="Live Twitter Stats">
    <link rel="stylesheet" href="/css/odometer.css">
    <link rel="stylesheet" href="/css/main.css">
    <script src="/js/odometer.js"></script>
    <script src="https://code.highcharts.com/highcharts.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
    <div id="count-block">
        <img id="logo" src="https://subscriberwars.space/logo/twitter.svg" alt="">
        <h1 id="title">Loading...</h1>
        <div id='playercount' class="odometer odometer-auto-theme" style="font-size: 120pt; font-weight: 500; text-align: center; margin: 0px auto; margin-top: 10px; margin-bottom: 10px; position: relative; width: 1260px;">0</div>
        <h2>Players</h2>
    </div>
    <div id="mini-counts">
        <div id="like-box">
            <div id='maxcount' class="odometer odometer-auto-theme" style="font-size: 30pt; font-weight: 500; text-align: center; margin: 0px auto; margin-top: 10px; margin-bottom: 10px; position: relative; width: 411px;">0</div>
            <h2>Max Players</h2>
        </div>
    </div>
</body>

<script>
var channel = window.location.href.split('?s=')[1] || '';

function update(chanid) {
    fetch('https://api.minetools.eu/ping/'+chanid).then(res => res.json()).then(data => {
        title.innerHTML = channel
        playercount.innerHTML= data.players.online
        maxcount.innerHTML= data.players.max
        logo.src = data.favicon
        if(data.followers>=0) {goal01.innerHTML=10}
        if(data.followers>=10) {goal01.innerHTML=100}
        if(data.followers>=100) {goal01.innerHTML=1000}
        if(data.followers>=1000) {goal01.innerHTML=(Math.floor(data.followers/1000)*1000)+1000}
        if(data.followers>=10000) {goal01.innerHTML=(Math.floor(data.followers/10000)*10000)+10000}
        if(data.followers>=100000) {goal01.innerHTML=(Math.floor(data.followers/100000)*100000)+100000}
        if(data.followers>=1000000) {goal01.innerHTML=(Math.floor(data.followers/1000000)*1000000)+1000000}
        if(data.followers>=10000000) {goal01.innerHTML=(Math.floor(data.followers/10000000)*10000000)+10000000}
        if(data.followers>=100000000) {goal01.innerHTML=(Math.floor(data.followers/100000000)*100000000)+100000000}
        goalcount.innerHTML=goal01.innerHTML-data.followers
    });
}

// Intervals
setInterval(() => {
    update(channel);
}, 5000);

update(channel)

</script>
