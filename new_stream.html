<script>
        var graph_0;
        var graph_1;
        graph_0 = Highcharts.chart({
            chart: {
                renderTo: 'graph_0',

                backgroundColor: 'transparent',

        });
        graph_1 = Highcharts.chart({
            chart: {
                renderTo: 'graph_1',

            },

            series: [{ showInLegend: false, name: 'Subscribers', marker: { enabled: false }, lineColor: 'blue', color: 'blue', lineWidth: 4 }]
        });

var id0="UCq-Fj5jknLsUf-MWSy4_brA"
var id1="UCX6OQ3DkcsbYNE6H8uQQuVA"
var s0=[]; var s1=[];
const list_0 = [];
const list_1 = [];
    
    function load() {
        const banner_0 = document.getElementById("banner_0")
        const banner_1 = document.getElementById("banner_1")
        banner_0.src='https://www.banner.yt/'+id0+'?width=1240';
        banner_1.src='https://www.banner.yt/'+id1+'?width=1240';
        fetch('https://api.subscriberwars.space/stream/'+id0).then(res => res.json()).then(data => {
        title_0.innerHTML = data.name
        pfp_0.src = data.pfp
        views_0.innerHTML = data.estCounts[1]
        videos_0.innerHTML = data.apiCounts[2]
        subs_0.innerHTML = data.estCounts[0]
        });
        fetch('https://api.subscriberwars.space/stream/'+id1).then(res => res.json()).then(data => {
        title_1.innerHTML = data.name
        pfp_1.src = data.pfp
        views_1.innerHTML = data.estCounts[1]
        videos_1.innerHTML = data.apiCounts[2]
        subs_1.innerHTML = data.estCounts[0]
        });
    }
    load()

    function update() {
        fetch('https://api.subscriberwars.space/stream/'+id0).then(res => res.json()).then(data => {
        views_0.innerHTML = data.estCounts[1]
        videos_0.innerHTML = data.apiCounts[2]
        subs_0.innerHTML = data.estCounts[0]
        s0 = data.estCounts[0]
        list_0.unshift(data.estCounts[0]) //unsift -> add start | push -> add end
        if (list_0.length>43200){list_0.pop()} //shift -> rem start | pop -> rem end
        if (list_0.length>1800){tseries_01hr.innerHTML=data.estCounts[0]-list_0[1799]}
        if (list_0.length>43199){tseries_24hr.innerHTML=data.estCounts[0]-list_0[43199]}
        if (list_0.length<1800){tseries_01hr.innerHTML= data.estCounts[0]-list_0[list_0.length-1]}
        if (list_0.length<43199){tseries_24hr.innerHTML= data.estCounts[0]-list_0[list_0.length-1]}
        if (graph_0.series[0].points.length >= 1800) {
            graph_0.series[0].data[0].remove()
        }
        graph_0.series[0].addPoint([Date.now(), data.estCounts[0]])
        });
        fetch('https://api.subscriberwars.space/stream/'+id1).then(res => res.json()).then(data => {
        views_1.innerHTML = data.estCounts[1]
        videos_1.innerHTML = data.apiCounts[2]
        subs_1.innerHTML = data.estCounts[0]
        s1 = data.estCounts[0]
        list_1.unshift(data.estCounts[0]) //unsift -> add start | push -> add end
        if (list_1.length>43200){list_1.pop()} //shift -> rem start | pop -> rem end
        if (list_1.length>1800){mrbeast_01hr.innerHTML=data.estCounts[0]-list_1[1799]}
        if (list_1.length>43199){mrbeast_24hr.innerHTML=data.estCounts[0]-list_1[43199]}
        if (list_1.length<1800){mrbeast_01hr.innerHTML= data.estCounts[0]-list_1[list_1.length-1]}
        if (list_1.length<43199){mrbeast_24hr.innerHTML= data.estCounts[0]-list_1[list_1.length-1]}
        if (graph_1.series[0].points.length >= 1800) {
            graph_1.series[0].data[0].remove()
        }
        graph_1.series[0].addPoint([Date.now(), data.estCounts[0]])
        });
        sub_gap.innerHTML = s0-s1
    }

    function time() {
        const time = new Date()
        sw_time.innerHTML= "Penrith, CU, United Kingdom, "+time.toLocaleString('en-GB', {timeZone: 'Europe/London', weekday: 'short', day: '2-digit', month: 'short', year:'numeric', hour: '2-digit', hour12: true, minute: '2-digit', second: '2-digit'})
        ts_time.innerHTML= "New Delhi, NCT, India, "+time.toLocaleString('en-GB', {timeZone: 'Asia/Kolkata', weekday: 'short', day: '2-digit', month: 'short', year:'numeric' ,hour: '2-digit', hour12: true, minute: '2-digit', second: '2-digit'})
        mb_time.innerHTML= "Greenville, NC, United States, "+time.toLocaleString('en-GB', {timeZone: 'America/New_York', weekday: 'short', day: '2-digit', month: 'short', year:'numeric', hour: '2-digit', hour12: true, minute: '2-digit', second: '2-digit'})
    }

    setInterval(update,2000)
    setInterval(load,60000)
    setInterval(time,1000)
</script>
