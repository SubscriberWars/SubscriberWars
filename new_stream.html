<!DOCTYPE html>

<script src="https://code.highcharts.com/highcharts.js"></script>
<link rel="stylesheet" href="https://subscriberwars.space/css/odometer.css">
<script src="https://subscriberwars.space/js/odometer.js"></script>
<script src="https://kit.fontawesome.com/93168af8d4.js" crossorigin="anonymous"></script>
<link href="https://fonts.googleapis.com/css?family=Roboto:100,200,300,400,500,600,700,800" rel="stylesheet" type="text/css">

<style>
    body {
        background-color: #0f0f0f;
        height: 1080px;
        width: 1920px;
        border: 1px dashed red;
        font-family: roboto;
        color: #fff;
    }
    #top_container {
        margin: 10px;
        height: 625px;
        width: 1900px;
        display: flex;
    }
    #bottom_container {
        margin-left: 10px;
        margin-right: 10px;
        margin-bottom: 10px;
        width: 1900px;
        height: 425px;
        display: flex;
    }
    #inner_center_container {
        margin-left: 10px;
        margin-right: 10px;
        height: 625px;
    }
    .main_box {
        background-color: #000;
        height: 622px;
        width: 740px;
        border-radius: 10px;
    }
    .main_box_outer_container {
        width: 720px;
        height: 150px;
        margin: 10px;
        display: flex;
    }
    .main_box_inner_container {
        width: 560px;
        margin-left: 10px;
    }
    .stats_container {
        font-size: 35px;
        font-weight: 400;
    }
    .upper_center_box {
        background-color: #000;
        height: 200px;
        width: 400px;
        margin-bottom: 11px;
        border-radius: 10px;
        text-align: center;
    }
    .bottom_box {
        background-color: #000;
        height: 425px;
        width: 365px;
        margin-right: 10px;
        border-radius: 10px;
        text-align: center;
    }
    .bottom_center_box {
        background-color: #000;
        height: 425px;
        width: 400px;
        margin-right: 10px;
        border-radius: 10px;
        text-align: center;
    }
    .header {
        font-size: 30px;
    }
    .pfp {
        width: 150px;
        height: 150px;
        border-radius: 10px;
    }
    h1 {
        font-weight: 500;
        font-size: 50px;
        margin: 0;
    }
    .subs_container {
        text-align: center;
        width: 100%;
        height: 160px;
    }
    .subs {
        font-weight: 500;
        font-size: 130px;
    }
</style>

<body>
    <div id="top_container">
        <div class="main_box">
            <div class="main_box_outer_container">
                <img class="pfp" id="pfp_0">
                <div class="main_box_inner_container">
                    <h1 id="title_0">User</h1>
                    <div class="stats_container">
                        <i class="fa fa-eye"></i>
                        <span class="odometer" id="views_0"></span>
                        <i class="fa fa-sharp fa-video"></i>
                        <span class="odometer" id="videos_0"></span>
                    </div>
                    <div class="stats_container">
                        <span>1-Hour:</span>
                        <span class="odometer" id="hr_0"></span>
                        <span>&nbsp;&nbsp;1-Day:</span>
                        <span class="odometer" id="day_0"></span>
                    </div>
                </div>
            </div>
            <div class="subs_container">
                <span class="subs odometer" id="subs_0"></span>
            </div>
        </div>
        <div id="inner_center_container">
            <div class="upper_center_box">
                <span class="header">1-Hour Gap</span>
            </div>
            <div class="upper_center_box">
                <span class="header">1-Day Gap</span>
            </div>
            <div class="upper_center_box"></div>
        </div>
        <div class="main_box">
            <div class="main_box_outer_container">
                <img class="pfp" id="pfp_1">
                <div class="main_box_inner_container">
                    <h1 id="title_1">User</h1>
                    <div class="stats_container">
                        <i class="fa fa-eye"></i>
                        <span class="odometer" id="views_1"></span>
                        <i class="fa fa-sharp fa-video"></i>
                        <span class="odometer" id="videos_1"></span>
                    </div>
                    <div class="stats_container">
                        <span>1-Hour:</span>
                        <span class="odometer" id="hr_1"></span>
                        <span>&nbsp;&nbsp;1-Day:</span>
                        <span class="odometer" id="day_1"></span>
                    </div>
                </div>
            </div>
            <div class="subs_container">
                <span class="subs odometer" id="subs_0"></span>
            </div>
        </div>
    </div>
    <div id="bottom_container">
        <div class="bottom_box">
            <span class="header">T-Series' Latest Video</span>
        </div>
        <div class="bottom_box">
            <span class="header">1-Min Averages</span>
        </div>
        <div class="bottom_center_box">
            <span class="header">Subscriber Gap</span>
        </div>
        <div class="bottom_box">
            <span class="header">MrBeast Studio Data</span>
        </div>
        <div class="bottom_box" style="margin-right: 0;">
            <span class="header">MrBeast's Latest Video</span>
        </div>
    </div>
</body>

<script></script>
